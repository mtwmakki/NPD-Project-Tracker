@container (max-width:760px){
  .db-wk{display:flex;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding:0 12px;scrollbar-width:none;padding-bottom:6px}
  .db-wk::-webkit-scrollbar{display:none}
  .db-wd{flex:0 0 168px;min-height:0;scroll-snap-align:start;background:color-mix(in srgb,var(--tx) 3%,transparent)}
}
.db-more{display:flex;align-items:center;gap:12px;margin:8px 4px 0;font:600 15px/20px var(--fb);color:var(--mu)}
.db-more::after{content:"";flex:1;height:1px;background:var(--line)}
.db-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:inherit;align-items:start}
.db-fl{display:grid;gap:14px}
.db-flh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font:500 14px/20px var(--fb)}
.db-flh>span:first-child{margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-flh .o{font-size:13px;color:var(--mu);white-space:nowrap}
.db-flh b{font:600 14px/20px var(--fn);font-variant-numeric:tabular-nums}
.db-stk{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.db-stk:empty{background:var(--track)}
.db-stk.lg{height:10px;border-radius:5px}
.db-stk i{display:block;height:100%;transform-origin:left;animation:grow calc(900ms*var(--k)) var(--ease-out) backwards;animation-delay:calc(250ms*var(--k) + var(--i)*70ms*var(--k))}
.db-stk .bad,.db-lgd .bad{background:var(--bad)}
.db-stk .warn,.db-lgd .warn{background:var(--warn)}
.db-stk .ok,.db-lgd .ok{background:var(--ok)}
.db-stk .neu,.db-lgd .neu{background:color-mix(in srgb,var(--mu) 42%,transparent)}
.db-lgd{display:flex;flex-wrap:wrap;gap:8px 16px;font:400 13px/16px var(--fb);color:var(--mu)}
.db-lgd span{display:inline-flex;align-items:center;gap:6px}
.db-lgd i{width:10px;height:10px;border-radius:3px}
.db-lgd b{font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
.db-wr{display:grid}
.db-wrh{padding-bottom:4px;font:500 12.5px/16px var(--fb);color:var(--mu)}
.db-wr div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:18px}
.db-wr div span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-wr b{font-weight:600;font-variant-numeric:tabular-nums}
.db-note{margin:0;font-size:12.5px;color:var(--mu)}
.db-clr{display:flex;align-items:flex-start;gap:12px;margin:0;padding:14px 20px;border:1px dashed var(--line-2);border-radius:var(--r-card);color:var(--mu);font:400 14px/20px var(--fb)}
.db-clr svg{flex:none;margin-top:1px;color:var(--ok)}
.db-clr b{color:var(--tx);font-weight:600}
.db-clr small{display:block;font-size:12.5px;line-height:18px}
.db-clr b + small,.db-clr span>*:not(:first-child){margin-top:2px}
.db :is(.db-tile,.db-main,.db-cc,.db-wi,.db-link):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (max-width:720px){
  .db-greet{display:block}
  .db-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .db-tile{padding:12px 14px;gap:2px}
  .db-tn{font-size:22px;line-height:28px}
  .db-tt{font-size:12px}
  .db-needs>.ph,.db-week>.ph{padding:14px 16px 6px}

/* ───────── PROJECT PAGE (every style): 1 name and health · 2 what happens next · 3 progress and people · 4 reference details ───────── */
.pj{gap:16px}
:root .ibtn.pj-back{width:auto;display:inline-flex;align-items:center;gap:2px;padding:0 16px 0 10px;border-radius:var(--r-pill);font:600 15px/1 var(--fb);white-space:nowrap}
.pj-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 24px;padding:2px 4px 0;min-width:0}
.pj-h1{flex:1 1 420px;min-width:0;display:grid;gap:8px}
.pj-name{margin:0;font-family:var(--fd);font-weight:var(--h-w);font-size:24px;line-height:30px;letter-spacing:-.02em;text-transform:none;text-wrap:balance;width:fit-content;max-width:100%;overflow-wrap:anywhere}
.pj-hl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:400 14px/20px var(--fb)}
.pj-hl .pill svg{flex:none}
.pj-hl .r{color:var(--mu)}
.pj-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pj-acts .btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;text-decoration:none}
.pj-l2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:inherit}
.pj-c{display:grid;gap:6px;align-content:start;padding:16px 20px 18px;min-width:0;font:inherit;color:inherit;text-align:left}
button.pj-c{cursor:pointer;appearance:none}
button.pj-c:hover{border-color:var(--line-2)}
button.pj-c:active{transform:scale(.99)}
.pj-lab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;font:500 13px/16px var(--fb);color:var(--mu);text-transform:var(--lab-tt);letter-spacing:var(--lab-ls)}
.pj-lab>span{font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.pj-v{display:block;font:600 17px/24px var(--fb);min-width:0;overflow-wrap:anywhere}
.pj-vb{border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer;border-radius:4px}
.pj-vb:hover{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.pj-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font:400 13px/18px var(--fb);color:var(--mu)}
.pj-meta.late{color:var(--bad);font-weight:600}
.pj .late{color:var(--bad)}
.pj-unset{color:var(--mu);font-weight:400}
.pj-na{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px;align-items:start;margin:-8px 0 0 -12px}
.pj-nb{display:grid;gap:4px;padding-top:10px;min-width:0}
.pj-av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ac);color:var(--on-ac);font:700 9.5px/1 var(--fb);flex:none}
.pj-mini{border:0;background:none;color:var(--ac);font:600 13px/16px var(--fb);padding:12px 10px;margin:-12px -10px;border-radius:var(--r-sm);cursor:pointer;text-transform:none;letter-spacing:0}
.pj-mini:hover{background:var(--hover)}
.pj-steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:4px}
.pj-steps i{display:block;height:6px;border-radius:3px;background:var(--track)}
.pj-steps i.d{background:color-mix(in srgb,var(--ac) 50%,transparent)}
.pj-steps i.c{background:var(--ac)}
.pj-stl{display:flex;justify-content:space-between;gap:8px;font:400 12px/16px var(--fb);color:var(--mu)}
.pj-stl span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-ms{display:flex;align-items:center;gap:16px;padding:10px 16px 10px 20px;min-width:0}
.pj-msl{flex:none;font:500 13px/16px var(--fb);color:var(--mu);text-transform:var(--lab-tt);letter-spacing:var(--lab-ls)}
.pj-msr{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:2px 0}
.pj-msr::-webkit-scrollbar{display:none}
.pj-mn{flex:none;display:flex;align-items:center;gap:8px;max-width:220px;min-height:44px;padding:4px 10px 4px 8px;border:0;border-radius:var(--r-sm);background:none;color:inherit;font:inherit;text-align:left}
button.pj-mn{cursor:pointer;transition:background-color .2s}
button.pj-mn:hover{background:var(--hover)}
.pj-mn svg{flex:none;color:var(--mu)}
.pj-mn>span{display:grid;min-width:0}
.pj-mn b{font:600 13.5px/18px var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-mn span span{font:400 12px/16px var(--fb);color:var(--mu);white-space:nowrap}
.pj-mn.done svg{color:var(--ok)}
.pj-mn.missed svg,.pj-mn.missed span span{color:var(--bad)}
.pj-ml{flex:1 0 16px;min-width:16px;height:1px;background:var(--line-2)}
.pj-today{flex:none;padding:3px 8px;border-radius:var(--r-pill);background:var(--ac);color:var(--on-ac);font:700 10.5px/14px var(--fb);letter-spacing:.06em;text-transform:uppercase}
.pj-msadd{flex:none;display:inline-flex;align-items:center;gap:6px}
.pj-msempty{flex:1;min-width:0;color:var(--mu);font-size:13.5px;line-height:20px}
.pj-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:inherit;align-items:start}
.pj-side{display:grid;gap:inherit;min-width:0}
.pj-sc{padding:2px 0}
.pj-sb{display:grid;gap:10px;padding:14px 20px}
.pj-sb + .pj-sb{border-top:1px solid var(--line)}
.pj-sbh{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
.pj-sbh b{font:600 15px/20px var(--fb)}
.pj-sbh>span{font:400 13px/16px var(--fb);color:var(--mu)}
.pj-pb{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.pj-pb i{display:block;height:100%;border-radius:inherit;background:var(--prog);transform-origin:left;animation:grow calc(900ms*var(--k)) var(--ease-out) backwards;animation-delay:calc(200ms*var(--k))}
.pj-note{margin:0;font-size:13px;line-height:18px;color:var(--mu)}
.pj-add{width:44px;height:44px;margin:-8px -12px -8px 0;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--ac);cursor:pointer;transition:background-color .2s}
.pj-add:hover{background:var(--hover)}
.pj-ppl{display:grid;gap:2px;margin:0 -8px}
.pj-pp{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 8px;border:0;border-radius:var(--r-sm);background:none;color:inherit;font:500 14px/20px var(--fb);text-align:left;min-width:0}
button.pj-pp{cursor:pointer}
button.pj-pp:hover{background:var(--hover)}
.pj-pp i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--fb);font-style:normal;flex:none}
.pj-pp>span:nth-of-type(1){min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-pp .role{margin-left:auto;padding-left:8px;font-size:12.5px;font-weight:400;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pj-det{padding:12px 20px 14px;border:1px solid var(--line);border-radius:var(--r-card);min-width:0}
.pj-dh{display:flex;align-items:center;justify-content:space-between;min-height:28px;font:600 12px/16px var(--fb);color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.pj-dr{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font:400 13px/18px var(--fb)}
.pj-dr>span:first-child{flex:none;color:var(--mu)}
.pj-dr>span:last-child{min-width:0;text-align:right;overflow-wrap:anywhere}
.pj-dr .mono{font:500 12.5px/18px var(--fm)}
.pj-dr a{color:var(--ac);text-decoration:none}
.pj-dr a:hover{text-decoration:underline}
.tgroup .pj-add{margin:-14px -10px -14px 0;text-transform:none}
.tg-fold{width:100%;border:0;background:none;cursor:pointer;justify-content:flex-start;padding:12px 2px 6px;text-align:left}
.tg-fold>span{display:inline-flex;align-items:center;gap:6px}
.tg-fold svg{transition:transform calc(250ms*var(--k)) var(--ease-out)}
.tg-fold[aria-expanded="true"] svg{transform:rotate(90deg)}
.tg-fold:hover{color:var(--tx)}
.pj :is(.pj-c,.pj-vb,.pj-mini,.pj-mn,.pj-add,.pj-pp,.db-cc,.tg-fold):focus-visible,.ibtn.pj-back:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (max-width:1040px){.pj-body{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){
  .pj-name{font-size:22px;line-height:28px}
  .pj-l2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pj-next{grid-column:1/-1}
  .pj-c{padding:12px 14px 14px}
  .pj-stl,.pj-hl .r{display:none}
  .pj-ms{flex-wrap:wrap;gap:4px 12px;padding:12px 14px}
  .pj-msr{order:3;flex-basis:100%;padding-right:32px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
  .pj-msadd{margin-left:auto}
  .pj-sb{padding:12px 16px}
  .pj-det{padding:10px 16px 12px}
}

/* ───────── LOGIN (every style) ─────────
   Laptop: a brand side (logo, one line, a glimpse of the tracker) next to the form. Tablet: one column.
   Phone: brand on top, the form in a sheet at the bottom within thumb reach; it moves up while the keyboard is open. */
#login{overflow-y:auto}
#login .lg-shell{position:relative;z-index:1;width:min(1040px,100%);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,400px);gap:64px;align-items:center}
#login .lg-brand{display:grid;gap:24px;align-content:center;min-width:0;animation:cardin calc(1000ms*var(--k)) var(--ease-out) backwards;
  transition:opacity calc(500ms*var(--k)),transform calc(700ms*var(--k)) var(--ease-out)}
#login.out .lg-brand{opacity:0;transform:translateY(-10px) scale(.98)}
.lg-mark{display:flex;align-items:center;gap:12px;font:600 17px/1 var(--fb);color:var(--tx)}
#login .lg-mark .lg-logo{width:40px;height:40px}
.lg-pitch{margin:0;max-width:14ch;font:var(--h-w,700) 40px/1.1 var(--fd);letter-spacing:-.02em;color:var(--tx);text-wrap:balance}
.lg-pitch span{color:var(--mu)}
/* the glimpse: three small cards showing what the tracker keeps an eye on (an illustration, not live data) */
.lg-glimpse{display:grid;gap:12px;justify-items:start;max-width:440px}
.gcard{display:grid;gap:8px;width:72%;padding:14px 16px;border-radius:20px;background:color-mix(in srgb,var(--surf-solid) 72%,transparent);border:1px solid var(--line);
  box-shadow:0 12px 32px -16px rgba(0,0,0,.35);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);font:400 13px/1.35 var(--fb);color:var(--tx)}
.gcard.g2{margin-left:22%}
.gcard.g3{margin-left:8%;width:56%}
.gcard .gk{font:500 12px/1 var(--fm);color:var(--mu)}
.gcard b{font-weight:600;font-size:15px;line-height:20px}
.gmeter{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.gmeter i{height:4px;border-radius:2px;background:var(--line-2)}
.gmeter i.on{background:var(--ac)}
.gchip{justify-self:start;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:600 12px/1 var(--fb)}
.gchip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.gchip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.gchip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.gbar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.gbar i{display:block;width:72%;height:100%;border-radius:inherit;background:var(--ac)}
/* the form */
#login .lg-card{width:100%;gap:16px;padding:32px 28px 24px}
.lg-head{display:grid;gap:4px}
#login .lg-name{margin:0;font:var(--h-w,700) 28px/1.15 var(--fd);letter-spacing:-.02em;text-wrap:balance}
#login .lg-hello{margin:0;font:400 14px/20px var(--fb);color:var(--mu)}
#login .fld{gap:8px}
#login .fld label{padding:0;font:500 13px/16px var(--fb);letter-spacing:0;color:var(--mu)}
.fld-lr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#login .fld-lr .lnk{font:500 13px/16px var(--fb);color:var(--ac);text-decoration:none}
#login .fld-lr .lnk:hover{text-decoration:underline}
#login .fld input{height:48px;min-height:48px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:color-mix(in srgb,var(--surf-solid) 88%,transparent);
  color:var(--tx);font:500 16px var(--fb);box-shadow:none}
#login .fld input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
#login .fld.bad input{border-color:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 16%,transparent)}
.pw-wrap{position:relative}
#login .pw-wrap input{padding-right:52px}
.pw-eye{position:absolute;right:4px;top:4px;width:44px;height:40px;border:0;border-radius:10px;background:none;color:var(--mu);display:grid;place-items:center;cursor:pointer}
.pw-eye:hover{color:var(--tx);background:var(--hover)}
.pw-eye .eye-off,.pw-eye[aria-pressed="true"] .eye-on{display:none}
.pw-eye[aria-pressed="true"] .eye-off{display:block}
.fld-err{margin:0;font:500 13px/18px var(--fb);color:var(--bad)}
.fld-err:empty{display:none}
.fld-hint{margin:0;font:500 13px/18px var(--fb);color:var(--warn)}
.lg-keep{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;margin:-4px 0;width:max-content;font:400 14px/20px var(--fb);color:var(--tx);cursor:pointer;user-select:none}
.lg-keep input{position:absolute;opacity:0;pointer-events:none}
.lg-keep .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s,color .2s}
.lg-keep input:checked + .ck{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.lg-keep input:focus-visible + .ck{outline:2px solid var(--ac);outline-offset:2px}
#login .lg-err{min-height:0;margin:0;font:500 13px/18px var(--fb)}
#login .lg-err:empty{display:none}
.lg-go{height:52px;border:0;border-radius:999px;background:var(--ac-grad);color:var(--on-ac);font:600 16px/1 var(--fb);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
  box-shadow:0 10px 24px -10px color-mix(in srgb,var(--ac) 80%,transparent);transition:transform calc(300ms*var(--k)) var(--spring),filter .2s,background-color .3s}
.lg-go:hover{filter:brightness(1.06)}
.lg-go:active{transform:scale(.98)}
.lg-go:disabled{cursor:progress}
.lg-go .spin{display:none;border-color:color-mix(in srgb,var(--on-ac) 35%,transparent);border-top-color:var(--on-ac)}
.lg-go.busy .spin{display:block}
.lg-go.done{background:var(--ok);filter:none}
#login .lg-links{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#login .lg-links .lnk{font:500 13px/20px var(--fb);color:var(--mu);text-decoration:none;min-height:24px}
#login .lg-links .lnk:hover{color:var(--tx);text-decoration:underline}
#login .lg-links:not(:has(:not([hidden]))){display:none}
#login.checking :is(.fld,.lg-keep,.lg-go,.lg-links,.lg-err){display:none}
/* Liquid Glass: the glimpse cards are glass, the form sits on the frosted material */
:root[data-look="K"] .gcard{background:var(--glass);border-color:transparent;box-shadow:var(--glass-sh);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
:root[data-look="K"] #login .lg-card{border-radius:30px}
:root[data-look="K"] #login .lg-name{font-weight:700}
@media (max-width:900px){
  #login .lg-shell{grid-template-columns:minmax(0,420px);justify-content:center;gap:28px}
  #login .lg-brand{gap:16px}
  #login .lg-pitch{font-size:28px;max-width:18ch}
  #login .lg-glimpse{display:none}
}
@media (max-width:720px){
  #login{place-items:stretch;padding:0}
  #login .lg-shell{min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto;gap:16px;align-items:stretch;padding-top:calc(env(safe-area-inset-top,0px) + 40px)}
  #login .lg-brand{align-content:start;gap:16px;padding:0 24px}
  #login .lg-glimpse{display:grid;gap:8px}
  #login .lg-pitch{font-size:24px}
  #login .gcard{width:82%;padding:12px 14px}
  #login .gcard.g2,#login .gcard.g3{display:none}
  #login .lg-card{align-self:end;width:auto;margin:0 8px calc(8px + env(safe-area-inset-bottom,0px));padding:24px 20px 16px;border-radius:32px;gap:14px}
  #login .lg-name{font-size:22px}
  #login.kb .lg-pitch,#login.kb .lg-glimpse{display:none}
  #login.kb .lg-shell{grid-template-rows:auto 1fr;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
  #login.kb .lg-card{align-self:start}
}
@media (max-width:720px) and (max-height:800px){ #login .lg-glimpse{display:none} }   /* e.g. the Fold cover screen: the form fits without scrolling */

/* ───────── LOGO (Advent Studio app icon, every style) ─────────
   Dark tile #111110 with the #F2F1EC mark, 24% corners, mark 60.5% wide; on dark themes the light tile. */
:root[data-look] .brand i,:root[data-look] .lg-logo{background:#111110;color:#F2F1EC;border:0;border-radius:24%;box-shadow:none;font-size:0}
:root[data-look][data-theme="dark"] .brand i,:root[data-look][data-theme="dark"] .lg-logo{background:#FFFFFF;color:#111110}
.brand i svg,.lg-logo svg{width:60.5%;height:auto;display:block}
</style>

function spring(k, c){ let x = 0, v = 0, n = 0; const dt = 1/60, pts = [0];

/* ══════════ V1 BUSINESS RULES (ported as-is) ══════════ */
const pad2 = n => String(n).padStart(2, '0');

function addDays(s, n){ const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); }

const _isMoldTask = t => /mold\s*(inquiry|request)/i.test(t.name||'') && !/^follow/i.test(t.name||'');

const _isNpdTask  = t => /npd\s*input/i.test(t.name||'') && !/^follow/i.test(t.name||'');
function _isWorkDay(ds){ const d = new Date(ds + 'T00:00:00').getDay(); return d !== 0 && d !== 6; }
function addWorkDays(ds, n){ let d = ds; while (n > 0){ d = addDays(d, 1); if (_isWorkDay(d)) n--; } return d; }
/* working days in (a, b], negative when b is before a. Same result as V1's day-by-day loop,
   but counted with arithmetic, so long-open inquiries no longer slow the page down. */
const _WD_PREFIX = [0, 1, 2, 2, 2, 3, 4];   // blocks of 7 days start on a Thursday (1 Jan 1970)
function _dayNo(s){ const t = new Date(String(s).slice(0,10) + 'T00:00:00'); return isNaN(t) ? NaN : Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / 86400000) + 7e5; }
const _wdUpTo = x => Math.floor((x + 1) / 7) * 5 + _WD_PREFIX[(x + 1) % 7];
function workDaysBetween(a, b){
  if (a === b) return 0;
  const x = _dayNo(a), y = _dayNo(b); if (isNaN(x) || isNaN(y)) return 0;

}
function inquirySLA(inq){
  if (!inq || !inq.date || String(inq.status||'').toUpperCase() !== 'OPEN' || inq.outcome) return null;
  const today = todayStr(), day0 = inq.date, tasks = inq.tasks||[], pipe = inq.pipeline||{};
  const elapsed = Math.max(0, workDaysBetween(day0, today));
  const moldT = tasks.find(_isMoldTask), imlT = tasks.find(_isImlTask), npdT = tasks.find(_isNpdTask);
  const moldPipeDone = /^done$/i.test(pipe.moldInquiry?.status||'');
  const moldDone = !!(moldT && moldT.done) || moldPipeDone;
  const moldOn = (moldT && moldT.done && moldT.completedAt) || (moldPipeDone ? pipe.moldInquiry.date : '') || '';
  const costSt = pipe.costing?.status||'';
  const npdDone = !!(npdT && npdT.done) || /^(ongoing|done)$/i.test(costSt);
  const npdOn = (npdT && npdT.done && npdT.completedAt) || (/^(ongoing|done)$/i.test(costSt) ? pipe.costing.date : '') || '';
  const lastDay = addWorkDays(day0, SLA_DAYS);
  let npdDue = lastDay;
  if (moldDone && moldOn){ const d = addWorkDays(moldOn, 2); if (d < npdDue) npdDue = d; }
  const stages = [{key:'mold', label:'Send Mold Inquiry', due: addWorkDays(day0, 2), done: moldDone, doneOn: moldOn, task: moldT}];
  if (imlT) stages.push({key:'iml', label:'Send IML Inquiry', due: addWorkDays(day0, 2), done: !!imlT.done, doneOn: imlT.completedAt||'', task: imlT});
  stages.push({key:'npd', label:'NPD Input → Finance', due: npdDue, done: npdDone, doneOn: npdOn, task: npdT});

  stages.forEach(st => {
    if (st.done){ st.state = 'done'; return; }
    const left = workDaysBetween(today, st.due);
    st.state = st.due < today ? 'overdue' : left <= SLA_RISK_DAYS ? 'risk' : 'ok';
  });
  const allTasksDone = tasks.length > 0 && tasks.every(t => t.done) && !(inq.nextActions||[]).some(n => !n.done);

  if (npdDone){
    res.took = npdOn ? Math.max(0, workDaysBetween(day0, npdOn)) : null;
    res.met = res.took === null ? null : res.took <= SLA_DAYS;
    res.state = 'done';
  } else {
    res.current = stages.find(st => !st.done) || stages[stages.length - 1];
    res.state = elapsed > SLA_DAYS ? 'overdue' : stages.reduce((m, st) => rank[st.state] > rank[m] ? st.state : m, 'ok');
  }
  return res;
}

function inqState(i){
  if (isClosedInq(i)) return {k:'closed'};
  if (String(i.status||'').toUpperCase() === 'ON-HOLD') return {k:'hold'};
  const s = inquirySLA(i);
  if (!s) return {k:'open'};
  if (s.stalled && s.state !== 'done') return {k:'stalled', sla:s};
  if (s.state === 'done') return {k:'done', sla:s};
  return {k: s.state === 'overdue' ? 'over' : s.state, sla:s};
}
const INQ_RANK = {over:0, risk:1, stalled:2, ok:3, open:4, done:5, hold:6, closed:7};
const ST_COLOR = {over:'var(--bad)', risk:'var(--warn)', stalled:'var(--info)', ok:'var(--ok)', open:'var(--mu)', done:'var(--ok)', hold:'var(--info)', closed:'var(--mu)'};
const ST_PILL  = {over:'bad', risk:'warn', stalled:'info', ok:'ok', open:'', done:'done', hold:'hold', closed:''};
function inqStateLabel(i, st){
  st = st || inqState(i);
  if (st.k === 'closed') return i.outcome ? OUTCOME_LABELS[i.outcome] || 'Closed' : 'Closed';
  if (st.k === 'hold') return 'On hold';
  if (st.k === 'open') return i.outcome ? OUTCOME_LABELS[i.outcome] || 'Open' : 'Open';
  if (st.k === 'stalled') return 'Needs next step';
  if (st.k === 'done') return st.sla.met === false ? `SLA missed · ${st.sla.took} days` : st.sla.took == null ? 'SLA done' : `SLA met · ${st.sla.took} day${st.sla.took === 1 ? '' : 's'}`;
  return {over:'Overdue', risk:'At risk', ok:'On track'}[st.k] + ` · WD ${st.sla.elapsed}/${SLA_DAYS}`;
}
function projHealth(p){

/* ══════════ DATA: read, merge-safe save ══════════ */
const DB = { data: null, ts: '', by: '', source: '', ops: [], saving: false, timer: null, lastPull: 0, err: '', retry: 0 };
function normalize(d){ d = d || {}; d.inquiries = d.inquiries || []; d.projects = d.projects || []; d.mtasks = d.mtasks || []; d.bin = d.bin || []; d.schedule = d.schedule || {}; return d; }
const coll = (d, name) => (d && d[name]) || [];
const findRec = (d, name, id) => coll(d, name).find(x => x.id === id);
async function bridgeRead(){
  const r = await fetch(SHEETS_BRIDGE_URL + '?action=read&token=' + encodeURIComponent(SHEETS_BRIDGE_TOKEN) + '&_=' + Date.now(), {cache:'no-store'});
  const j = await r.json();
  if (j && j.error) throw new Error(j.error);
  if (!j || !j._data) throw new Error('empty');
  return j;
}
/* Instant first paint: the last data seen on this device (also shown when the Sheet can't be reached).
   npd_tracker_v3 is the copy the retired V1 left behind; it is read once and then replaced by V2's own. */
const CACHE_KEY = 'npd2-cache';
function loadCache(){
  try { const raw = localStorage.getItem(CACHE_KEY) || localStorage.getItem('npd_tracker_v3'); if (!raw) return false;
    DB.data = normalize(JSON.parse(raw)); DB.source = 'cache'; return true; } catch(e){ return false; }
}
function saveCache(){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(DB.data)); localStorage.removeItem('npd_tracker_v3'); } catch(e){}   // storage full: skip
}
async function pull(opts = {}){
  if (DB.saving || DB.ops.length){ return; }           // never replace data while our own edits are pending
  setSync('busy');
  try {
    const j = await bridgeRead();
    DB.lastPull = Date.now(); DB.err = '';
    const changed = j._updatedAt !== DB.ts || DB.source !== 'live';
    if (changed && !DB.ops.length && !DB.saving){
      DB.data = normalize(JSON.parse(j._data)); DB.ts = j._updatedAt || ''; DB.by = j._updatedBy || ''; DB.source = 'live'; saveCache();
      if (!opts.silent || opts.first) softRender(opts.first); else renderWhenIdle();
    }
    setSync('ok');
    if (opts.manual) toast(changed ? `Loaded the latest data${DB.by ? ` · last saved by ${esc(String(DB.by))}` : ''}` : 'Already up to date', {icon:'check'});
  } catch(e){
    DB.err = String(e && e.message || e);
    setSync('err');
    if (opts.first && !DB.data) softRender(true);
    if (opts.manual) toast('Could not reach the Sheet. Showing the last copy on this device.', {icon:'x'});
  }
}
/* background refreshes wait for a quiet moment so they never interrupt a scroll or a tap */
function renderWhenIdle(){
  clearTimeout(DB.idleT);
  if (Date.now() - lastInput < 1200 || formOpen()){ DB.idleT = setTimeout(renderWhenIdle, 700); return; }
  softRender(false);
}
/* mutate: apply now (optimistic), queue the same patch for the merge-safe save */
/* Three kinds of patch, all safe to replay on top of the latest Sheet data:
   {coll, id, fn}        change one record (fn gets the record)
   {coll, add, at}       insert a new record (skipped if its id already exists)
   {coll, remove, bin}   remove a record; with bin:{id, kind} a copy goes to the recycle bin (data.bin) */
function applyOp(d, op){
  const list = d[op.coll] = d[op.coll] || [];
  if (op.add){
    if (list.some(x => x.id === op.add.id)) return true;
    const rec = JSON.parse(JSON.stringify(op.add));
    op.at === 'end' ? list.push(rec) : list.unshift(rec); return true;
  }
  if (op.remove){
    const ix = list.findIndex(x => x.id === op.remove); if (ix < 0) return false;
    const rec = list[ix];
    if (op.bin){ d.bin = d.bin || []; if (!d.bin.some(b => b.id === op.bin.id)) d.bin.push({id: op.bin.id, kind: op.bin.kind, code: rec.code, name: op.bin.name || rec.name, item: JSON.parse(JSON.stringify(rec)), deletedAt: todayStr()}); }
    list.splice(ix, 1); return true;
  }
  const r = list.find(x => x.id === op.id); if (!r) return false;
  op.fn(r); return true;
}
function mutate(ops, opts = {}){
  if (!DB.data) return false;
  ops.forEach(op => applyOp(DB.data, op));
  DB.ops.push(...ops);
  clearTimeout(DB.timer); DB.timer = setTimeout(commit, SAVE_DEBOUNCE_MS);
  setSync('saving');
  if (!opts.noRender) softRender(false);
  return true;
}
async function commit(){
  DB.timer = null;
  if (!DB.ops.length) return;
  if (DB.saving){ DB.timer = setTimeout(commit, 600); return; }
  DB.saving = true; setSync('saving');
  let failed = false;
  const ops = DB.ops.splice(0);
  try {
    const j = await bridgeRead();                                   // 1. latest data from the Sheet
    const fresh = normalize(JSON.parse(j._data));
    const otherSaved = j._updatedAt && j._updatedAt !== DB.ts;
    let missing = 0;
    ops.forEach(op => { if (!applyOp(fresh, op) && !op.remove) missing++; });   // 2. our patches only
    const ts = new Date().toISOString();
    const resp = await fetch(SHEETS_BRIDGE_URL, { method: 'POST', body: JSON.stringify({
      token: SHEETS_BRIDGE_TOKEN, _data: JSON.stringify(fresh), _updatedAt: ts, _updatedBy: meName() + ' (V2)' }) });
    const res = await resp.json();
    if (res && res.error){
      if (res.error === 'write_blocked'){ toast('The Sheet blocked this save as a safety check. Nothing was overwritten; reloading.', {icon:'x'}); DB.saving = false; DB.ops = []; DB.source = ''; failed = true; setTimeout(() => pull({}), 50); return; }
      throw new Error(res.error);
    }
    DB.data = fresh; DB.ts = ts; DB.by = meName() + ' (V2)'; DB.source = 'live'; DB.retry = 0;
    DB.ops.forEach(op => applyOp(DB.data, op));   // edits made while saving
    saveCache(); setSync('saved');
    if (otherSaved) toast('Merged with changes saved meanwhile on another device', {icon:'refresh'});
    if (missing) toast(`${missing} change${missing > 1 ? 's' : ''} skipped: the item was removed on another device`, {icon:'x'});
    softRender(false);
  } catch(e){
    failed = true;
    DB.ops.unshift(...ops);                                         // keep them and retry
    DB.retry = Math.min((DB.retry || 0) + 1, 6);
    setSync('err');
    toast('Not saved yet: no connection to the Sheet. Retrying…', {icon:'x'});
    clearTimeout(DB.timer); DB.timer = setTimeout(commit, 4000 * DB.retry);
  } finally {
    DB.saving = false;
    if (!failed && DB.ops.length && !DB.timer) DB.timer = setTimeout(commit, SAVE_DEBOUNCE_MS);
  }
}
addEventListener('beforeunload', e => { if (DB.ops.length || DB.saving){ e.preventDefault(); e.returnValue = ''; } });
setInterval(() => { if (AUTH.user && document.visibilityState === 'visible' && Date.now() - DB.lastPull > POLL_MS - 500) pull({silent:true}); }, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && AUTH.user && Date.now() - DB.lastPull > 8000) pull({silent:true}); });

/* sync pill */
function setSync(state){
  const s = $('#sync'), t = $('#sync-t'); if (!s) return;
  s.classList.toggle('busy', state === 'busy' || state === 'saving'); s.classList.toggle('err', state === 'err');
  const hm = d => d ? new Date(d).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : '';
  t.textContent = state === 'busy' ? 'Syncing…' : state === 'saving' ? 'Saving…' : state === 'err' ? (DB.ops.length ? 'Not saved · retrying' : 'Offline') : state === 'saved' ? `Saved ${hm(DB.ts)}` : `Synced ${hm(DB.lastPull)}`;
  s.title = DB.by ? `Last saved to the Sheet by ${DB.by} · ${DB.ts ? new Date(DB.ts).toLocaleString('en-GB') : ''}` : 'Reload the latest data from the Sheet';
}

function inqLog(rec, type, icon, text){ (rec.activityLog = rec.activityLog || []).push({ id: uid(), type, icon, text, by: meName(), date: todayStr(), time: nowHM() }); }
function projLog(rec, type, icon, text){ (rec.activityLog = rec.activityLog || []).push({ id: uid(), type, icon, text, by: meName(), date: todayStr(), time: nowHM() }); }
function setInqTaskDone(inqId, taskId, done){

/* ══════════ NOTIFICATIONS (V1 rules: missed · due soon · awaiting reply) ══════════ */
function snoozed(){ try { return JSON.parse(store.get('npd2-snooze', '{}')) || {}; } catch(e){ return {}; } }
function snooze(key, until){ const s = snoozed(); const today = todayStr(); Object.keys(s).forEach(k => { if (s[k] <= today) delete s[k]; }); if (until) s[key] = until; else delete s[key]; store.set('npd2-snooze', JSON.stringify(s)); }
function collectNotifications(scope){
  const d = DB.data; if (!d) return {missed:[], upcoming:[], awaiting:[]};
  const today = todayStr(), me = meName(), all = scope === 'all' && isLead();
  const vis = t => all || (t.pic || 'Adam') === me;
  const sn = snoozed();
  const missed = [], upcoming = [], awaiting = [];
  const push = (n, list) => { n.key = `${n.type}:${n.parentId}:${n.taskId}`; if (sn[n.key] && sn[n.key] > today) return; list.push(n); };
  if (inqOn()) d.inquiries.forEach(item => { if (isClosedInq(item)) return;
    (item.tasks||[]).filter(t => !t.done && vis(t)).forEach(t => {
      const n = {type:'inquiry', coll:'inquiries', parentId:item.id, taskId:t.id, parentCode:item.code, parentName:item.name, taskName:t.name, deadline:t.deadline, reminder:t.reminder, pic:t.pic||'Adam', fac: facOf(item)};
      if (t.status === 'awaiting-reply'){ if (!t.reminder || t.reminder <= today) push(n, awaiting); return; }
      if (!t.deadline) return;
      if (t.deadline < today) push(n, missed); else if (t.deadline <= addDays(today, TASK_UPCOMING_DAYS)) push(n, upcoming);
    });
  });
  if (inqOn()) d.inquiries.forEach(item => { if (isClosedInq(item) || item.outcome) return;
    (item.nextActions||[]).forEach((na, i) => { if (na.done || !na.deadline || !vis(na)) return;
      const n = {type:'na', coll:'inquiries', parentId:item.id, taskId: subKey(na, i), parentCode:item.code, parentName:item.name, taskName: na.action || 'Next action', deadline:na.deadline, pic:na.pic||'Adam', fac: facOf(item)};
      if (na.deadline < today) push(n, missed); else if (na.deadline <= addDays(today, TASK_UPCOMING_DAYS)) push(n, upcoming);
    });
  });
  d.projects.forEach(item => { if (isClosedProj(item)) return;
    (item.tasks||[]).filter(t => !t.done && vis(t)).forEach(t => {
      const n = {type:'project', coll:'projects', parentId:item.id, taskId:t.id, parentCode:item.code, parentName:item.name, taskName:t.name, deadline:t.deadline, reminder:t.reminder, pic:t.pic||'Adam', fac: facOf(item)};
      if (t.status === 'awaiting-reply'){ if (!t.reminder || t.reminder <= today) push(n, awaiting); return; }
      if (!t.deadline) return;
      if (t.deadline < today) push(n, missed); else if (t.deadline <= addDays(today, PROJECT_UPCOMING_DAYS)) push(n, upcoming);
    });
  });
  (d.mtasks||[]).filter(t => t.status !== 'done' && !t.archived && (all || (t.owner || 'Adam') === me)).forEach(t => {
    const n = {type:'mtask', coll:'mtasks', parentId:t.id, taskId:t.id, parentCode:'TASK', parentName:t.title, taskName:t.title, deadline:t.deadline, reminder:t.reminder, pic:t.owner||'Adam', fac:''};
    if (t.status === 'awaiting-reply'){ if (!t.reminder || t.reminder <= today) push(n, awaiting); return; }
    if (!t.deadline) return;
    if (t.deadline < today) push(n, missed); else if (t.deadline <= addDays(today, TASK_UPCOMING_DAYS)) push(n, upcoming);
  });
  missed.sort((a,b) => a.deadline < b.deadline ? -1 : 1);
  upcoming.sort((a,b) => a.deadline < b.deadline ? -1 : 1);
  awaiting.sort((a,b) => (a.reminder||'') < (b.reminder||'') ? -1 : 1);
  return {missed, upcoming, awaiting};
}
function canCompleteNotif(n){ return n.type === 'project' ? can('actions','complete') : n.type === 'mtask' ? can('tasks','complete') : n.type === 'na' ? can('inquiries','edit') : can('inquiries','edit') || can('actions','complete'); }
function canEditNotif(n){ return n.type === 'project' ? can('actions','edit') : n.type === 'mtask' ? can('tasks','edit') : can('inquiries','edit'); }
function completeNotif(n, done = true){
  if (n.type === 'na') return setInqNADone(n.parentId, n.taskId, done);
  if (n.type === 'inquiry') return setInqTaskDone(n.parentId, n.taskId, done);
  if (n.type === 'project') return setProjTaskDone(n.parentId, n.taskId, done);
  return setMTaskDone(n.parentId, done);
}

function subOf(list, key){ if (!list || key == null) return null; return key[0] === '#' ? list[+key.slice(1)] || null : list.find(x => x.id === key) || null; }
function subIdx(list, key){ const it = subOf(list, key); return it ? list.indexOf(it) : -1; }

/* ── project actions (V1 "Rolling Action Plan") ── */
function addProjTask(projId, v){
  const id = uid(), today = todayStr(), done = v.status === 'done';
  const t = {id, name: v.name, deadline: v.deadline || '', pic: v.pic || meName(), status: v.status || 'todo', reminder: v.status === 'awaiting-reply' ? v.reminder || '' : '', done, linkedSubStatus: v.linkedSubStatus || '', addedOn: today};
  if (done) t.completedAt = today;
  if (v.followupOf) t.followupOf = v.followupOf;
  mutate([{coll:'projects', id: projId, fn: r => { r.tasks = r.tasks || []; if (r.tasks.some(x => x.id === id)) return; r.tasks.push(clone(t));
    projLog(r, 'add', 'circle-plus', `Added action: ${strong(t.name)}${t.deadline ? ' · due ' + fmtDate(t.deadline) : ''}`); }}]);
  return id;
}
function editProjTask(projId, key, patch){
  const today = todayStr();

const CHASE_DAYS = 3, LATE_DAYS = 7, STALE_PROJECT_DAYS = 14, NEW_TASK_DAYS = 14, BURIED_DAYS = 30;
function lastUpdated(p){
  const today = todayStr(), c = [];
  if (p.statusDate) c.push(p.statusDate);
  (p.subStatuses||[]).forEach(s => { if (s.createdAt) c.push(s.createdAt); if (s.date) c.push(s.date); });
  (p.tasks||[]).forEach(t => { if (t.deadline) c.push(t.deadline); });
  if (p.date) c.push(p.date);

function recentTasks(x){
  const out = [];
  (x.tasks||[]).forEach(t => { if (!t.done && t.addedOn && daysSince(t.addedOn) <= NEW_TASK_DAYS) out.push({name: t.name, addedOn: t.addedOn}); });

/* ══════════ MOTION + UI HELPERS (from the approved prototype) ══════════ */
const TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;
/* page changes use a light CSS animation on the content: a view transition first snapshots the whole page
   (sidebar, glass, every card), which froze the screen for a moment on each tab change */
/* drop the GPU-layer hint once an entrance animation finishes, so finished cards don't hold layers */
document.addEventListener('animationend', e => { const t = e.target; if (t.classList && (t.classList.contains('st') || t.matches('#view,.tabbody'))) t.classList.add('anim-done'); });
const PAGE_VT = ['fwd','back','morph','morphback'], LIGHT_VT = ['fwd','back'];
function pageAnim(type){ const v = $('#view'); v.classList.remove('vt-fallback','vt-back','anim-done');
  void v.offsetWidth; v.classList.add(type === 'back' || type === 'morphback' ? 'vt-back' : 'vt-fallback'); }
function vt(fn, type){
  const ok = document.startViewTransition && S.motion !== 'off' && !TOUCH && !LIGHT_VT.includes(type);
  if (!ok){ fn(); if (PAGE_VT.includes(type) && S.motion !== 'off') pageAnim(type); return Promise.resolve(); }
  root.dataset.vt = type;
  const t = document.startViewTransition(fn);
  return t.finished.catch(() => {}).finally(() => { delete root.dataset.vt; });
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn,.b1,.ibtn,.seg button,.looks button'); if (!b || S.motion === 'off') return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, s = document.createElement('span');
  s.className = 'ripple'; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 700);
});
if (finePointer){
  document.addEventListener('pointermove', e => {
    const c = e.target.closest && e.target.closest('.card'); if (c){ const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX-r.left)+'px'); c.style.setProperty('--my', (e.clientY-r.top)+'px'); }
    const m = e.target.closest && e.target.closest('.b1');
    if (m && S.motion === 'full'){ const r = m.getBoundingClientRect(); m.style.transform = `translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.3}px)`; }
  }, {passive:true});
  document.addEventListener('pointerout', e => { const k = e.target.closest && e.target.closest('.b1'); if (k && !k.contains(e.relatedTarget)) k.style.transform = ''; });
}

const NPD_STAGES = ['Design','CAPEX Approval','Pilot Mold','Commercial Mold','Machine & Aux Equipment','IML Development','Production Ramp-Up'];   // the phases of the Gantt's NPD Procedure Template
const fmtDay = d => { const x = new Date(d + 'T00:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', ...(x.getFullYear() !== new Date().getFullYear() ? {year:'numeric'} : {})}); };
const wdN = n => `${n} working day${n === 1 ? '' : 's'}`;
function nextAction(p){ return nextOpenTask(p) || (p.tasks||[]).find(t => !t.done) || null; }
/* "Late · Delivery date 29 Oct passed · an action is 10 working days overdue": the first reason leads, the rest is muted */
function healthWhy(p){
  const h = projHealth(p), today = todayStr(), open = (p.tasks||[]).filter(t => !t.done && t.deadline).sort((a,b) => a.deadline < b.deadline ? -1 : 1), out = [];
  if (h === 'done') return ['Completed'];
  if (h === 'over'){
    if (p.deliveryDate && p.deliveryDate < today) out.push(`Delivery date ${fmtDate(p.deliveryDate)} passed`);
    const od = open.filter(t => t.deadline < today), k = od.length && Math.max(1, workDaysBetween(od[0].deadline, today));
    if (od.length) out.push(od.length === 1 ? `An action is ${wdN(k)} overdue` : `${od.length} actions overdue, the oldest by ${wdN(k)}`);
  } else if (h === 'risk'){
    if (p.deliveryDate && p.deliveryDate <= addDays(today, 14)){ const k = workDaysBetween(today, p.deliveryDate); out.push(k <= 0 ? 'Delivery is due today' : `Delivery in ${wdN(k)}`); }
    const soon = open.find(t => t.deadline >= today && t.deadline <= addDays(today, 3));
    if (soon) out.push(soon.deadline === today ? 'An action is due today' : `An action is due ${fmtDay(soon.deadline)}`);
  } else {
    const n = (p.tasks||[]).filter(t => !t.done).length;
    out.push(n ? `Nothing due in the next 3 days` : 'No open actions');
  }
  return out.length ? out : ['On track'];
}

  } else {
    const coll = BIN_KIND[b.kind].coll, item = clone(b.item);
    ops = [{coll, add: item, at:'start'}, {coll:'bin', remove: id}];
    undo = [{coll, remove: item.id}, {coll:'bin', add: entry, at:'end'}];
  }
  mutate(ops);
  changelog({type:'update', icon:'refresh', text:`Restored from the recycle bin: ${strong(nm)}`, section: BIN_KIND[b.kind].g});

document.addEventListener('click', e => {
  const t = e.target;
  const fd = t.closest('.fm-date'); if (fd){ e.stopPropagation(); if (DP.el && DP.field === fd) closeDP(false); else openDP(fd); return; }
  const cl = t.closest('[data-dclr]'); if (cl){ e.stopPropagation(); const b = cl.parentElement.querySelector('.fm-date'); closeDP(false); setDateField(b, ''); b.focus({preventScroll: true}); return; }
  if (!DP.el || !DP.el.contains(t)) return;
  e.stopPropagation();
  const nv = t.closest('[data-dpnav]'); if (nv){ dpShift(+nv.dataset.dpnav); return; }
  if (t.closest('[data-dpview]')){ DP.view = DP.view === 'days' ? 'months' : 'days'; dpRender(); dpPlace(); return; }
  const mo = t.closest('[data-dpm]'); if (mo){ DP.m = +mo.dataset.dpm; DP.view = 'days'; dpRender(); dpPlace(); return; }
  const st = t.closest('[data-dpset]'); if (st){ dpPick(st.dataset.dpset); return; }
}, true);
/* tapping outside closes the calendar without also triggering what was underneath */
addEventListener('pointerdown', e => {
  if (!DP.el || DP.el.contains(e.target) || DP.field.contains(e.target)) return;
  const other = e.target.closest && e.target.closest('.fm-date,[data-dclr]');
  closeDP(false); if (!other) DP.swallow = true;
}, true);
addEventListener('click', e => { if (DP.swallow){ DP.swallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
addEventListener('keydown', e => {
  if (!DP.el) return;
  if (e.key === 'Escape'){ e.preventDefault(); e.stopImmediatePropagation(); closeDP(true); return; }
  if (DP.view !== 'days') return;
  const step = {ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7}[e.key];
  if (step || e.key === 'PageUp' || e.key === 'PageDown'){
    e.preventDefault(); e.stopImmediatePropagation();
    const cur = dParse(DP.focus) || dParse(todayStr());
    const nd = step ? addDays(dstr(cur), step) : dstr(new Date(cur.getFullYear(), cur.getMonth() + (e.key === 'PageDown' ? 1 : -1), Math.min(cur.getDate(), 28)));
    const t = dParse(nd), dir = t.getFullYear() * 12 + t.getMonth() - (DP.y * 12 + DP.m);
    DP.focus = nd; if (dir){ DP.y = t.getFullYear(); DP.m = t.getMonth(); dpRender(dir); dpPlace(); }
    else $$('.dp-d', DP.el).forEach(b => b.tabIndex = b.dataset.dpset === nd ? 0 : -1);
    dpFocus();
  }
}, true);
addEventListener('resize', () => { if (DP.el && !DP.el.classList.contains('sheet')) closeDP(false); });
document.addEventListener('scroll', e => { if (DP.el && !DP.el.classList.contains('sheet') && !DP.el.contains(e.target)) dpPlace(); }, true);

/* ══════════ FORMS: one dialog for every add / edit ══════════
   field: {k, label, type, value, req, ph, half, hint, options:[[v,l]], show: vals => bool}
   types: text · textarea · date · number · select · chips · check · checks · products · sec */
const FM = { cfg: null, init: '', armed: false };
const formOpen = () => $('#form').classList.contains('open');
function fieldHTML(f){
  const id = 'fm-' + f.k, v = f.value == null ? '' : f.value;
  const lab = f.label ? `<label for="${id}">${esc(f.label)}${f.req ? ' <i class="req">*</i>' : ''}</label>` : '';
  let ctl = '';
  if (f.type === 'sec') return `<div class="fm-sec" data-fk="${f.k}">${esc(f.label)}</div>`;
  if (f.type === 'textarea') ctl = `<textarea id="${id}" data-k="${f.k}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else if (f.type === 'select') ctl = `<div class="fm-sel"><select id="${id}" data-k="${f.k}">${f.options.map(([o, l]) => `<option value="${esc(o)}" ${String(o) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
  else if (f.type === 'chips') ctl = `<div class="fm-chips" role="radiogroup" data-k="${f.k}" data-chips>${f.options.map(([o, l]) => `<button type="button" role="radio" data-v="${esc(o)}" class="${String(o) === String(v) ? 'on' : ''}" aria-checked="${String(o) === String(v)}">${esc(l)}</button>`).join('')}</div>`;
  else if (f.type === 'check') return `<div class="ff ${f.half ? 'half' : ''}" data-fk="${f.k}"><label class="fm-tog"><input type="checkbox" id="${id}" data-k="${f.k}" ${v ? 'checked' : ''}><i></i><span>${esc(f.label)}</span></label>${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</div>`;
  else if (f.type === 'checks') ctl = `<div class="fm-checks" data-k="${f.k}" data-checks>${f.options.map(([o, l, sub]) => `<label class="fm-ck"><input type="checkbox" value="${esc(o)}" ${(v || []).includes(o) ? 'checked' : ''}><i>${ico('check',13)}</i><span>${esc(l)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></label>`).join('')}</div>`;
  else if (f.type === 'date') ctl = dateFieldHTML(f, id);
  else if (f.type === 'products') ctl = `<div class="fm-prods" data-k="${f.k}" data-prods>${(v || []).map(prodRow).join('')}</div><button type="button" class="lnk fm-addp" data-addprod>+ Add product</button><div class="fm-rev" data-rev></div>`;
  else ctl = `<input id="${id}" data-k="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.type === 'number' ? 'min="0" step="any" inputmode="decimal"' : ''} ${f.list ? `list="${id}-dl"` : ''} autocomplete="off">${f.list ? `<datalist id="${id}-dl">${f.list.map(o => `<option value="${esc(o)}"></option>`).join('')}</datalist>` : ''}`;
  return `<div class="ff ${f.half ? 'half' : ''}" data-fk="${f.k}">${lab}${ctl}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}<em class="fm-err"></em></div>`;
}
const prodRow = p => `<div class="fm-prod" data-id="${esc(p.id || uid())}"><input data-pf="name" placeholder="Product name / size" value="${esc(p.name || '')}"><input data-pf="volume" type="number" min="0" inputmode="numeric" placeholder="Volume / yr" value="${p.volume || ''}"><input data-pf="cost" type="number" min="0" step="0.01" inputmode="decimal" placeholder="RM / pc" value="${p.cost || ''}"><button type="button" class="ibtn" data-delprod aria-label="Remove product">${ico('x',15)}</button></div>`;
function readForm(){
  const out = {};
  FM.cfg.fields.forEach(f => {
    if (f.type === 'sec') return;
    const box = $(`#form [data-fk="${f.k}"]`); if (!box) return;
    if (f.type === 'chips'){ const on = $('[data-chips] button.on', box); out[f.k] = on ? on.dataset.v : ''; }
    else if (f.type === 'check') out[f.k] = $('input', box).checked;
    else if (f.type === 'checks') out[f.k] = $$('input:checked', box).map(x => x.value);
    else if (f.type === 'date') out[f.k] = $('.fm-date', box).dataset.v || '';
    else if (f.type === 'products') out[f.k] = $$('.fm-prod', box).map(r => ({id: r.dataset.id, name: $('[data-pf="name"]', r).value.trim(), volume: parseFloat($('[data-pf="volume"]', r).value) || 0, cost: parseFloat($('[data-pf="cost"]', r).value) || 0})).filter(p => p.name);
    else { const el = $('[data-k]', box); out[f.k] = f.type === 'textarea' ? el.value.trim() : String(el.value).trim(); }
  });
  return out;
}
function formSync(){
  if (!FM.cfg) return;
  const vals = readForm();
  FM.cfg.fields.forEach(f => { if (!f.show) return; const box = $(`#form [data-fk="${f.k}"]`); if (box) box.classList.toggle('hide', !f.show(vals)); });
  const rev = $('#form [data-rev]');
  if (rev){ const t = (vals.products || []).reduce((s, p) => s + p.volume * p.cost, 0); rev.textContent = t > 0 ? 'Est. revenue ' + fmtRM(t) + ' / yr' : ''; }
}
function openForm(cfg){
  FM.cfg = cfg; FM.armed = false;
  const f = $('#form');
  f.innerHTML = `<div class="fm-card" role="dialog" aria-modal="true" aria-labelledby="fm-title">
    <div class="fm-head"><div style="min-width:0">${cfg.eyebrow ? `<span class="fm-eye">${esc(cfg.eyebrow)}</span>` : ''}<h2 id="fm-title">${esc(cfg.title)}</h2></div><button type="button" class="ibtn" data-fmx="cancel" aria-label="Close">${ico('x',18)}</button></div>
    <form class="fm-body" novalidate autocomplete="off">${cfg.fields.map(fieldHTML).join('')}<button type="submit" hidden></button></form>
    <div class="fm-foot">${cfg.del ? `<button type="button" class="btn fm-del" data-fmx="del">${ico('trash',15)}<span>${esc(cfg.del.label || 'Delete')}</span></button>` : ''}${cfg.extra ? `<button type="button" class="btn" data-fmx="extra">${ico(cfg.extra.icon || 'plus',15)}<span>${esc(cfg.extra.label)}</span></button>` : ''}<span class="fm-msg" id="fm-msg"></span>
      <button type="button" class="btn" data-fmx="cancel">Cancel</button><button type="button" class="b1" data-fmx="ok">${esc(cfg.submit || 'Save')}</button></div></div>`;
  hydrateIcons(f); formSync(); FM.init = JSON.stringify(readForm());
  $('#fscrim').classList.add('on'); f.classList.add('open'); f.setAttribute('aria-hidden', 'false');
  if (finePointer){ const first = $('.fm-body input:not([type=checkbox]),.fm-body textarea', f); if (first) setTimeout(() => { first.focus(); try { first.setSelectionRange(first.value.length, first.value.length); } catch(e){} }, 60); }
}
function closeForm(force){
  const f = $('#form'); if (!formOpen()) return true;
  closeDP(false);
  if (!force && FM.cfg && JSON.stringify(readForm()) !== FM.init && !FM.leave){
    FM.leave = true; formMsg('Unsaved changes. Press Esc again or Cancel to discard.'); nudge(); setTimeout(() => FM.leave = false, 3000); return false;
  }
  FM.leave = false; f.classList.remove('open'); f.setAttribute('aria-hidden', 'true'); $('#fscrim').classList.remove('on'); FM.cfg = null;
  setTimeout(() => { if (!formOpen()) f.innerHTML = ''; }, 400);
  return true;
}
function formMsg(m, bad){ const e = $('#fm-msg'); if (e){ e.textContent = m || ''; e.classList.toggle('bad', !!bad); } }
function nudge(){ const c = $('#form .fm-card'); if (!c) return; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
function fieldErr(k, msg){ const box = $(`#form [data-fk="${k}"]`); if (!box) return; box.classList.add('bad'); $('.fm-err', box).textContent = msg; }
function submitForm(){
  if (!FM.cfg) return;
  $$('#form .ff.bad').forEach(b => { b.classList.remove('bad'); $('.fm-err', b).textContent = ''; }); formMsg('');
  const vals = readForm(), cfg = FM.cfg;
  const visible = f => !f.show || f.show(vals);
  const miss = cfg.fields.filter(f => f.req && visible(f) && !vals[f.k]);
  if (miss.length){ miss.forEach(f => fieldErr(f.k, 'Required')); nudge(); const el = $(`#form [data-fk="${miss[0].k}"] [data-k]`); if (el){ el.focus(); if (el.classList.contains('fm-date')) openDP(el); } return; }
  const init = JSON.parse(FM.init), changed = {};
  Object.keys(vals).forEach(k => { if (JSON.stringify(vals[k]) !== JSON.stringify(init[k])) changed[k] = vals[k]; });
  const res = cfg.onSubmit(vals, changed);
  if (res && typeof res === 'object'){ Object.entries(res).forEach(([k, m]) => k === '_' ? formMsg(m, true) : fieldErr(k, m)); nudge(); return; }
  if (res === false) return;
  closeForm(true);
}
document.addEventListener('click', e => {
  const t = e.target; if (!t.closest('#form')) return;
  const x = t.closest('[data-fmx]');
  if (x){ const a = x.dataset.fmx;
    if (a === 'cancel') closeForm(true);
    else if (a === 'ok') submitForm();
    else if (a === 'extra'){ const run = FM.cfg.extra.run; closeForm(true); run(); }
    else if (a === 'del'){ if (!FM.armed){ FM.armed = true; x.classList.add('armed'); $('span', x).textContent = 'Tap again to delete'; setTimeout(() => { FM.armed = false; if (x.isConnected){ x.classList.remove('armed'); $('span', x).textContent = FM.cfg && FM.cfg.del ? FM.cfg.del.label || 'Delete' : 'Delete'; } }, 3500); }
      else { const run = FM.cfg.del.run; closeForm(true); run(); } }
    return; }
  const ch = t.closest('[data-chips] button'); if (ch){ $$('button', ch.parentElement).forEach(b => { b.classList.toggle('on', b === ch); b.setAttribute('aria-checked', b === ch); }); formSync(); return; }
  if (t.closest('[data-addprod]')){ const box = $('#form [data-prods]'); box.insertAdjacentHTML('beforeend', prodRow({})); hydrateIcons(box); $('.fm-prod:last-child input', box).focus(); formSync(); return; }
  const dp = t.closest('[data-delprod]'); if (dp){ dp.closest('.fm-prod').remove(); formSync(); return; }
});
document.addEventListener('input', e => { if (e.target.closest('#form')) formSync(); });
document.addEventListener('change', e => { if (e.target.closest('#form')) formSync(); });
document.addEventListener('submit', e => { if (e.target.closest('#form')){ e.preventDefault(); submitForm(); } });
document.addEventListener('keydown', e => {
  if (!formOpen()) return;
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); submitForm(); }
}, true);

const withCur = (opts, cur) => cur && !opts.some(o => String(o[0]) === String(cur)) ? [...opts, [cur, cur]] : opts;
function linksToText(links){ return (links || []).map(l => l.label && l.label !== l.url ? `${l.label} | ${l.url}` : l.url).join('\n'); }
function textToLinks(txt){
  return String(txt || '').split('\n').map(x => x.trim()).filter(Boolean).map(line => {
    const bar = line.lastIndexOf('|'); let label = bar > -1 ? line.slice(0, bar).trim() : '';
    let url = (bar > -1 ? line.slice(bar + 1) : line).trim(); if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    if (!label){ try { const h = new URL(url).hostname.replace(/^www\./, ''); label = /drive\.google|docs\.google/.test(h) ? 'Google Drive' : h; } catch(e){ label = url; } }
    return {id: uid(), label, url};
  }).filter(l => l.url);
}
const sameLinks = (a, b) => linksToText(a) === linksToText(b);
const done1 = (msg, undo, icon) => toast(msg, undo ? {undo, icon: icon || 'check'} : {icon: icon || 'check'});

/* ── project action ── */
function formProjTask(projId, key, preset){
  const p = findRec(DB.data, 'projects', projId); if (!p) return;
  const t = key ? subOf(p.tasks, key) : null; if (key && !t) return;
  const subs = p.subStatuses || [];
  openForm({ eyebrow: p.code || p.name, title: t ? 'Edit action' : 'New action', submit: t ? 'Save' : 'Add action',
    fields: [
      {k:'name', label:'Action', req:true, value: t ? t.name : preset ? preset.name : '', ph:'e.g. Send drawing to factory for review'},
      {k:'pic', label:'Person in charge', type:'select', half:true, value: t ? t.pic || meName() : meName(), options: peopleOpts(t && t.pic)},
      {k:'deadline', label:'Deadline', type:'date', half:true, value: t ? t.deadline || '' : preset ? preset.deadline : todayStr()},
      {k:'status', label:'Status', type:'chips', value: t ? t.status || (t.done ? 'done' : 'todo') : 'todo', options: TASK_ST},
      {k:'reminder', label:'Chase on', type:'date', value: t ? t.reminder || '' : addWorkDays(todayStr(), 3), hint:'If no reply by this day it shows under Awaiting reply.', show: v => v.status === 'awaiting-reply'},
      ...(subs.length ? [{k:'linkedSubStatus', label:'Linked update', type:'select', value: t ? t.linkedSubStatus || '' : '', options: withCur([['', '— None —'], ...subs.map((s, i) => [s.id || String(i), s.title + (s.date ? ' (' + fmtDate(s.date) + ')' : '')])], t && t.linkedSubStatus)}] : []),
    ],
    del: t && can('actions','delete') ? {label:'Delete', run: () => { const u = deleteProjTask(projId, key); done1(`Deleted “${esc(t.name)}”.`, u, 'trash'); }} : null,
    onSubmit: (v, ch) => {
      if (!t){ addProjTask(projId, {...v, followupOf: preset && preset.followupOf}); done1(`Action added${v.deadline ? ' · due ' + fmtDate(v.deadline) : ''}`); return; }
      if (!Object.keys(ch).length) return;
      if ('status' in ch && v.status === 'awaiting-reply') ch.reminder = v.reminder;
      editProjTask(projId, key, ch); done1('Action saved');
    } });
}

/* one entry point for every data-fm button: "kind" or "kind|key" */
function openFormFor(spec){
  const [kind, key] = spec.split('|');
  if (kind === 'ptask') return formProjTask(S.proj, key || null);
  if (kind === 'ss') return formSubStatus(S.proj, key || null);
  if (kind === 'ms') return formMilestone(S.proj, key || null);
  if (kind === 'proj') return formProject(key || null);
  if (kind === 'itask') return formInqTask(sheetId, key || null);
  if (kind === 'na') return formInqNA(sheetId, key || null);
  if (kind === 'inq') return formInquiry(key || null);
  if (kind === 'mtask') return formMTask(key || null);
  if (kind === 'pic') return formPIC(S.proj, key || null);
}

/* ── "Follow up" button on the done toast (V1 asked in a pop-up every time; here it is one tap away) ── */
function followUpAction(kind, parentId, name, srcId){
  return {label:'Follow up', run: () => {
    const preset = {name: `Follow up: ${name}`, title: `Follow up: ${name}`, deadline: addDays(todayStr(), 3), category:'followup', followupOf: srcId};
    if (kind === 'project') formProjTask(parentId, null, preset);
    else if (kind === 'inquiry') formInqTask(parentId, null, preset);
    else if (kind === 'na') formInqNA(parentId, null, preset);
    else formMTask(null, preset);
  }};
}

/* ── notification swipe: right = done, left = snooze until tomorrow ── */
let sw = null;
document.addEventListener('pointerdown', e => {
  const fg = e.target.closest('.nfg'); if (!fg || e.target.closest('button')) return;
  sw = { row: fg.parentElement, fg, x: e.clientX, y: e.clientY, dx: 0, lock: null, id: e.pointerId };
});
document.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.lock){ if (Math.abs(dx) > 8 || Math.abs(dy) > 8){ sw.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; if (sw.lock === 'x'){ sw.row.classList.add('drag'); try { sw.fg.setPointerCapture(sw.id); } catch(_){} } } }
  if (sw.lock !== 'x') return;
  e.preventDefault();
  const w = sw.row.offsetWidth; sw.dx = Math.sign(dx) * Math.min(Math.abs(dx), w*.9);
  sw.row.dataset.dir = sw.dx > 0 ? 'r' : 'l'; sw.fg.style.setProperty('--dx', sw.dx + 'px');
  sw.row.classList.toggle('armed', Math.abs(sw.dx) > w*.35);
});
function notifByKey(k){ return NOTI.find(x => x.key === k); }
function notifDone(n, rowEl){
  if (!canCompleteNotif(n)){ toast("You don't have permission to complete this one", {icon:'x'}); return false; }
  const fu = n.type === 'mtask' ? (can('tasks','add') ? followUpAction('mtask', null, n.taskName, n.taskId) : null) : n.type === 'project' ? (can('actions','add') ? followUpAction('project', n.parentId, n.taskName, n.taskId) : null) : (can('inquiries','edit') ? followUpAction(n.type === 'na' ? 'na' : 'inquiry', n.parentId, n.taskName, n.taskId) : null);
  const go2 = () => { completeNotif(n, true); toast(`“${esc(n.taskName)}” done`, {undo: () => completeNotif(n, false), actions: fu ? [fu] : []}); };
  if (rowEl){ rowEl.style.height = rowEl.offsetHeight + 'px'; rowEl.classList.add('collapse'); setTimeout(go2, 260); } else go2();
  return true;
}
function notifSnooze(n, rowEl){
  snooze(n.key, addDays(todayStr(), 1));
  const after = () => { softRender(false); counts(); toast('Snoozed until tomorrow', {icon:'clock', undo: () => { snooze(n.key, ''); softRender(false); counts(); }}); };
  if (rowEl){ rowEl.style.height = rowEl.offsetHeight + 'px'; rowEl.classList.add('collapse'); setTimeout(after, 260); } else after();
}
const swipeEnd = e => {
  if (!sw || e.pointerId !== sw.id) return;
  const s = sw; sw = null; s.row.classList.remove('drag');
  if (s.lock !== 'x') return;
  const w = s.row.offsetWidth, n = notifByKey(s.row.dataset.nkey);
  if (n && Math.abs(s.dx) > w*.35){
    if (navigator.vibrate) try { navigator.vibrate(10); } catch(_){}
    if (s.dx > 0){ if (!canCompleteNotif(n)){ s.fg.style.setProperty('--dx','0px'); s.row.classList.remove('armed'); notifDone(n); return; }
      s.fg.style.setProperty('--dx', (w*1.1) + 'px'); setTimeout(() => notifDone(n, s.row), 180); }
    else { s.fg.style.setProperty('--dx', (-w*1.1) + 'px'); setTimeout(() => notifSnooze(n, s.row), 180); }
  } else { s.fg.style.setProperty('--dx', '0px'); s.row.classList.remove('armed'); }
};
document.addEventListener('pointerup', swipeEnd); document.addEventListener('pointercancel', swipeEnd);

/* ── search / jump (Ctrl K) ── */
let cmdIdx = 0, cmdItems = [];
function cmdBuild(q){
  q = q.trim().toLowerCase();
  const pages = ORDER.filter(p => p !== 'styles' && p !== 'bin' && (inqOn() || p !== 'inquiries')).map(p => ({g:'Pages', t:TITLES[p][0], run:() => go(p), ic:{dashboard:'grid',inquiries:'inbox',projects:'folder',tasks:'tasks',notifications:'bell'}[p]}));
  const acts = [{g:'Actions', t:'Switch light / dark', run:() => toggleTheme(), ic:'sun'},{g:'Actions', t:'Change style', run:() => go('styles'), ic:'sliders'},{g:'Actions', t:'Export to Excel', run:() => exportExcel(), ic:'file'},{g:'Actions', t:'Download a backup', run:() => exportBackup(), ic:'arrowup'},{g:'Actions', t:'Open the recycle bin', run:() => go('bin'), ic:'trash'},{g:'Actions', t:'Reload latest data', run:() => pull({manual:true}), ic:'refresh'}];
  if (DB.data && inqOn() && can('inquiries','add')) acts.unshift({g:'Actions', t:'New inquiry', run:() => formInquiry(), ic:'plus'});
  if (DB.data && can('projects','add')) acts.unshift({g:'Actions', t:'New project', run:() => formProject(), ic:'plus'});
  if (DB.data && can('tasks','add')) acts.unshift({g:'Actions', t:'New task', run:() => formMTask(), ic:'plus'});
  const d = DB.data || {inquiries:[], projects:[]};
  const inq = (inqOn() ? d.inquiries : []).filter(i => !q ? !isClosedInq(i) : true).map(i => ({g:'Inquiries', t:i.name, k:i.code, s:[i.customer, i.factory].join(' '), run:() => openSheet(i.id), ic:'inbox'}));
  const pr = d.projects.map(p => ({g:'Projects', t:p.name, k:p.code, s:[p.customer, p.factory].join(' '), run:() => go('project', {proj:p.id}), ic:'folder'}));
  const mts = q ? (d.mtasks||[]).filter(t => !t.archived && (isLead() || (t.owner || 'Adam') === meName())).map(t => ({g:'Tasks', t:t.title, k: t.deadline ? fmtDate(t.deadline) : '', s: t.description || '', run:() => formMTask(t.id), ic:'tasks'})) : [];
  cmdItems = [...pages, ...acts, ...inq, ...pr, ...mts].filter(x => !q || [x.t, x.k, x.s, x.g].join(' ').toLowerCase().includes(q)).slice(0, 16);
  cmdIdx = 0; let g = '', i = 0;
  $('#cmd-list').innerHTML = cmdItems.map((x, n) => `${x.g !== g ? `<div class="cmd-grp">${g = x.g}</div>` : ''}<button type="button" class="cmd-item ${n===0?'on':''}" data-ci="${n}" style="--i:${i++}">${ico(x.ic,17)}<span>${esc(x.t)}</span>${x.k ? `<span class="k">${esc(x.k)}</span>` : ''}</button>`).join('') || '<div class="empty">No matches</div>';
}
function openCmd(){ const c = $('#cmdk'); c.classList.add('open'); c.setAttribute('aria-hidden','false'); $('#cmd-q').value = ''; cmdBuild(''); setTimeout(() => $('#cmd-q').focus(), 30); }
function closeCmd(){ const c = $('#cmdk'); if (!c.classList.contains('open')) return; c.classList.remove('open'); c.setAttribute('aria-hidden','true'); }
$('#cmd-q').addEventListener('input', e => cmdBuild(e.target.value));
$('#cmd-q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if (!cmdItems.length) return; cmdIdx = (cmdIdx + (e.key === 'ArrowDown' ? 1 : -1) + cmdItems.length) % cmdItems.length;
    $$('.cmd-item').forEach((b,i) => b.classList.toggle('on', i === cmdIdx)); $$('.cmd-item')[cmdIdx]?.scrollIntoView({block:'nearest'}); }
  if (e.key === 'Enter' && cmdItems[cmdIdx]){ const it = cmdItems[cmdIdx]; closeCmd(); it.run(); }
});

    else if (seg.id === 'ibseg'){ const i = findRec(DB.data, 'inquiries', sheetId); if (!i) return; const prev = i.ballWith || ''; setBall('inquiries', i.id, v); toast(v ? `Ball passed to ${esc(BALL_LABELS[v])}` : 'Ball in court cleared', {icon:'arrow', undo: () => setBall('inquiries', i.id, prev)}); }
    else if (seg.id === 'ioseg'){ const i = findRec(DB.data, 'inquiries', sheetId); if (!i) return; const prev = i.outcome || ''; setOutcome(i.id, v); if (v === 'won'){ const r = sb.getBoundingClientRect(); burst(r.left + r.width/2, r.top, 40, 180); } toast(v ? `Marked as ${OUTCOME_LABELS[v].toLowerCase()}` : 'Outcome reset to open', {icon: v === 'won' ? 'trophy' : 'check', undo: () => setOutcome(i.id, prev)}); }
    else if (seg.id === 'nseg'){ S.nscope = v; S.nperson = ''; const from = indNow(seg); vt(() => { refresh(); slideInd('nseg', from); }, 'list'); }
    else if (seg.id === 'nwhen'){ S.nwhen = v; const from = indNow(seg); vt(() => { refresh(); slideInd('nwhen', from); }, 'list'); }
    else if (seg.id === 'tcat'){ S.tcat = v; const from = indNow(seg); vt(() => { refresh(); slideInd('tcat', from); }, 'list'); }
    else if (seg.id === 'tscope'){ S.tscope = v; if (S.tsel) S.tsel.clear(); const from = indNow(seg); vt(() => { refresh(); slideInd('tscope', from); }, 'list'); }
    else if (seg.id === 'focusseg'){ S.focus = v; store.set('npd2-focus', v); applyPrefs(); closeSheet(); if (S.page === 'inquiries' && v === 'projects') S.page = 'dashboard';
      vt(() => { refresh(); counts(); }, 'fwd').then(() => moveNav(false)); toast(v === 'projects' ? 'Projects only: inquiries are hidden' : 'Showing inquiries and projects', {icon: v === 'projects' ? 'folder' : 'grid'}); }
    else if (seg.id === 'themeseg'){ if (v !== S.theme) toggleTheme(sb); }
    else if (seg.id === 'motionseg'){ S.motion = v; store.set('npd2-motion', v); applyPrefs(); toast(`Motion: ${sb.textContent}`, {icon:'spark'}); }
    else if (seg.id === 'binseg'){ S.binf = v; const from = indNow(seg); vt(() => { refresh(); slideInd('binseg', from); }, 'list'); }
    else if (seg.id === 'matseg'){ S.mat = v; store.set('npd2-mat', v); applyPrefs(); }
    return; }
  const a = t.closest('[data-act]'); if (a){ const act = a.dataset.act;
    if (act === 'cmdk') openCmd(); else if (act === 'theme') toggleTheme(a); else if (act === 'sync') pull({manual:true}); else if (act === 'signout') signOut();
    else if (act === 'settings'){ $('#pop').classList.contains('open') ? closePop() : openPop(a); }
    else if (act === 'shelf'){ $('#shelf').classList.contains('open') ? closeShelf() : openShelf(a); } else if (act === 'closesheet') closeSheet();
    else if (act === 'styles'){ closePop(); go('styles'); }
    else if (act === 'open-bin'){ closePop(); go('bin'); }
    else if (act === 'export-xlsx'){ closePop(); exportExcel(); }
    else if (act === 'export-json'){ closePop(); exportBackup(); }
    else if (act === 'bin-empty'){ emptyBin(a); }
    else if (act === 'glass-reset'){ setSlider('gt', 70, true); setSlider('gb', 24, true); S.mat = 'thin'; store.set('npd2-mat', 'thin'); applyPrefs();
      const ms = $('#matseg'); if (ms){ $$('button', ms).forEach(b => b.classList.toggle('on', b.dataset.v === 'thin')); placeInd(ms, true); } }
    else if (act === 'tdone'){ S.tdone = !S.tdone; vt(() => refresh(), 'list'); }
    else if (act === 'tarch'){ S.tarch = !S.tarch; S.tsel = S.tsel ? new Set() : null; vt(() => refresh(), 'list'); }
    else if (act === 'tsel'){ S.tsel = S.tsel ? null : new Set(); refresh(); }
    else if (act === 'tbulk-archive' || act === 'tbulk-restore'){ const ids = [...S.tsel], on = act === 'tbulk-archive';
      const ok = on ? ids.filter(id => (findRec(DB.data, 'mtasks', id) || {}).status === 'done') : ids, skipped = ids.length - ok.length;
      if (ok.length) archiveMTasks(ok, on);
      S.tsel = null; refresh();
      toast(ok.length ? `${ok.length} task${ok.length === 1 ? '' : 's'} ${on ? 'archived' : 'restored'}${skipped ? ` · ${skipped} skipped (only finished tasks can be archived)` : ''}` : 'Only finished tasks can be archived. Tick them off first.', ok.length ? {icon:'check', undo: () => archiveMTasks(ok, !on)} : {icon:'x'}); }
    else if (act === 'tbulk-delete'){ const ids = [...S.tsel]; if (!ids.length) return;
      if (deleteWouldBeBlocked(ids.length)){ toast('The Sheet would block deleting this many at once. Delete them in smaller batches.', {icon:'x'}); return; }
      if (!a.classList.contains('armed')){ a.classList.add('armed'); a.textContent = `Tap again to delete ${ids.length}`; setTimeout(() => { if (a.isConnected){ a.classList.remove('armed'); a.textContent = 'Delete'; } }, 3500); return; }
      const u = deleteMTasks(ids); S.tsel = null; refresh(); toast(`Deleted ${ids.length} task${ids.length === 1 ? '' : 's'}`, {icon:'trash', undo: u}); }
    else if (act === 'toggledone'){ S.showDone = !S.showDone; vt(() => { $('#pbody').innerHTML = projBody(false); }, 'list'); }
    else if (act === 'pin-inq'){ const i = findRec(DB.data, 'inquiries', sheetId); if (i){ const on = !i.pinned; setPin('inquiries', i.id, on); toast(on ? 'Pinned to the sidebar' : 'Unpinned', {icon:'pin', undo: () => setPin('inquiries', i.id, !on)}); } }
    else if (act === 'pj-stage'){ if (can('projects','edit')) formStage(S.proj); }
    else if (act === 'pj-done'){ S.pdone = !S.pdone; refresh(); }
    else if (act === 'pj-delivery'){ const p = findRec(DB.data, 'projects', S.proj); if (!p || !can('projects','edit')) return;
      if (DP.el && DP.field === a){ closeDP(false); return; }
      openDP(a, d => { const was = p.deliveryDate || ''; if (d === was) return; editProject(p.id, {deliveryDate: d}); toast(`Delivery moved to ${fmtDate(d)}`, {icon:'cal', undo: () => editProject(p.id, {deliveryDate: was})}); }); }
    else if (act === 'pin-proj'){ const p = findRec(DB.data, 'projects', S.proj); if (p){ const on = !p.pinned; setPin('projects', p.id, on); toast(on ? 'Pinned to the sidebar' : 'Unpinned', {icon:'pin', undo: () => setPin('projects', p.id, !on)}); } }
    return; }
  if (!t.closest('#pop')) closePop();
});
document.addEventListener('keydown', e => {
  if (!AUTH.user) return;
  if (formOpen()){ if (e.key === 'Escape'){ e.preventDefault(); closeForm(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-proj][role=button]')){ e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && e.target.matches('[data-fm][tabindex],[data-mtsel]')){ e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape' && S.tsel && S.page === 'tasks'){ S.tsel = null; refresh(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#cmdk').classList.contains('open') ? closeCmd() : openCmd(); }
  if (e.key === 'Escape'){ closeCmd(); closeSheet(); closePop(); }
});
$('#scrim').addEventListener('click', closeSheet);
$('#fscrim').addEventListener('click', () => closeForm());
document.addEventListener('input', e => { if (e.target.id === 'binq'){ S.binq = e.target.value; clearTimeout(S._bq); S._bq = setTimeout(() => { const l = $('#binlist'); if (l) l.innerHTML = binList(); }, 140); return; } });
document.addEventListener('input', e => { if (e.target.id === 'q'){ S.q = e.target.value; clearTimeout(S._qt); S._qt = setTimeout(() => vt(() => { $('#rows').innerHTML = inqRows(); }, 'list'), 160); } });
addEventListener('resize', () => { moveNav(false); $$('.seg').forEach(s => placeInd(s, false)); wireScroll(); });
$('#totop').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`;
$('#totop').addEventListener('click', () => $('#view').scrollTo({top: 0, behavior: S.motion === 'off' ? 'auto' : 'smooth'}));
setInterval(() => { if (AUTH.user && !DB.saving && !DB.ops.length && !DB.err) setSync('ok'); }, 30000);

/* ══════════ BOOT ══════════ */
hydrateIcons(); initLogin(); moveNav(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (!window.firebase || !firebase.initializeApp){
  showLogin(); lgError('The sign-in service did not load. Check your connection and reload the page.');
} else {
  try { if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); AUTH.db = firebase.firestore(); } catch(e){ console.error(e); }
  firebase.auth().onAuthStateChanged(u => { if (u) onSignedIn(u); else onSignedOut(); });
}
window.__npd2 = { S, DB, AUTH, go, openSheet, pull, commit, mutate, render, openFormFor, closeForm };
})();

</script>
