  --bg:#0E1114; --backdrop:linear-gradient(115deg,#6B3417 0%,#3A2C2C 32%,#262B33 58%,#1D3A57 100%); --app:#15191E; --bg2:transparent; --surf:#1C2127; --surf-solid:#1F252C; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.16); --tx:#F2F4F7; --mu:#9AA3AE; --ac:#F2F4F7; --ac-grad:linear-gradient(#F2F4F7,#F2F4F7); --on-ac:#12161A; --ok:#3CCB7F; --warn:#FF9A3D; --bad:#FF6B6B; --info:#5AA9FF;
  --c1:#4DA3FF; --c2:#FF8A3D; --prog:#4DA3FF; --bar-grad:linear-gradient(90deg,#8B5CF6,#A855F7); --track:rgba(255,255,255,.07); --hover:rgba(255,255,255,.04); --sel:rgba(255,255,255,.08); --glow:none; --shadow:0 24px 40px -28px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.5); --tint1:rgba(255,138,61,.10); --tint2:rgba(77,163,255,.10); --orb1:transparent; --orb2:transparent; --orb3:transparent }
:root[data-look="I"][data-theme="light"]{ --bg:#EEF1F5; --backdrop:linear-gradient(115deg,#FFA25C 0%,#E9B79A 26%,#C3BDBF 52%,#7FA7CF 100%); --app:#F1F3F6; --surf:#F8F9FB; --surf-solid:#FFFFFF; --line:rgba(16,24,40,.07); --line-2:rgba(16,24,40,.14); --tx:#14191F; --mu:#5F6B78; --ac:#1C252C; --ac-grad:linear-gradient(#1C252C,#1C252C); --on-ac:#FFFFFF; --ok:#16A34A; --warn:#E8740C; --bad:#E5484D; --info:#1E7FE0;
  --c1:#1E7FE0; --c2:#FF7A1A; --prog:#1E7FE0; --bar-grad:linear-gradient(90deg,#7E22CE,#A855F7); --track:#E6E9EE; --hover:rgba(16,24,40,.035); --sel:#FFFFFF; --glow:none; --shadow:0 1px 2px rgba(16,24,40,.04),0 24px 48px -32px rgba(16,24,40,.18); --scrim:rgba(20,25,31,.18); --tint1:#FFF2E8; --tint2:#EDF4FD; --orb1:transparent; --orb2:transparent; --orb3:transparent }
:root[data-look="I"] body,:root[data-look="I"] #login{background:var(--backdrop)}
:root[data-look="I"] #app .orbs,:root[data-look="I"] #login .orbs{display:none}
:root[data-look="I"] #app{background:var(--app)}
@media (min-width:721px){:root[data-look="I"] body{padding:16px} :root[data-look="I"] #app{border-radius:40px;box-shadow:0 40px 90px -40px rgba(20,30,50,.5);overflow:hidden}}
@media (min-width:1041px){:root[data-look="I"] #app{grid-template-columns:108px minmax(0,1fr)}}
:root[data-look="I"] .side{background:transparent;border-right:0;align-items:center;padding:28px 14px 18px;backdrop-filter:none}
:root[data-look="I"] .brand{padding:0 0 18px}
:root[data-look="I"] .brand b,:root[data-look="I"] .searchbtn,:root[data-look="I"] .nav .lbl,:root[data-look="I"] .nav .cnt,:root[data-look="I"] .nav .badge-new,:root[data-look="I"] .sec,:root[data-look="I"] .me div,:root[data-look="I"] .side .fac .cnt,:root[data-look="I"] .side #pins{display:none}
:root[data-look="I"] .brand i{width:54px;height:54px;border-radius:50%;background:var(--ac);color:var(--on-ac);box-shadow:none;font-size:12px}
:root[data-look="I"] .nav{width:56px;gap:10px}
:root[data-look="I"] .nav button{width:56px;height:56px;padding:0;justify-content:center;border-radius:50%;background:var(--surf-solid);color:var(--tx);box-shadow:0 1px 2px rgba(16,24,40,.06)}
:root[data-look="I"] .nav button.on{color:var(--on-ac);background:transparent;box-shadow:none}
:root[data-look="I"] .nav-ind{height:56px;border-radius:50%;background:var(--ac);border:0;box-shadow:0 10px 24px -10px rgba(16,24,40,.5)}
:root[data-look="I"] .side .fac{width:56px;height:34px;justify-content:center;padding:0;font-size:0;border-radius:99px}
:root[data-look="I"] .side .fac .dot{width:12px;height:12px}
:root[data-look="I"] .side #facs{display:grid;gap:4px;margin-top:18px}
:root[data-look="I"] .me{padding:0}
:root[data-look="I"] .top{padding:34px 40px 14px;align-items:flex-end;gap:14px}
:root[data-look="I"] .top .ttl{flex-direction:column-reverse;align-items:flex-start;gap:4px}
:root[data-look="I"] .top h1{font-size:clamp(34px,4vw,56px);font-weight:500;letter-spacing:-.025em;line-height:1.05}
:root[data-look="I"] .top .sub{font-size:19px;color:var(--mu)}
:root[data-look="I"] .sync{display:none}
:root[data-look="I"] #view{padding:6px 40px 48px}
:root[data-look="I"] .card{border:1px solid var(--line)}
:root[data-look="I"] .panel{padding:26px}
:root[data-look="I"] .ph h3{font-size:25px;font-weight:400;letter-spacing:-.015em}
:root[data-look="I"] .ph>span{display:none}
:root[data-look="I"] .ph-act{display:grid;width:48px;height:48px;background:transparent}
:root[data-look="I"] .btn{background:transparent;border-color:var(--line-2);font-weight:500;padding:14px 22px}
:root[data-look="I"] .b1{padding:14px 22px;font-weight:500}
:root[data-look="I"] .pill{border-radius:99px}
:root[data-look="I"] .seg{background:transparent;border:0;padding:0;gap:8px}
:root[data-look="I"] .seg .ind{top:0;bottom:0;background:var(--ac);border:0;box-shadow:none}
:root[data-look="I"] .seg button{border:1px solid var(--line-2);padding:13px 22px;font-weight:500;font-size:15px;color:var(--tx)}
:root[data-look="I"] .seg button.on{color:var(--on-ac);border-color:transparent}
:root[data-look="I"] .seg.acc .ind{background:var(--ac)}
:root[data-look="I"] .ring .rs,:root[data-look="I"] .area .stripe{display:inline}
:root[data-look="I"] .area .fill{opacity:.45}
:root[data-look="I"] .task{border:0;border-radius:26px;padding:18px 20px;grid-template-columns:minmax(0,1fr) auto auto auto;background:var(--tint2)}
:root[data-look="I"] .task:nth-of-type(odd){background:var(--tint1)}
:root[data-look="I"] .task.done{background:var(--hover)}
:root[data-look="I"] .task .cb{order:9;border-radius:50%;width:34px;height:34px}
:root[data-look="I"] .task .tt{font-size:17px;font-weight:600}
:root[data-look="I"] .tabs-wrap{padding:26px}
:root[data-look="I"] .lg-card{background:var(--app);border:0;border-radius:36px}
:root[data-look="I"] .lg-logo{border-radius:50%;background:var(--ac);color:var(--on-ac);box-shadow:none}
@media (min-width:1400px){:root[data-look="I"] .searchpill{display:flex}}

/* ── Look J · Graphite (reference 2) ── */
:root[data-look="J"]{ --fd:"Instrument Sans",system-ui,sans-serif; --fb:"Instrument Sans",system-ui,sans-serif; --fn:"Instrument Sans",system-ui,sans-serif; --h-w:500; --h-ls:-.03em; --n-w:500; --n-ls:-.045em; --ph-w:500; --r-card:26px; --r-sm:12px; --r-pill:10px; --blur:none;
  --bg:#141414; --bg2:#1A1A1A; --surf:#1F1F1F; --surf-solid:#1F1F1F; --line:#2A2A2A; --line-2:#3A3A3A; --tx:#F2F2F2; --mu:#8E8E8E; --ac:#F2F2F2; --ac-grad:linear-gradient(#F2F2F2,#F2F2F2); --on-ac:#111111; --ok:#2EC4B6; --warn:#FFB020; --bad:#FF5A36; --info:#A78BFA;
  --c1:#2EC4B6; --c2:#6E6E6E; --prog:#F5D547; --bar-grad:linear-gradient(90deg,#17807A,#2EC4B6); --track:#2A2A2A; --hover:#242424; --sel:#2A2A2A; --glow:none; --shadow:none; --scrim:rgba(0,0,0,.6); --orb1:transparent; --orb2:transparent; --orb3:transparent }
:root[data-look="J"][data-theme="light"]{ --bg:#F2F2F2; --bg2:#EBEBEB; --surf:#FFFFFF; --surf-solid:#FFFFFF; --line:#E4E4E4; --line-2:#D0D0D0; --tx:#141414; --mu:#6B6B6B; --ac:#141414; --ac-grad:linear-gradient(#141414,#141414); --on-ac:#FFFFFF; --ok:#0F9488; --warn:#B87400; --bad:#E5482A; --info:#7C3AED;
  --c1:#14A098; --c2:#BDBDBD; --prog:#E9B800; --bar-grad:linear-gradient(90deg,#0F766E,#14A098); --track:#ECECEC; --hover:#F6F6F6; --sel:#EDEDED; --glow:none; --shadow:none; --scrim:rgba(0,0,0,.2); --orb1:transparent; --orb2:transparent; --orb3:transparent }
:root[data-look="J"] .brand i,:root[data-look="J"] .lg-logo{background:#FFE58A;color:#111;box-shadow:none;border-radius:10px}
:root[data-look="J"] .nav-ind{background:var(--sel);border:1px solid var(--line-2);box-shadow:none;border-radius:10px}
:root[data-look="J"] .nav button{border-radius:10px}
:root[data-look="J"] .fac .dot{width:12px;height:12px;background:transparent;box-shadow:inset 0 0 0 2px var(--dc)}
:root[data-look="J"] .top .sub{font:var(--h-w) clamp(24px,2.6vw,34px)/1.1 var(--fd);letter-spacing:var(--h-ls);color:var(--mu)}
:root[data-look="J"] .pill{border-radius:8px;font-weight:500;font-size:11.5px;padding:6px 8px;border-color:transparent}
:root[data-look="J"] .ph h3{font-weight:500}
:root[data-look="J"] #tseg{background:none;border:0;padding:0;gap:18px}
:root[data-look="J"] #tseg .ind{display:none}
:root[data-look="J"] #tseg button{padding:8px 0;font-weight:500}
:root[data-look="J"] #tseg button::before{content:"◇";margin-right:7px;font-size:11px}
:root[data-look="J"] #tseg button.on::before{content:"◆"}
:root[data-look="J"] .bhead{background:var(--surf);border-color:var(--line)}
:root[data-look="J"] .lg-name{font-weight:500}

/* motion levels */
:root[data-motion="calm"]{--k:.65}
:root[data-motion="off"]{--k:.001}
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background-color .5s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{flex:none;display:block}
.mono{font-family:var(--fm);font-size:11.5px;letter-spacing:.02em}
.muted{color:var(--mu)}

/* ambient orbs */
.orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(80px);transition:background .6s}
.o1{width:56vmax;height:56vmax;left:-18vmax;top:-22vmax;background:var(--orb1);animation:drift1 34s ease-in-out infinite alternate}
.o2{width:48vmax;height:48vmax;right:-16vmax;top:14vmax;background:var(--orb2);animation:drift2 41s ease-in-out infinite alternate}
.o3{width:44vmax;height:44vmax;left:30%;bottom:-26vmax;background:var(--orb3);animation:drift3 29s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-10vmax,6vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(8vmax,-10vmax) scale(1.1)}}
:root:not([data-motion="full"]) .orb{animation:none}

/* ───────── LOGIN ───────── */
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:var(--bg);transition:opacity calc(700ms*var(--k)) .15s,visibility 0s calc(900ms*var(--k))}
#login .orbs{transition:transform calc(1100ms*var(--k)) var(--ease-out)}
#login.out{opacity:0;visibility:hidden}
#login.out .orbs{transform:scale(1.5)}
.lg-card{position:relative;z-index:1;width:min(400px,100%);padding:34px 28px 24px;border-radius:30px;background:var(--surf);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow);display:grid;gap:16px;
  transition:transform calc(800ms*var(--k)) var(--ease-out),filter calc(600ms*var(--k)),opacity calc(600ms*var(--k));animation:cardin calc(1000ms*var(--k)) var(--ease-out) backwards}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(10px)}40%{filter:blur(0)}}
#login.out .lg-card{transform:scale(.9) translateY(-10px);filter:blur(14px);opacity:0}
.lg-logo{width:52px;height:52px;border-radius:16px;background:var(--ac-grad);display:grid;place-items:center;color:var(--on-ac);font:700 13px/1 var(--fb);box-shadow:var(--glow)}
.lg-hello{color:var(--mu);font-size:14px;margin-top:6px}
.lg-name{margin:-12px 0 4px;font:var(--h-w) 40px/1.1 var(--fd);letter-spacing:var(--h-ls)}
.fld{display:grid;gap:6px}
.fld label{font-size:12.5px;color:var(--mu);font-weight:500}
.fld input{width:100%;padding:13px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--hover);color:var(--tx);font:500 15px var(--fb);transition:border-color .2s,box-shadow .2s}
.fld input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.keep{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu);cursor:pointer;user-select:none}
.sw{width:40px;height:24px;border-radius:99px;background:var(--track);position:relative;transition:background .25s;flex:none;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--tx);transition:transform calc(var(--spring-d)*var(--k)) var(--spring)}
.keep input{position:absolute;opacity:0;pointer-events:none}
.keep input:checked + .sw{background:var(--ac)}
.keep input:checked + .sw::after{transform:translateX(16px);background:var(--on-ac)}
.keep input:focus-visible + .sw{outline:2px solid var(--ac);outline-offset:2px}
.slide{--x:0px;position:relative;height:62px;border-radius:999px;background:var(--hover);border:1px solid var(--line);overflow:hidden;margin-top:6px;touch-action:none;user-select:none}
.slide-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--x) + 60px);background:var(--ac-grad);opacity:.28;border-radius:999px;transition:width calc(var(--spring-d)*var(--k)) var(--spring)}
.slide-txt{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:15px;padding-left:40px;
  background:linear-gradient(100deg,var(--mu) 30%,var(--tx) 50%,var(--mu) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.thumb{position:absolute;left:4px;top:4px;width:52px;height:52px;border-radius:50%;border:0;background:var(--ac-grad);color:var(--on-ac);display:grid;place-items:center;cursor:grab;box-shadow:var(--glow);transform:translateX(var(--x));transition:transform calc(var(--spring-d)*var(--k)) var(--spring)}
.slide.drag .thumb,.slide.drag .slide-fill{transition:none}
.slide.drag .thumb{cursor:grabbing}
.thumb .i{transition:transform .3s var(--ease-out),opacity .2s}
.slide.done .slide-txt{opacity:0}
.slide.done .slide-fill{opacity:.5}
.slide.done .thumb{animation:thumbpop calc(500ms*var(--k)) var(--ease-out)}
@keyframes thumbpop{50%{transform:translateX(var(--x)) scale(1.18)}}
.lg-foot{margin:0;text-align:center;font-size:12px;color:var(--mu)}

/* ───────── APP SHELL ───────── */
#app{background-image:var(--pattern);background-size:var(--pattern-size);position:relative;display:grid;grid-template-columns:252px minmax(0,1fr);height:100%;transition:opacity calc(800ms*var(--k)) var(--ease-out),transform calc(1100ms*var(--k)) var(--ease-out),filter calc(800ms*var(--k))}
#app.pre{opacity:0;transform:scale(1.05);filter:blur(14px)}
.side{position:relative;z-index:3;display:flex;flex-direction:column;gap:4px;padding:18px 14px 14px;border-right:1px solid var(--line);background:var(--bg2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand i{width:32px;height:32px;border-radius:10px;background:var(--ac-grad);display:grid;place-items:center;color:var(--on-ac);font:700 10.5px/1 var(--fb);font-style:normal;box-shadow:var(--glow);flex:none}
.brand b{font:var(--ph-w) 18px/1 var(--fd);letter-spacing:-.02em}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--hover);color:var(--mu);cursor:pointer;margin-bottom:10px;font-size:14px;transition:border-color .2s}
.searchbtn:hover{border-color:var(--line-2)}
.searchbtn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.searchbtn kbd{white-space:nowrap;margin-left:auto;font:500 11px var(--fm);padding:3px 6px;border-radius:6px;border:1px solid var(--line)}
.nav{position:relative;display:grid;gap:2px}
.nav-ind{position:absolute;left:0;right:0;top:0;height:42px;border-radius:var(--r-sm);background:var(--sel);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform calc(var(--spring-d)*var(--k)) var(--spring);pointer-events:none}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border:0;background:none;border-radius:var(--r-sm);color:var(--mu);cursor:pointer;font-weight:500;font-size:14.5px;text-align:left;transition:color .2s}
.nav button:hover{color:var(--tx)}
.nav button.on{color:var(--tx)}
.nav button .cnt{margin-left:auto;font:600 12px/1 var(--fb);color:var(--mu);font-variant-numeric:tabular-nums}
.nav button .cnt.hot{color:var(--on-ac);background:var(--ac);padding:4px 7px;border-radius:99px}
.nav .badge-new{margin-left:auto;font:600 10px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:6px;background:var(--ac-grad);color:var(--on-ac)}
.sec{font:600 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);padding:20px 12px 8px}
.fac{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border:0;background:none;border-radius:var(--r-sm);color:var(--mu);cursor:pointer;font-size:14px;width:100%;text-align:left;transition:background .2s,color .2s}
.fac:hover{background:var(--hover);color:var(--tx)}
.fac.on{color:var(--tx);background:var(--sel)}
.fac .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dc)}
.fac .cnt{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:grid;gap:8px;padding-top:16px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ac-grad);display:grid;place-items:center;color:var(--on-ac);font:700 12px/1 var(--fb);flex:none}
.me div{display:grid;line-height:1.25;min-width:0}
.me b{font-size:14px;font-weight:600}
.me span{font-size:12px;color:var(--mu)}
.me .ibtn{margin-left:auto}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--hover);display:grid;place-items:center;cursor:pointer;color:var(--tx);transition:transform calc(var(--spring-d)*var(--k)) var(--spring),border-color .2s,background .2s;flex:none;position:relative;overflow:hidden}
.ibtn:hover{border-color:var(--line-2)}
.ibtn:active{transform:scale(.9)}

.main{position:relative;z-index:2;display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:20px 32px 8px;min-width:0}
.top .ttl{min-width:0;margin-right:auto;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font:var(--h-w) clamp(26px,3vw,34px)/1.1 var(--fd);letter-spacing:var(--h-ls);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:13px;color:var(--mu);white-space:nowrap}
.sync{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--hover);font-size:13px;color:var(--mu);cursor:pointer;white-space:nowrap}
.sync .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sync.busy .pulse{background:var(--ac);animation:spinpulse .8s linear infinite;border-radius:2px}
@keyframes spinpulse{to{transform:rotate(360deg)}}
.theme-btn>span{position:absolute;inset:0;display:grid;place-items:center;transition:transform calc(700ms*var(--k)) var(--spring),opacity .3s}
:root[data-theme="light"] .theme-btn .moon,:root[data-theme="dark"] .theme-btn .sun{transform:rotate(-120deg) scale(.4);opacity:0}
#view{position:relative;overflow:auto;min-height:0;padding:10px 32px 48px;view-transition-name:view;scrollbar-gutter:stable;scroll-behavior:smooth}
.tabbar{display:none}

/* ───────── COMMON ───────── */
.card{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:transform calc(var(--spring-soft-d)*var(--k)) var(--spring-soft),border-color .25s,background-color .5s}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(380px circle at var(--mx,-999px) var(--my,-999px),color-mix(in srgb,var(--ac) 13%,transparent),transparent 45%);opacity:0;transition:opacity .35s}
.card:hover::after{opacity:1}
:root:not([data-motion="full"]) .card::after{display:none}
.hov:hover{border-color:var(--line-2)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ph h3{margin:0;font:var(--ph-w) 18px/1.2 var(--fd);letter-spacing:-.02em}
.ph span{font:600 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--fb);padding:6px 9px;border-radius:var(--r-pill);background:var(--hover);color:var(--tx);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:transparent}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);border-color:transparent}
.pill.info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info);border-color:transparent}
.dotc{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn,.b1{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--fb);padding:12px 16px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap;transition:transform calc(var(--spring-d)*var(--k)) var(--spring),border-color .2s,box-shadow .3s}
.btn{border:1px solid var(--line-2);background:var(--hover);color:var(--tx)}
.b1{border:0;background:var(--ac-grad);color:var(--on-ac);box-shadow:var(--glow)}
.btn:active,.b1:active{transform:scale(.95)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.25;transform:scale(0);animation:ripple calc(650ms*var(--k)) var(--ease-out) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* segmented with gliding indicator */
.seg{position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:var(--r-pill);background:var(--hover);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:var(--r-pill);background:var(--sel);border:1px solid var(--line);box-shadow:0 4px 14px -6px rgba(0,0,0,.35);transition:transform calc(var(--spring-d)*var(--k)) var(--spring),width calc(var(--spring-d)*var(--k)) var(--spring);pointer-events:none}
.seg.acc .ind{background:var(--ac-grad);border:0;box-shadow:var(--glow)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:9px 14px;border-radius:var(--r-pill);cursor:pointer;color:var(--mu);font:600 13.5px/1 var(--fb);white-space:nowrap;display:inline-flex;gap:7px;align-items:center;transition:color .25s}
.seg button.on{color:var(--tx)}
.seg.acc button.on{color:var(--on-ac)}
.seg button .n{font-variant-numeric:tabular-nums;opacity:.7}

/* entrance */
.st{animation:rise calc(700ms*var(--k)) var(--ease-out) backwards;animation-delay:calc(var(--i,0)*55ms*var(--k))}
@keyframes rise{from{opacity:.001;transform:translateY(16px) scale(.985);filter:blur(6px)}40%{filter:blur(0)}}
:root[data-motion="off"] .st{animation:none}

/* ───────── VIEW TRANSITIONS ───────── */
::view-transition-group(*){animation-duration:calc(420ms*var(--k));animation-timing-function:var(--ease-out)}
:root[data-vt]:not([data-vt="style"])::view-transition-old(root),:root[data-vt]:not([data-vt="style"])::view-transition-new(root){animation:none}
:root[data-vt="fwd"]::view-transition-old(view){animation:out-l calc(260ms*var(--k)) var(--ease-in) both}
:root[data-vt="fwd"]::view-transition-new(view){animation:in-r calc(620ms*var(--k)) var(--ease-out) backwards}
:root[data-vt="back"]::view-transition-old(view){animation:out-r calc(260ms*var(--k)) var(--ease-in) both}
:root[data-vt="back"]::view-transition-new(view){animation:in-l calc(620ms*var(--k)) var(--ease-out) backwards}
@keyframes out-l{to{opacity:0;transform:translateX(-40px) scale(.985);filter:blur(8px)}}
@keyframes out-r{to{opacity:0;transform:translateX(40px) scale(.985);filter:blur(8px)}}
@keyframes in-r{from{opacity:0;transform:translateX(56px) scale(.985);filter:blur(10px)}40%{filter:blur(0)}}
@keyframes in-l{from{opacity:0;transform:translateX(-56px) scale(.985);filter:blur(10px)}40%{filter:blur(0)}}
:root[data-vt="morph"]::view-transition-old(view),:root[data-vt="morphback"]::view-transition-old(view){animation:fadeout calc(220ms*var(--k)) var(--ease-in) both}
:root[data-vt="morph"]::view-transition-new(view),:root[data-vt="morphback"]::view-transition-new(view){animation:fadein calc(500ms*var(--k)) calc(120ms*var(--k)) var(--ease-out) backwards}
@keyframes fadeout{to{opacity:0;filter:blur(6px)}}
@keyframes fadein{from{opacity:0;filter:blur(6px)}}
::view-transition-group(hero),::view-transition-group(herobox){animation-duration:calc(var(--spring-soft-d)*1.3*var(--k));animation-timing-function:var(--spring-soft)}
:root[data-vt="list"]::view-transition-old(view){animation:none;opacity:0}
:root[data-vt="list"]::view-transition-new(view){animation:none}
:root[data-vt="list"] .row,:root[data-vt="list"] .task{view-transition-name:var(--n)}
:root[data-vt="theme"] *{view-transition-name:none!important}
:root[data-vt="theme"]::view-transition-old(root){animation:none}
:root[data-vt="theme"]::view-transition-new(root){animation:reveal calc(800ms*var(--k)) var(--ease-io) both}
@keyframes reveal{from{clip-path:circle(0 at var(--rx,50%) var(--ry,50%))}to{clip-path:circle(150vmax at var(--rx,50%) var(--ry,50%))}}
:root[data-vt="style"] *{view-transition-name:none!important}
:root[data-vt="style"]::view-transition-old(root){animation:styleout calc(500ms*var(--k)) var(--ease-io) both}
:root[data-vt="style"]::view-transition-new(root){animation:stylein calc(700ms*var(--k)) var(--ease-out) both}
@keyframes styleout{to{opacity:0;filter:blur(10px);transform:scale(1.02)}}
@keyframes stylein{from{opacity:0;filter:blur(10px);transform:scale(.98)}}
/* fallback when View Transitions API is missing */
.vt-fallback{animation:in-r calc(520ms*var(--k)) var(--ease-out) backwards}
.vt-back{animation:in-l calc(520ms*var(--k)) var(--ease-out) backwards}
/* while a page or card animates in it gets its own GPU layer (the blur-in is composited, not repainted); the class goes when it ends */
.st,.vt-fallback,.vt-back,.tabbody.swap-r,.tabbody.swap-l{will-change:transform,opacity,filter}
.anim-done{will-change:auto}

/* ───────── DASHBOARD ───────── */
.dash{display:grid;gap:16px}
.panel{padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.legend{display:grid;gap:10px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font:600 14px var(--fn);font-variant-numeric:tabular-nums}
.chartwrap{position:relative}
.area{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.area text{font:500 10.5px var(--fb);fill:var(--mu)}
.area .grid{stroke:var(--line)}
.area .ln{fill:none;stroke:var(--c1);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:var(--len);animation:draw calc(1500ms*var(--k)) calc(250ms*var(--k)) var(--ease-io) backwards}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
.area .fill{animation:fadein calc(900ms*var(--k)) calc(700ms*var(--k)) backwards}
.area .end{fill:var(--c1);stroke:var(--surf-solid);stroke-width:3}
.area .endpulse{fill:var(--c1);opacity:.35;transform-box:fill-box;transform-origin:center;animation:ping 2s var(--ease-out) infinite}
@keyframes ping{from{transform:scale(1);opacity:.45}to{transform:scale(3.2);opacity:0}}
.area .scrub{stroke:var(--line-2);stroke-dasharray:3 3;opacity:0;transition:opacity .2s}
.area .sdot{fill:var(--surf-solid);stroke:var(--c1);stroke-width:2.5;opacity:0;transition:opacity .2s}
.chartwrap.scrubbing .scrub,.chartwrap.scrubbing .sdot{opacity:1}
.tip{position:absolute;top:0;left:0;pointer-events:none;padding:8px 10px;border-radius:12px;background:var(--surf-solid);border:1px solid var(--line-2);font-size:12.5px;white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,-110%) scale(.9);transition:opacity .2s,transform calc(var(--spring-d)*var(--k)) var(--spring)}
.tip b{font:600 15px var(--fn);display:block}
.chartwrap.scrubbing .tip{opacity:1;transform:translate(-50%,-120%) scale(1)}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum b{font:var(--n-w) 30px/1 var(--fn);letter-spacing:var(--n-ls)}
.list{display:grid;gap:2px;margin:0 -6px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-radius:var(--r-sm);cursor:pointer;border:0;background:none;text-align:left;width:100%;transition:background .2s,transform calc(var(--spring-d)*var(--k)) var(--spring)}
.li:hover{background:var(--hover)}
.li:active{transform:scale(.985)}
.sev{width:3px;height:34px;border-radius:4px;background:var(--c)}
.li .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes grow{from{transform:scaleX(0)}}

/* ───────── INQUIRIES ───────── */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--hover);color:var(--mu);transition:border-color .2s,box-shadow .25s}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:500 14.5px var(--fb);outline:none}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:4px minmax(0,2.2fr) minmax(0,1.5fr) minmax(0,1.1fr) auto;gap:16px;align-items:center;padding:14px 18px 14px 14px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.row:active{transform:scale(.99)}
.row .bar4{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.row .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;margin-top:6px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--track)}
.steps i.d{background:var(--ac)}
.steps i.c{background:color-mix(in srgb,var(--ac) 45%,transparent);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.slab{font-size:12.5px;color:var(--mu)}
.slab b{color:var(--tx);font-weight:600}
.wd{display:flex;gap:3px;margin-top:6px}
.wd i{width:14px;height:6px;border-radius:3px;background:var(--track)}
.wd i.on{background:var(--c)}
.rv{text-align:right;font:var(--n-w) 20px/1 var(--fn);letter-spacing:var(--n-ls);white-space:nowrap}
.rv small{display:block;margin-top:4px;font:500 11px var(--fm);color:var(--mu);letter-spacing:.02em}
.empty{padding:48px 20px;text-align:center;color:var(--mu)}
.empty b{display:block;font:var(--h-w) 24px var(--fd);color:var(--tx);margin-bottom:6px}

/* sheet */
#scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity calc(350ms*var(--k))}
#scrim.on{opacity:1;pointer-events:auto;view-transition-name:scrim}
#sheet{position:fixed;z-index:41;top:12px;right:12px;bottom:12px;width:min(470px,calc(100% - 24px));border-radius:28px;background:color-mix(in srgb,var(--surf-solid) 88%,transparent);border:1px solid var(--line-2);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);box-shadow:0 40px 80px -30px rgba(0,0,0,.6);
  transform:translateX(calc(100% + 30px));transition:transform calc(var(--spring-soft-d)*1.2*var(--k)) var(--spring-soft),visibility 0s linear calc(var(--spring-soft-d)*1.2*var(--k));display:flex;flex-direction:column;overflow:hidden;visibility:hidden}
#sheet.open{view-transition-name:sheet;transform:translateX(var(--drag,0px));visibility:visible;transition:transform calc(var(--spring-soft-d)*1.2*var(--k)) var(--spring-soft),visibility 0s}
#sheet.dragging{transition:none}
.grab{display:none}
.sh-head{padding:22px 22px 12px;display:grid;gap:10px;cursor:grab;touch-action:none}
.sh-head .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{margin:0;font:var(--h-w) 28px/1.15 var(--fd);letter-spacing:var(--h-ls)}
.sh-body{padding:4px 22px 22px;overflow:auto;display:grid;gap:16px;align-content:start}
.sh-body>*{animation:rise calc(600ms*var(--k)) var(--ease-out) backwards;animation-delay:calc(140ms*var(--k) + var(--i,0)*60ms*var(--k))}
.slabox{padding:16px;display:grid;gap:12px}
.slabig{display:flex;align-items:baseline;gap:10px}
.slabig b{font:var(--n-w) 46px/1 var(--fn);letter-spacing:var(--n-ls)}
.wd5{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd5 i{height:10px;border-radius:4px;background:var(--track);position:relative;overflow:hidden}
.wd5 i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;animation:grow2 calc(400ms*var(--k)) var(--ease-out) forwards;animation-delay:calc(300ms*var(--k) + var(--i)*90ms*var(--k))}
.wd5 i.off::after{display:none}
.wd5 i.lim{outline:1px dashed var(--line-2);outline-offset:2px}
@keyframes grow2{to{transform:scaleX(1)}}
.tl{display:grid;gap:0;position:relative}
.tl .st2{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl .st2:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:2px;width:2px;background:var(--track)}
.tl .st2.d:not(:last-child)::before{background:var(--ac)}
.node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--surf-solid);position:relative;z-index:1;transition:background .3s,border-color .3s}
.st2.d .node{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.st2.d .node svg path{stroke-dasharray:24;stroke-dashoffset:0;animation:checkdraw calc(450ms*var(--k)) var(--ease-out) backwards}
@keyframes checkdraw{from{stroke-dashoffset:24}}
.st2.c .node{border-color:var(--ac)}
.st2.c .node::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ac);animation:ring 1.8s var(--ease-out) infinite}
@keyframes ring{from{opacity:.8;transform:scale(.7)}to{opacity:0;transform:scale(1.3)}}
.st2 .nm{font-weight:600;font-size:14.5px}
.st2 .when{font-size:12.5px;color:var(--mu)}
.st2.f .nm{color:var(--mu);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{padding:12px 14px;border-radius:var(--r-sm);background:var(--hover);border:1px solid var(--line)}
.kv span{display:block;font-size:12px;color:var(--mu)}
.kv b{font:600 15px var(--fb)}
.sh-foot{padding:14px 22px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ───────── PROJECTS ───────── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{padding:18px;display:grid;gap:14px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.pcard:hover{transform:translateY(-3px);border-color:var(--line-2)}
.pcard:active{transform:scale(.98)}
.pcard .t{font:var(--ph-w) 19px/1.2 var(--fd);letter-spacing:-.02em;margin:0;width:fit-content;max-width:100%}
.pcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.prog{display:grid;gap:8px}
.prog .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu)}
.prog .lab b{color:var(--tx);font-weight:600}
.pbar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--prog));transform-origin:left;animation:grow calc(1100ms*var(--k)) var(--ease-out) backwards;animation-delay:calc(250ms*var(--k) + var(--i,0)*70ms*var(--k))}
.pfoot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mu)}

/* project detail */
@keyframes nodepop{from{transform:scale(0)}}
.tabs-wrap{padding:18px;display:grid;gap:16px}
.tabbody{display:grid;gap:10px}
.tabbody.swap-r{animation:in-r calc(450ms*var(--k)) var(--ease-out) backwards}
.tabbody.swap-l{animation:in-l calc(450ms*var(--k)) var(--ease-out) backwards}
.tgroup{font:600 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);padding:8px 2px 2px;display:flex;justify-content:space-between}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 12px;border-radius:var(--r-sm);background:var(--hover);border:1px solid var(--line);transition:background .25s,opacity .3s}
.cb{width:26px;height:26px;border-radius:9px;border:1.8px solid var(--line-2);display:grid;place-items:center;cursor:pointer;background:none;padding:0;color:var(--on-ac);transition:background .25s,border-color .25s,transform calc(var(--spring-d)*var(--k)) var(--spring)}
.cb:active{transform:scale(.8)}
.cb svg path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset calc(380ms*var(--k)) var(--ease-out) .05s}
.task.done .cb{background:var(--ok);border-color:var(--ok)}
.task.done .cb svg path{stroke-dashoffset:0}
.task.pop .cb{animation:pop calc(500ms*var(--k)) var(--spring)}
@keyframes pop{40%{transform:scale(1.3)}}
.task .tt{display:inline;-webkit-box-decoration-break:clone;box-decoration-break:clone;font-weight:600;font-size:14.5px;background:linear-gradient(currentColor,currentColor) 0 58%/0 1.5px no-repeat;transition:background-size calc(420ms*var(--k)) var(--ease-out),color .3s;width:fit-content;max-width:100%}
.task.done .tt{background-size:100% 1.5px;color:var(--mu)}
.task .who{font-size:12.5px;color:var(--mu)}
.due{font:500 12px var(--fm);color:var(--mu);white-space:nowrap}
.due.late{color:var(--bad)}
.ballseg{display:grid;gap:10px}
.facts{display:grid;gap:0}
.facts div{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.facts div:last-child{border-bottom:0}
.facts span{color:var(--mu)}
.facts b{font-weight:600;text-align:right}
.hist{display:grid;gap:0}
.hist .h{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;padding:10px 0;position:relative;animation:rise calc(600ms*var(--k)) var(--ease-out) backwards;animation-delay:calc(var(--i)*60ms*var(--k))}
.hist .h::before{content:"";position:absolute;left:6px;top:24px;bottom:-8px;width:2px;background:var(--track)}
.hist .h:last-child::before{display:none}
.hist .h i{width:14px;height:14px;border-radius:50%;margin-top:3px;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.hist .h b{font-weight:600;font-size:14px;display:block}
.hist .h span{font-size:12.5px;color:var(--mu)}

/* ───────── NOTIFICATIONS ───────── */

#dp.open{opacity:1;transform:none}
.dp-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dp-title{flex:1;border:0;background:none;color:var(--tx);font:var(--ph-w) 17px/1 var(--fd);letter-spacing:-.01em;padding:10px 8px;border-radius:12px;cursor:pointer;transition:background .2s}
.dp-title span{color:var(--mu)}
.dp-title:hover{background:var(--hover)}
.dp-nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .2s,border-color .2s,transform calc(var(--spring-d)*var(--k)) var(--spring)}
.dp-nav:hover{background:var(--hover);border-color:var(--line-2)}.dp-nav:active{transform:scale(.9)}
.dp-quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:12px}
.dp-quick button{grid-column:span 2}.dp-quick button:nth-child(n+4){grid-column:span 3}
.dp-quick button{padding:8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:var(--r-pill);border:1px solid var(--line-2);background:none;color:var(--mu);font:600 12.5px var(--fb);cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform calc(var(--spring-d)*var(--k)) var(--spring)}
.dp-quick button:hover{color:var(--tx);border-color:var(--ac)}.dp-quick button:active{transform:scale(.94)}
.dp-quick button.on{background:var(--ac-grad);color:var(--on-ac);border-color:transparent}
.dp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dp-wk{font:600 11px/1 var(--fb);letter-spacing:.06em;color:var(--mu);text-align:center;padding:4px 0 8px}
.dp-wk.we{opacity:.5}
.dp-d{aspect-ratio:1;min-height:36px;border:0;background:none;border-radius:50%;color:var(--tx);font:500 14px/1 var(--fb);cursor:pointer;display:grid;place-items:center;position:relative;transition:background .15s,color .15s,transform calc(var(--spring-d)*var(--k)) var(--spring)}
.dp-d:hover{background:var(--hover)}
.dp-d:active{transform:scale(.88)}
.dp-d.we{color:var(--mu);opacity:.7}
.dp-d.out{opacity:.3}
.dp-d.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac)}
.dp-d.sel{background:var(--ac-grad);color:var(--on-ac);opacity:1;font-weight:700;box-shadow:var(--glow)}
.dp-d.sel::after{background:var(--on-ac)}
.dp-d:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.dp-months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dp-months button{padding:16px 0;border-radius:var(--r-sm);border:1px solid var(--line);background:none;color:var(--tx);font:600 14px var(--fb);cursor:pointer;transition:background .2s,border-color .2s}
.dp-months button:hover{background:var(--hover);border-color:var(--line-2)}
.dp-months button.now{border-color:var(--ac)}
.dp-months button.sel{background:var(--ac-grad);color:var(--on-ac);border-color:transparent}
.dp-body.sl{animation:dpsl calc(260ms*var(--k)) var(--ease-out)}
.dp-body.sr{animation:dpsr calc(260ms*var(--k)) var(--ease-out)}
@keyframes dpsl{from{opacity:0;transform:translateX(22px)}}
@keyframes dpsr{from{opacity:0;transform:translateX(-22px)}}
.dp-grab,.dp-cap{display:none}
#dpscrim{position:fixed;inset:0;z-index:71;background:var(--scrim);opacity:0;transition:opacity calc(220ms*var(--k))}
#dpscrim.on{opacity:1}
#dp.sheet{left:8px;right:8px;bottom:8px;top:auto;width:auto;max-width:520px;margin:0 auto;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:28px;transform:translateY(60px);opacity:0}
#dp.sheet.open{transform:none;opacity:1}
#dp.sheet .dp-grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 10px}
#dp.sheet .dp-cap{display:block;font:600 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);text-align:center;margin-bottom:6px}
#dp.sheet .dp-d{font-size:16px;min-height:42px}
#dp.sheet .dp-quick button{padding:11px 4px;font-size:13.5px}

/* ── wave 1 ── */
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.chiprow button{padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:none;color:var(--mu);font:600 12.5px var(--fb);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chiprow button span{opacity:.7;font-weight:500;margin-left:2px}
.chiprow button:hover{color:var(--tx)}
.chiprow button.on{background:var(--ac-grad);color:var(--on-ac);border-color:transparent}
.resched{display:inline-grid;place-items:center;width:28px;height:28px;margin-left:6px;vertical-align:middle;border-radius:50%;border:1px solid var(--line-2);background:none;color:var(--mu);cursor:pointer;transition:color .2s,border-color .2s}
.resched:hover,.resched[aria-expanded="true"]{color:var(--ac);border-color:var(--ac)}
.nr .due{display:inline-flex;align-items:center}
.tb-gap{flex:1}
.btn.sm.on{border-color:var(--ac);color:var(--ac)}
.mtlist{padding:14px}
.task.mt .who{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task.mt .who .desc{flex-basis:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.task.mt[data-mtsel]{cursor:pointer}
.task .selc{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s,color .2s}
.task.picked{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--hover))}
.task.picked .selc{background:var(--ac-grad);border-color:transparent;color:var(--on-ac)}
.selbar{position:sticky;bottom:12px;z-index:5;margin:12px auto 0;width:fit-content;max-width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--surf-solid) 94%,transparent);border:1px solid var(--line-2);box-shadow:0 18px 40px -16px rgba(0,0,0,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:rise calc(300ms*var(--k)) var(--ease-out) backwards}
.selbar b{font-size:14px;margin-right:4px}
.selbar .fm-del.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.toast{--tms:5s}
.li .late{color:var(--bad)}
@media (max-width:720px){.ntip{display:none}.selbar{bottom:calc(8px + env(safe-area-inset-bottom,0px))}}
.toast .tbar{animation-duration:var(--tms)}
.ttools{margin-top:-4px}
.btn.on{border-color:var(--ac);color:var(--ac)}
@media (max-width:560px){.ttools .tb-gap{display:none}}
/* selection circle sits exactly where the tick box sits, in every look */
:root[data-look="I"] .task .selc{order:9;width:34px;height:34px}
@media (max-width:720px){.task .selc{grid-area:c;align-self:start}}

/* ── Projects-only focus ── */
:root[data-focus="projects"] #nav [data-go="inquiries"],:root[data-focus="projects"] #tabbar [data-go="inquiries"]{display:none}
.pop-note{margin:8px 2px 0;font-size:12px;color:var(--mu);line-height:1.4}
#focusseg{width:100%}#focusseg button{flex:1;justify-content:center}
/* ── pin buttons ── */
.ptop{display:inline-flex;align-items:center;gap:6px}
.pinb{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:none;color:var(--mu);display:grid;place-items:center;cursor:pointer;flex:none;transition:color .2s,border-color .2s,background .2s,transform calc(var(--spring-d)*var(--k)) var(--spring)}
.pinb:hover{color:var(--tx);border-color:var(--tx)}
.pinb:active{transform:scale(.88)}
.pinb.on{color:#B7791F;border-color:#F5C518;background:color-mix(in srgb,#F5C518 22%,transparent)}
.pinb[disabled]{cursor:default}
[data-proj][role=button]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ───────── PHONES (iPhone, Fold cover screen) ───────── */
/* Touch screens: iOS zooms into any field under 16px when it gets focus, and fingers need ~44px targets */
@media (hover:none) and (pointer:coarse){
  input:not([type=checkbox]):not([type=radio]):not([type=range]),textarea,select{font-size:16px!important}
  .ibtn,.fm-prod .ibtn,.dp-nav{width:44px;height:44px}
  .fac{height:44px}
  .seg button{padding-top:12px;padding-bottom:12px}
  .resched{width:34px;height:34px;position:relative}
  .cb{position:relative}
  .resched::after,.fm-dclr::after,.cb::after{content:"";position:absolute;inset:-8px}
}
/* Top bar and tab bar float over the page so they can slide away while scrolling down (--toph/--tabh are measured in JS) */
@media (max-width:720px){
  #app{--toph:61px;--tabh:69px;--tab-off:var(--tabh)}
  #app.bars-off{--tab-off:env(safe-area-inset-bottom,0px)}
  .main{grid-template-rows:minmax(0,1fr)}
  :root[data-look] .top{position:absolute;top:0;left:0;right:0;z-index:4;transition:transform calc(320ms*var(--k)) var(--ease-out),background-color .25s,box-shadow .25s}
  .top.elev{background:color-mix(in srgb,var(--surf-solid) 82%,transparent);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4)}
  :root[data-look] #view{padding-top:calc(var(--toph) + 6px);padding-bottom:calc(var(--tabh) + 28px);scroll-padding-top:var(--toph)}
  :root[data-look] .tabbar{position:absolute;left:0;right:0;bottom:0;transition:transform calc(320ms*var(--k)) var(--ease-out)}
  .tabbar{background:color-mix(in srgb,var(--surf-solid) 92%,transparent)}
  #app.bars-off .top{transform:translateY(-100%)}
  #app.bars-off .tabbar{transform:translateY(calc(100% + 40px))}
  #totop{bottom:calc(var(--tab-off) + 16px);transition:opacity calc(250ms*var(--k)),transform calc(var(--spring-d)*var(--k)) var(--spring),bottom calc(320ms*var(--k)) var(--ease-out)}
  .selbar{bottom:calc(var(--tab-off) + 8px)}
  /* Studio keeps its desktop spacing otherwise (40px side margins, 56px title) */
  :root[data-look="I"] .top{padding:14px 16px 8px;align-items:center}
  :root[data-look="I"] .top h1{font-size:28px}
  :root[data-look="I"] .top .sub{font-size:14px}
  :root[data-look="I"] #view{padding-left:16px;padding-right:16px}
  :root[data-look="I"] .panel,:root[data-look="I"] .tabs-wrap{padding:18px}
  :root[data-look="I"] .ph h3{font-size:20px}
  :root[data-look="I"] .task{padding:14px 16px;border-radius:20px}
  :root[data-look="I"] .lg-card{border-radius:30px}
}
/* Narrow phones (iPhone 15 Pro ~393px, Fold cover ~410px): tighter margins and type, sheets open full height */
@media (max-width:430px){
  :root[data-look] .top{padding:12px 12px 6px}
  :root[data-look] .top h1{font-size:24px}
  :root[data-look] #view{padding-left:12px;padding-right:12px}
  :root[data-look] .panel,:root[data-look] .tabs-wrap{padding:16px}
  #sheet{top:calc(8px + env(safe-area-inset-top,0px));height:auto}
  /* compact spacing: smaller headings, pills and buttons, less air between and inside cards */
  .dash{gap:12px}
  :root[data-look] .btn,:root[data-look] .b1{padding:10px 14px;font-size:14px}
  :root[data-look] .pill{font-size:11.5px;padding:5px 8px;gap:5px}
  .ph h3{font-size:17px}
  :root[data-look] .ph h3{font-size:17px}
  /* task rows: due date beside the title instead of on its own line */
  :root:not([data-look="I"]) .task{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"c t d" "c t p";gap:4px 10px;padding:10px 12px}
  :root:not([data-look="I"]) .task .due{grid-area:d;align-self:start;justify-self:end;padding-top:2px}
  :root:not([data-look="I"]) .task .prio{grid-area:p;justify-self:end}
  :root[data-look="I"] .task{padding:12px 14px;border-radius:18px}
  .task .tt{font-size:14px}
  .task .cb{width:24px;height:24px;border-radius:8px}
  :root[data-look="I"] .task .cb{width:30px;height:30px;border-radius:50%}
  :root[data-look="I"] .task .tt{font-size:15px}
  :root[data-look="I"] .task{row-gap:2px}
  :root[data-look="I"] .seg button{padding:10px 14px;font-size:14px}
  /* sign-in card */
  .lg-card{padding:26px 20px 20px;gap:12px}
  .lg-logo{width:44px;height:44px}
  .lg-name{font-size:32px}
  .fld input{padding:11px 13px}
  .slide{height:56px}.thumb{width:46px;height:46px}
  .nic{width:34px;height:34px;border-radius:12px}
}
/* Notification rows on phones: the due label and calendar button go under the title so it gets the full width */
@media (max-width:720px){
  .nfg{grid-template-columns:auto minmax(0,1fr);gap:6px 12px;padding:12px 14px;align-items:start}
  .nfg .nic{grid-row:1/span 2}
  .nfg .nr{grid-column:2;display:flex;align-items:center;gap:8px;justify-items:start}
}
/* iOS 26.0 Safari: when its toolbar shrinks, a full-height layout can leave a blank band at the bottom (fixed in 26.1).
   Size the page from the measured window height instead, and paint the page colour behind it. */
html{background:var(--bg);overflow:hidden}   /* the app scrolls inside #view; without this, phones widened the page to fit the app's 5% entrance zoom behind the login */
html,body{height:var(--app-h,100%)}

/* ───────── ICON-ONLY NAVIGATION (all styles) ─────────
   Phones: tab bar without labels. Tablets and laptops: the sidebar is an icon column; factories and pins
   stay as coloured dots with their names as tooltips. Labels stay in the markup as accessible names. */
@media (max-width:720px){
  .tabbar button{height:48px;padding:0;font-size:0;line-height:0;place-items:center;gap:0}
  .tabbar button .i{width:24px;height:24px}
  .tab-ind{height:48px}
}
@media (min-width:1041px){
  #app{grid-template-columns:76px minmax(0,1fr)}
  .side{padding:16px 10px;align-items:center}
  .brand b,.searchbtn .lbl,.searchbtn kbd,.nav button .lbl,.nav button .cnt,.nav .badge-new,.sec,.me div{display:none}
  .brand{padding:4px 0 12px}
  .searchbtn{width:46px;justify-content:center;padding:10px 0}
  .nav{width:46px}.nav button{justify-content:center;padding:0}
  .me{flex-direction:column;padding:0}.me .ibtn{margin:0}
}
@media (min-width:721px){
  .nav button .cnt.hot{display:block;position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;font:700 10px/16px var(--fb);text-align:center}
}

/* ══════════ Look K · Liquid Glass — Apple iOS & iPadOS 27 (phones, tablets) and macOS (desktop) ══════════
   Source: Apple "iOS and iPadOS 27" Figma kit. (kit) = value read from the kit; (HIG) = Apple's published
   guidelines, used where the kit page was not read (segmented control, buttons, text fields, sheets, menus, iPad, macOS).
   Content sits on solid grouped backgrounds; only bars, toolbar buttons and floating controls are glass (kit).
   Everything is scoped to [data-look="K"] so the other styles are untouched. */
:root[data-look="K"]{
  /* typeface (playbook): Geist for text and headings, Geist Mono for codes, IDs, dates in lists and big numbers */
  --fd:"Geist",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --fb:"Geist",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --fn:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace; --fm:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --h-w:700; --h-ls:.4px; --n-w:700; --n-ls:.38px; --ph-w:590; --lab-tt:none; --lab-ls:0;
  /* type scale, Large (default) Dynamic Type: size / leading / tracking (kit) */
  --lt:34px; --lt-l:41px; --lt-t:.4px; --t1:28px; --t1-l:34px; --t1-t:.38px; --t2:22px; --t2-l:28px; --t2-t:-.26px; --t3:20px; --t3-l:25px; --t3-t:-.45px;
  --hl:17px; --hl-l:22px; --body:17px; --body-l:22px; --body-t:-.43px; --callout:16px; --callout-l:21px;
  --sub:15px; --sub-l:20px; --sub-t:-.23px; --foot:13px; --foot-l:18px; --foot-t:-.08px; --cap:12px; --cap-l:16px; --cap2:11px; --cap2-l:13px;
  --w-emph:590; --w-hl:590;
  /* metrics: list rows 52 / 68, 16pt insets, grouped cards r26, 44pt toolbar controls (kit); segmented 32, buttons 34 (HIG) */
  --row:52px; --row-tall:68px; --pad:16px; --gap:16px; --r-card:26px; --r-sm:12px; --r-pill:999px; --ctl:44px; --seg-h:32px; --btn-h:34px; --fld-h:44px;
  --blur:none; --pattern:none; --grid:transparent; --glow:none; --shadow:none;
  --spring:cubic-bezier(.175,.885,.32,1.275); --spring-d:400ms; --spring-soft:cubic-bezier(.175,.885,.32,1.275); --spring-soft-d:400ms;
  /* neutral backdrop (playbook): soft grey light and shade only, so the frosting has tone to work with but no colour */
  --orb1:rgba(255,255,255,.10); --orb2:rgba(130,134,146,.16); --orb3:rgba(255,255,255,.06);
  /* dark (kit: Dark - Base) */
  --bg:#0A0A0C; --bg2:transparent; --surf:#1C1C1E; --surf-solid:#1C1C1E; --surf-3:#2C2C2E; --app:#0A0A0C;
  /* content material: thin frosted (playbook) */
  --mat:rgba(28,28,30,.70); --mat-blur:blur(12px) saturate(150%); --mat-edge:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 .5px rgba(255,255,255,.08);
  --line:rgba(255,255,255,.17); --line-2:#38383A; --tx:#FFFFFF; --mu:rgba(255,255,255,.85); --mu3:rgba(255,255,255,.55);
  --ac:#0091FF; --ac-grad:linear-gradient(#0091FF,#0091FF); --on-ac:#FFFFFF; --ok:#30D158; --warn:#FF9230; --bad:#FF4245; --info:#6D7CFF;
  --c1:#0091FF; --c2:#FF9230; --prog:#0091FF; --bar-grad:linear-gradient(90deg,#0091FF,#0091FF);
  --fill3:rgba(118,118,128,.24); --fill4:rgba(116,116,128,.18); --track:rgba(120,120,128,.32);
  --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.16); --sel-side:rgba(255,255,255,.1); --scrim:rgba(0,0,0,.4);
  --tint1:transparent; --tint2:transparent;
  /* Liquid Glass tokens (playbook mix): blur 24 / saturate 180%; bars .25 light / .45 dark, overlays .82;
     the shine is a gradient rim (--rim-*), a top sheen + pointer glint (--sheen, --glint) and inner specular lines (in --glass-sh) */
  /* fills and blur follow the Glass sliders in Settings: --lg-t 0-1 (transparency, .7 default), --lg-b px (blur, 24 default) */
  --glass:rgba(20,20,20,calc(.8 - .5*var(--lg-t,.7))); --glass-thick:rgba(24,24,26,calc(.96 - .2*var(--lg-t,.7))); --glass-blur:blur(calc(var(--lg-b,24)*1px)) saturate(180%);
  --glass-bd:transparent; --glass-sh:0 8px 32px 0 rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.28),inset 0 -1px 1px rgba(255,255,255,.05); --glass-ink:#FFFFFF;
  --rim-a:.42; --rim-m:.05; --rim-b:.16; --sheen:.16; --glint:.28; --lens-hi:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 1px rgba(255,255,255,.06);
  --knob-sh:0 3px 8px rgba(0,0,0,.24),0 3px 1px rgba(0,0,0,.08); --seg-ind:#636366;
  color-scheme:dark }
:root[data-look="K"][data-theme="light"]{
  --bg:#D9DBE0; --surf:#FFFFFF; --surf-solid:#FFFFFF; --surf-3:#F2F2F7; --app:#D9DBE0;
  --mat:rgba(255,255,255,.72); --mat-edge:inset 0 1px 0 rgba(255,255,255,.75),0 0 0 .5px rgba(255,255,255,.5),0 1px 3px rgba(0,0,0,.04);
  --line:#E6E6E6; --line-2:#C6C6C8; --tx:#000000; --mu:rgba(0,0,0,.75); --mu3:rgba(0,0,0,.45);
  --ac:#0088FF; --ac-grad:linear-gradient(#0088FF,#0088FF); --ok:#34C759; --warn:#FF8D28; --bad:#FF383C; --info:#6155F5;
  --c1:#0088FF; --c2:#FF8D28; --prog:#0088FF; --bar-grad:linear-gradient(90deg,#0088FF,#0088FF);
  --fill3:rgba(118,118,128,.12); --fill4:rgba(116,116,128,.08); --track:rgba(120,120,128,.16);
  --hover:rgba(0,0,0,.04); --sel:rgba(255,255,255,.72); --sel-side:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.2);
  --glass:rgba(255,255,255,calc(.6 - .5*var(--lg-t,.7))); --glass-thick:rgba(255,255,255,calc(.96 - .2*var(--lg-t,.7))); --glass-ink:#0F172A;
  --glass-sh:0 8px 32px 0 rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06),inset 0 1px 1px rgba(255,255,255,.6),inset 0 -1px 1px rgba(255,255,255,.14);
  --rim-a:.95; --rim-m:.10; --rim-b:.55; --sheen:.42; --glint:.55; --lens-hi:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.18),0 1px 3px rgba(0,0,0,.06);
  --orb1:rgba(255,255,255,.55); --orb2:rgba(138,142,153,.45); --orb3:rgba(172,176,186,.5);
  --knob-sh:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04); --seg-ind:#FFFFFF;

/* content material chosen in Settings: thin (default), ultra-thin or solid */

/* ───────── Liquid Glass · playbook (signed off) ─────────
   Glass only on what floats: toolbar buttons, sync pill, range control, tab bar, sidebar rail, menus, toasts, pickers, command bar, back to top.
   The shine is three layers: a gradient rim (::before), a top sheen + pointer glint (::after) and inner specular lines (in --glass-sh).
   Content sits on the thin frosted material; colour only on the primary action, the current tab, late and at-risk work. */
:root[data-look="K"] .ibtn,:root[data-look="K"] .sync{position:relative}
:root[data-look="K"] .top .seg{background:var(--glass);border:1px solid var(--glass-bd);box-shadow:var(--glass-sh);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
:root[data-look="K"] :is(.ibtn,.sync,#totop,.tabbar,.side,#pop,#shelf,.toast,#dp,.cmd,.selbar,.top .seg){isolation:isolate}
:root[data-look="K"] #shelf{background:var(--glass-thick);border:1px solid var(--glass-bd);border-radius:var(--r-card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-sh),0 20px 50px rgba(0,0,0,.18)}
:root[data-look="K"] #shelf :is(.fac,.pin){height:40px;border-radius:16px;font:400 15px/20px var(--fb);letter-spacing:-.2px;color:var(--tx)}
:root[data-look="K"] #shelf .fac.on{background:var(--sel)}
:root[data-look="K"] .shelf-btn[aria-expanded="true"]{background:var(--sel)}
:root[data-look="K"] :is(.ibtn,.sync,#totop,.tabbar,.side,#pop,#shelf,.toast,#dp,.cmd,.selbar,.top .seg)::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:-1;
  background:linear-gradient(140deg,rgba(255,255,255,var(--rim-a)) 0%,rgba(255,255,255,var(--rim-m)) 34%,rgba(255,255,255,var(--rim-m)) 64%,rgba(255,255,255,var(--rim-b)) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
:root[data-look="K"] :is(.ibtn,.sync,#totop,.tabbar,.side,#pop,#shelf,.toast,#dp,.cmd,.selbar,.top .seg)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(130% 90% at 50% -30%,rgba(255,255,255,var(--sheen)) 0%,rgba(255,255,255,0) 58%),
             radial-gradient(90px circle at var(--mx,-200px) var(--my,-200px),rgba(255,255,255,var(--glint)),rgba(255,255,255,0) 70%);
  mix-blend-mode:soft-light}

/* Settings · Glass: iOS 26 slider (6pt track filled with the accent up to the knob; a white 38 x 24 capsule knob that turns
   into a clear glass lens while held; drag the knob, tapping the track does not jump; icons at both ends) */
.lg-set{display:grid;gap:2px}
.lg-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font:500 13px/18px var(--fb);color:var(--tx)}

.ios-sl{display:flex;align-items:center;gap:10px;height:44px;touch-action:none;-webkit-tap-highlight-color:transparent;outline:0;color:var(--mu)}
.ios-sl .sl-ic{display:grid;place-items:center;width:20px;flex:none}

.sl-fill{position:absolute;left:0;top:0;bottom:0;width:calc(19px + var(--v)*(100% - 38px));border-radius:inherit;background:var(--ac)}
.sl-knob{position:absolute;top:50%;left:calc(var(--v)*(100% - 38px));width:38px;height:24px;margin-top:-12px;border-radius:12px;background:#fff;cursor:grab;
  box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12);transition:scale calc(300ms*var(--k)) var(--spring),background-color .2s,box-shadow .2s}

:root[data-look="K"] :is(.card:not(.row):not(.hero),.rows,.lg-card),:root[data-look="K"] .banner{background:var(--mat);backdrop-filter:var(--mat-blur);-webkit-backdrop-filter:var(--mat-blur);box-shadow:var(--mat-edge)}

:root[data-look="K"] .banner.warn{background:color-mix(in srgb,var(--warn) 12%,var(--mat))}
:root[data-look="K"] .nlist{background:none;box-shadow:var(--mat-edge)}
:root[data-look="K"] .nfg{background:var(--mat);backdrop-filter:var(--mat-blur);-webkit-backdrop-filter:var(--mat-blur)}
/* colour only where it needs attention: list icons are neutral unless late or at risk */
:root[data-look="K"] .nic:not([style*="bad"]):not([style*="warn"]){background:var(--fill3);color:var(--mu)}

/* press: 0.97 while pressed, 1.03 on hover with a mouse, 300ms spring back */
:root[data-look="K"] :is(.ibtn,.sync,.btn,.b1){transition:transform calc(300ms*var(--k)) var(--spring),background-color calc(300ms*var(--k)) var(--ease-out),color .2s,opacity .2s}
@media (hover:hover){:root[data-look="K"] :is(.ibtn,.sync,.btn,.b1):hover{transform:scale(1.03)}}
:root[data-look="K"] :is(.ibtn,.sync,.btn,.b1):active{transform:scale(.97)}

/* selection lens: one glass drop that glides between tabs (script drives the slide), lifts while dragged */
:root[data-look="K"] :is(.tab-ind,.nav-ind){transition:scale calc(320ms*var(--k)) var(--spring),background-color .2s,box-shadow .2s,opacity .2s;box-shadow:var(--lens-hi)}
:root[data-look="K"] :is(.tab-ind,.nav-ind).lg-lift{scale:1.14 1.08;background:rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 18px rgba(0,0,0,.14)}
:root[data-look="K"][data-theme="dark"] :is(.tab-ind,.nav-ind).lg-lift{background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.4)}
:root[data-look="K"] :is(#tabbar,#nav) button .i{transition:scale calc(300ms*var(--k)) var(--spring)}
:root[data-look="K"] :is(#tabbar,#nav) button:active .i{scale:.88}
:root[data-look="K"] :is(#tabbar,#nav){touch-action:none}

/* settings menu: grows out of the settings button's own 44pt shape (clip-path), rows follow 32ms apart; closes with a quick ease-in */
:root[data-look="K"] #pop{transform:none;opacity:0;clip-path:inset(var(--ct,0px) var(--cr,0px) var(--cb,0px) var(--cl,0px) round 22px);
  transition:clip-path calc(260ms*var(--k)) var(--ease-in),opacity calc(180ms*var(--k)) linear calc(80ms*var(--k))}
:root[data-look="K"] #pop.open{clip-path:inset(-40px round calc(var(--r-card) + 40px));opacity:1;
  transition:clip-path calc(400ms*var(--k)) var(--spring),opacity calc(120ms*var(--k)) linear}
:root[data-look="K"] #pop>*{opacity:0;translate:0 -6px;transition:opacity calc(160ms*var(--k)) var(--ease-out),translate calc(260ms*var(--k)) var(--ease-out)}
:root[data-look="K"] #pop.open>*{opacity:1;translate:none}
:root[data-look="K"] #pop.open>:nth-child(1){transition-delay:calc(90ms*var(--k))}
:root[data-look="K"] #pop.open>:nth-child(2){transition-delay:calc(122ms*var(--k))}
:root[data-look="K"] #pop.open>:nth-child(3){transition-delay:calc(154ms*var(--k))}
:root[data-look="K"] #pop.open>:nth-child(4){transition-delay:calc(186ms*var(--k))}
:root[data-look="K"] #pop.open>:nth-child(n+5){transition-delay:calc(218ms*var(--k))}

/* entrance: the glass rises in after the content, staggered */
@keyframes lg-rise{from{opacity:0;translate:0 14px;scale:.96}}
:root[data-look="K"] #app:not(.pre) :is(.top .sync,.top .ibtn,#tabbar,.side){animation:lg-rise calc(620ms*var(--k)) var(--spring) backwards}
:root[data-look="K"] #app:not(.pre) :is(.top .sync,.side){animation-delay:calc(120ms*var(--k))}
:root[data-look="K"] #app:not(.pre) .top .ibtn{animation-delay:calc(160ms*var(--k))}
:root[data-look="K"] #app:not(.pre) #tabbar{animation-delay:calc(200ms*var(--k))}

/* phone: scrolling down folds the tab bar into a pill holding the current tab (width shrinks, the row of tabs slides); tapping it unfolds */
@media (max-width:720px){
  :root[data-look="K"] #tabbar{--tbw:calc((100vw - 60px) / 5);overflow:hidden;transition:right calc(400ms*var(--k)) var(--spring)}
  :root[data-look="K"] #tabbar button{flex:0 0 var(--tbw);width:var(--tbw)}
  :root[data-look="K"] #tabbar>*{translate:0 0;transition:translate calc(400ms*var(--k)) var(--spring),scale calc(320ms*var(--k)) var(--spring),opacity calc(200ms*var(--k)) var(--ease-out),color .2s,background-color .2s,box-shadow .2s}
  :root[data-look="K"] #app.bars-off #tabbar{right:calc(100% - 25px - var(--tbw) - 10px);cursor:pointer}
  :root[data-look="K"] #app.bars-off #tabbar>*{translate:calc(var(--fold-i,0) * var(--tbw) * -1) 0}
  :root[data-look="K"] #app.bars-off #tabbar button:not(.on){opacity:0;pointer-events:none}
}

/* ── iPhone (≤720): floating glass tab bar, 44pt glass buttons above a 34pt large title that shrinks on scroll ── */
@media (max-width:720px){
  :root[data-look="K"] #app.bars-off{--tab-off:var(--tabh)}
  :root[data-look="K"] #app.bars-off .top,:root[data-look="K"] #app.bars-off .tabbar{transform:none}
  :root[data-look="K"] .top{flex-wrap:wrap;justify-content:flex-end;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px;background:none}
  :root[data-look="K"] .top .ttl{order:2;flex:1 0 100%;margin:0;transition:transform calc(260ms*var(--k)) var(--ease-out)}
  :root[data-look="K"] .top .ttl h1{transition:font-size calc(220ms*var(--k)) var(--ease-out)}
  :root[data-look="K"] .top.elev .ttl{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 8px);height:var(--ctl);max-width:calc(100% - 32px - 4*var(--ctl) - 3*10px - 8px);flex:none}
  :root[data-look="K"] .top.elev .ttl h1{font:var(--w-emph) var(--hl)/var(--ctl) var(--fb);letter-spacing:var(--body-t)}
  :root[data-look="K"] .top.elev .sub{display:none}
  /* scroll edge effect (kit: soft blur under the bars) */
  :root[data-look="K"] .top::before{content:"";position:absolute;inset:0 0 -24px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .25s;
    background:linear-gradient(var(--bg) 40%,color-mix(in srgb,var(--bg) 0%,transparent));backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
  :root[data-look="K"] .top.elev::before{opacity:1}
  :root[data-look="K"] #view{padding:calc(env(safe-area-inset-top,0px) + 117px) 16px calc(var(--tabh) + 28px)}
  :root[data-look="K"] .tabbar{left:25px;right:25px;bottom:calc(max(env(safe-area-inset-bottom,0px) - 9px,0px) + 14px);margin:0;padding:4px;border:1px solid var(--glass-bd);border-radius:999px;justify-content:stretch;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-sh)}
  :root[data-look="K"] .tabbar button{flex:1 1 0;width:auto;height:54px;padding:6px 2px 7px;gap:1px;align-content:center;color:var(--glass-ink);font:var(--w-emph) 10px/12px var(--fb);letter-spacing:0}
  :root[data-look="K"] .tabbar button .i{width:24px;height:24px}
  :root[data-look="K"] .tabbar button{height:48px;padding:0;font-size:0;line-height:0;place-items:center}
  :root[data-look="K"] .tab-ind{height:48px}
  :root[data-look="K"] .tabbar button.on,:root[data-look="K"][data-theme="light"] .tabbar button.on{color:var(--ac)}
  :root[data-look="K"] .tab-ind{top:4px;height:48px;border-radius:999px;background:var(--sel);box-shadow:var(--lens-hi)}
  :root[data-look="K"] #totop{right:16px}
  :root[data-look="K"] #pop{border-radius:var(--r-card)}
  :root[data-look="K"] #sheet{border-radius:38px 38px 0 0;left:0;right:0;bottom:0}
  :root[data-look="K"] #form{padding:8px 0 0}
  :root[data-look="K"] .fm-card{border-radius:38px 38px 0 0}
  :root[data-look="K"] .nfg{grid-template-columns:auto minmax(0,1fr)}
  /* the shared compact phone rules are replaced by the kit's sizes */
}
@media (max-width:430px){
  :root[data-look="K"] .top{padding-left:16px;padding-right:16px}
  :root[data-look="K"] #view{padding-left:16px;padding-right:16px}
  :root[data-look="K"] .panel,:root[data-look="K"] .tabs-wrap{padding:var(--pad)}
  :root[data-look="K"] .btn,:root[data-look="K"] .b1{padding:0 14px;font-size:var(--sub)}
  :root[data-look="K"] .pill{font-size:var(--foot);padding:3px 8px}
  :root[data-look="K"] .ph h3{font-size:var(--t3)}
  :root[data-look="K"] .task{padding:11px 0}
  :root[data-look="K"] .task .tt{font-size:var(--body)}
  :root[data-look="K"] .task .cb{width:24px;height:24px;border-radius:50%}
  :root[data-look="K"] .lg-name{font-size:var(--lt)}
  :root[data-look="K"] .lg-card{padding:28px 20px 20px}
  :root[data-look="K"] .slide{height:52px}:root[data-look="K"] .thumb{width:44px;height:44px}
}

/* ── iPad (721–1040): icon sidebar as a floating glass column (HIG) ── */
@media (min-width:721px) and (max-width:1040px){
  :root[data-look="K"] .side{margin:12px 0 12px 12px;border:1px solid var(--glass-bd);border-radius:var(--r-card);background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-sh)}

}

/* ── Desktop (≥1041): iPadOS 27 sizes from the kit (17pt text, 52pt rows, 44pt controls) with a floating glass icon sidebar ── */
@media (min-width:1041px){
  :root[data-look="K"] #app{grid-template-columns:84px minmax(0,1fr)}
  :root[data-look="K"] .side{margin:12px 0 12px 12px;padding:16px 10px;gap:4px;align-items:center;border:1px solid var(--glass-bd);border-radius:28px;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-sh)}

  :root[data-look="K"] .fm-card,:root[data-look="K"] #sheet{border-radius:var(--r-card)}
}

/* ───────── RECYCLE BIN + DATA (every style) ───────── */
.bin-list{padding:4px 0;display:grid}
.bin-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:64px;padding:10px 16px}
.bin-row + .bin-row{border-top:1px solid var(--line)}
.bin-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--hover);color:var(--mu)}
.bin-tx{min-width:0;display:grid;gap:2px}
.bin-tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin-tx span{font-size:13px;line-height:18px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin-acts{display:flex;align-items:center;gap:8px}
.bin-why{font-size:13px;color:var(--mu);text-align:right;max-width:200px}
.bin-wipe.armed,.bin-empty.armed{width:auto;padding:0 14px;border-radius:999px;background:var(--bad);border-color:transparent;color:#fff;font:600 13px/1 var(--fb)}
.bin-list .empty{padding:32px 20px}
.pop-data{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pop-data .btn{justify-content:center}
.pop-data .wide{grid-column:1/-1}
.pop-data .n{font:600 12px/1 var(--fm);padding:3px 7px;border-radius:999px;background:var(--hover);color:var(--mu)}
@media (max-width:600px){.bin-row{grid-template-columns:36px minmax(0,1fr)} .bin-acts{grid-column:2;justify-content:flex-start} .bin-why{text-align:left}}

/* ───────── DASHBOARD (every style): Needs you, four tiles, this week, then the rest under "More" ───────── */
.db{gap:16px}
.db-greet{display:none;margin:-2px 2px 0;font:400 14px/20px var(--fb);color:var(--mu)}
.db-needs,.db-week{padding:0 0 8px;min-width:0}
.db-needs>.ph,.db-week>.ph{padding:16px 20px 8px;align-items:center}
.db .ph h3{white-space:nowrap}
.db .ph>span{min-width:0;text-align:right}
.db-needs>.ph>span{margin-right:auto;text-align:left;font-variant-numeric:tabular-nums}
.db-link{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin:-10px -8px -10px 0;padding:0 8px;border:0;border-radius:var(--r-sm);background:none;color:var(--ac);font:600 14px/20px var(--fb);cursor:pointer}
.db-link:hover{background:var(--hover)}
.db-needs{container-type:inline-size}
.db-list{display:grid;padding:0 8px 0 6px}
.db-need{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;min-width:0}
.db-cc{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer;color:var(--ok);border-radius:50%;position:relative}
.db-cc::before{content:"";position:absolute;inset:11px;border-radius:50%;border:1.5px solid var(--line-2);transition:border-color .2s,background-color .2s}
.db-cc svg{position:relative;opacity:0;transform:scale(.6);transition:opacity .2s,transform calc(300ms*var(--k)) var(--spring)}
.db-cc:hover::before,.db-cc:focus-visible::before{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.db-cc:hover svg,.db-cc:focus-visible svg{opacity:1;transform:none}
.db-cc:active svg{transform:scale(.85)}
.db-ic{width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.db-main{display:grid;grid-template-columns:minmax(0,1fr) 96px 196px 16px;gap:16px;align-items:center;min-height:60px;padding:10px 12px 10px 6px;border:0;border-radius:var(--r-sm);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;min-width:0;transition:background-color .2s,transform calc(300ms*var(--k)) var(--spring)}
.db-need + .db-need .db-main{box-shadow:inset 0 1px 0 var(--line)}
.db-main:hover{background:var(--hover)}
.db-main:active{transform:scale(.99)}
.db-tx{display:grid;gap:2px;min-width:0}
.db-t{font:600 14.5px/20px var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-s{display:flex;align-items:center;gap:6px;min-width:0;font:400 12.5px/16px var(--fb);color:var(--mu)}
.db-s svg{flex:none}
.db-s .mono{flex:none;color:var(--tx);font-weight:500;font-size:12px}
.db-sn{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-dt{font:500 13px/16px var(--fb);color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.db-main .pill{justify-self:end;max-width:100%;overflow:hidden}
.db-chev{display:grid;color:var(--mu);opacity:.7}
.db-empty{display:flex;align-items:center;gap:10px;margin:0;padding:6px 20px 14px;color:var(--mu);font-size:14px}
.db-empty svg{color:var(--ok);flex:none}
.db-week .db-empty svg{color:var(--mu)}
@container (max-width:640px){
  .db-main{grid-template-columns:minmax(0,1fr) auto;gap:12px;padding-right:8px}
  .db-dt,.db-chev,.db-w{display:none}
}
.db-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:inherit}
.db-tile{display:grid;gap:4px;align-content:start;padding:16px 20px;font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0;appearance:none}
.db-tile:active{transform:scale(.98)}
.db-tl{font:500 13px/16px var(--fb);color:var(--mu);text-transform:var(--lab-tt);letter-spacing:var(--lab-ls);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-tn{font-family:var(--fn);font-size:24px;line-height:32px;font-weight:max(500,var(--n-w));letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.db-tn.bad{color:var(--bad)}

.db-wl{display:flex;justify-content:space-between;gap:8px;font:600 13px/16px var(--fb);color:var(--mu)}
.db-wd.today .db-wl{color:var(--ac)}
.db-wd.off .db-wl,.db-none{color:color-mix(in srgb,var(--mu) 70%,transparent)}
.db-none{font:400 12.5px/16px var(--fb)}
.db-wi{display:flex;gap:8px;align-items:flex-start;width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:color-mix(in srgb,var(--tx) 4%,transparent);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background-color .2s,transform calc(300ms*var(--k)) var(--spring)}
.db-wi:hover{background:var(--hover)}
.db-wi:active{transform:scale(.97)}
.db-wi svg{flex:none;margin-top:1px;color:var(--mu)}
.db-wi>span{display:grid;min-width:0}
.db-wi b{font:600 13px/16px var(--fb);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.db-wi span span{font-size:12px;line-height:16px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
