/* motion levels */

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background-color .5s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{flex:none;display:block}
.mono{font-family:var(--fm);font-size:11.5px;letter-spacing:.02em}
.muted{color:var(--mu)}

/* ambient orbs */
.orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(80px);transition:background .6s}
.o1{width:56vmax;height:56vmax;left:-18vmax;top:-22vmax;background:var(--orb1);animation:drift1 34s ease-in-out infinite alternate}
.o2{width:48vmax;height:48vmax;right:-16vmax;top:14vmax;background:var(--orb2);animation:drift2 41s ease-in-out infinite alternate}
.o3{width:44vmax;height:44vmax;left:30%;bottom:-26vmax;background:var(--orb3);animation:drift3 29s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-10vmax,6vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(8vmax,-10vmax) scale(1.1)}}
:root:not([data-motion="full"]) .orb{animation:none}

/* ───────── LOGIN ───────── */
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:var(--bg);transition:opacity calc(700ms*var(--k)) .15s,visibility 0s calc(900ms*var(--k))}

  transition:transform calc(800ms*var(--k)) var(--ease-out),filter calc(600ms*var(--k)),opacity calc(600ms*var(--k));animation:cardin calc(1000ms*var(--k)) var(--ease-out) both}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(10px)}}

.fld{display:grid;gap:6px}
.fld label{font-size:12.5px;color:var(--mu);font-weight:500}
.fld input{width:100%;padding:13px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--hover);color:var(--tx);font:500 15px var(--fb);transition:border-color .2s,box-shadow .2s}
.fld input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.keep{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu);cursor:pointer;user-select:none}
.sw{width:40px;height:24px;border-radius:99px;background:var(--track);position:relative;transition:background .25s;flex:none;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--tx);transition:transform calc(var(--spring-d)*var(--k)) var(--spring)}
.keep input{position:absolute;opacity:0;pointer-events:none}
.keep input:checked + .sw{background:var(--ac)}
.keep input:checked + .sw::after{transform:translateX(16px);background:var(--on-ac)}
.keep input:focus-visible + .sw{outline:2px solid var(--ac);outline-offset:2px}
.slide{--x:0px;position:relative;height:62px;border-radius:999px;background:var(--hover);border:1px solid var(--line);overflow:hidden;margin-top:6px;touch-action:none;user-select:none}

  background:linear-gradient(100deg,var(--mu) 30%,var(--tx) 50%,var(--mu) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.thumb{position:absolute;left:4px;top:4px;width:52px;height:52px;border-radius:50%;border:0;background:var(--ac-grad);color:var(--on-ac);display:grid;place-items:center;cursor:grab;box-shadow:var(--glow);transform:translateX(var(--x));transition:transform calc(var(--spring-d)*var(--k)) var(--spring)}
.slide.drag .thumb,.slide.drag .slide-fill{transition:none}

.thumb .i{transition:transform .3s var(--ease-out),opacity .2s}
.slide.done .slide-txt{opacity:0}
.slide.done .slide-fill{opacity:.5}
.slide.done .thumb{animation:thumbpop calc(500ms*var(--k)) var(--ease-out)}
@keyframes thumbpop{50%{transform:translateX(var(--x)) scale(1.18)}}
.lg-foot{margin:0;text-align:center;font-size:12px;color:var(--mu)}

.main{position:relative;z-index:2;display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:20px 32px 8px;min-width:0}
.top .ttl{min-width:0;margin-right:auto;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font:var(--h-w) clamp(26px,3vw,34px)/1.1 var(--fd);letter-spacing:var(--h-ls);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:13px;color:var(--mu);white-space:nowrap}
.sync{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--hover);font-size:13px;color:var(--mu);cursor:pointer;white-space:nowrap}
.sync .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sync.busy .pulse{background:var(--ac);animation:spinpulse .8s linear infinite;border-radius:2px}
@keyframes spinpulse{to{transform:rotate(360deg)}}
.theme-btn>span{position:absolute;inset:0;display:grid;place-items:center;transition:transform calc(700ms*var(--k)) var(--spring),opacity .3s}
:root[data-theme="light"] .theme-btn .moon,:root[data-theme="dark"] .theme-btn .sun{transform:rotate(-120deg) scale(.4);opacity:0}
#view{position:relative;overflow:auto;min-height:0;padding:10px 32px 48px;view-transition-name:view;scrollbar-gutter:stable;scroll-behavior:smooth}
.tabbar{display:none}

/* ───────── COMMON ───────── */
.card{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:transform calc(var(--spring-soft-d)*var(--k)) var(--spring-soft),border-color .25s,background-color .5s}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(380px circle at var(--mx,-999px) var(--my,-999px),color-mix(in srgb,var(--ac) 13%,transparent),transparent 45%);opacity:0;transition:opacity .35s}
.card:hover::after{opacity:1}
:root:not([data-motion="full"]) .card::after{display:none}
.hov:hover{border-color:var(--line-2)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ph h3{margin:0;font:var(--ph-w) 18px/1.2 var(--fd);letter-spacing:-.02em}
.ph span{font:600 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--fb);padding:6px 9px;border-radius:var(--r-pill);background:var(--hover);color:var(--tx);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:transparent}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);border-color:transparent}
.pill.info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info);border-color:transparent}
.dotc{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn,.b1{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--fb);padding:12px 16px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap;transition:transform calc(var(--spring-d)*var(--k)) var(--spring),border-color .2s,box-shadow .3s}
.btn{border:1px solid var(--line-2);background:var(--hover);color:var(--tx)}
.b1{border:0;background:var(--ac-grad);color:var(--on-ac);box-shadow:var(--glow)}
.btn:active,.b1:active{transform:scale(.95)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.25;transform:scale(0);animation:ripple calc(650ms*var(--k)) var(--ease-out) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* segmented with gliding indicator */
.seg{position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:var(--r-pill);background:var(--hover);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:var(--r-pill);background:var(--sel);border:1px solid var(--line);box-shadow:0 4px 14px -6px rgba(0,0,0,.35);transition:transform calc(var(--spring-d)*var(--k)) var(--spring),width calc(var(--spring-d)*var(--k)) var(--spring);pointer-events:none}
.seg.acc .ind{background:var(--ac-grad);border:0;box-shadow:var(--glow)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:9px 14px;border-radius:var(--r-pill);cursor:pointer;color:var(--mu);font:600 13.5px/1 var(--fb);white-space:nowrap;display:inline-flex;gap:7px;align-items:center;transition:color .25s}
.seg button.on{color:var(--tx)}
.seg.acc button.on{color:var(--on-ac)}
.seg button .n{font-variant-numeric:tabular-nums;opacity:.7}

/* entrance */
.st{animation:rise calc(700ms*var(--k)) var(--ease-out) both;animation-delay:calc(var(--i,0)*55ms*var(--k))}
@keyframes rise{from{opacity:.001;transform:translateY(16px) scale(.985);filter:blur(6px)}}
:root[data-motion="off"] .st{animation:none}

/* ───────── VIEW TRANSITIONS ───────── */
::view-transition-group(*){animation-duration:calc(420ms*var(--k));animation-timing-function:var(--ease-out)}
:root[data-vt]:not([data-vt="style"])::view-transition-old(root),:root[data-vt]:not([data-vt="style"])::view-transition-new(root){animation:none}
:root[data-vt="fwd"]::view-transition-old(view){animation:out-l calc(260ms*var(--k)) var(--ease-in) both}
:root[data-vt="fwd"]::view-transition-new(view){animation:in-r calc(620ms*var(--k)) var(--ease-out) both}
:root[data-vt="back"]::view-transition-old(view){animation:out-r calc(260ms*var(--k)) var(--ease-in) both}
:root[data-vt="back"]::view-transition-new(view){animation:in-l calc(620ms*var(--k)) var(--ease-out) both}
@keyframes out-l{to{opacity:0;transform:translateX(-40px) scale(.985);filter:blur(8px)}}
@keyframes out-r{to{opacity:0;transform:translateX(40px) scale(.985);filter:blur(8px)}}
@keyframes in-r{from{opacity:0;transform:translateX(56px) scale(.985);filter:blur(10px)}}
@keyframes in-l{from{opacity:0;transform:translateX(-56px) scale(.985);filter:blur(10px)}}
:root[data-vt="morph"]::view-transition-old(view),:root[data-vt="morphback"]::view-transition-old(view){animation:fadeout calc(220ms*var(--k)) var(--ease-in) both}
:root[data-vt="morph"]::view-transition-new(view),:root[data-vt="morphback"]::view-transition-new(view){animation:fadein calc(500ms*var(--k)) calc(120ms*var(--k)) var(--ease-out) both}
@keyframes fadeout{to{opacity:0;filter:blur(6px)}}
@keyframes fadein{from{opacity:0;filter:blur(6px)}}
::view-transition-group(hero),::view-transition-group(herobox){animation-duration:calc(var(--spring-soft-d)*1.3*var(--k));animation-timing-function:var(--spring-soft)}
:root[data-vt="list"]::view-transition-old(view){animation:none;opacity:0}
:root[data-vt="list"]::view-transition-new(view){animation:none}
:root[data-vt="list"] .row,:root[data-vt="list"] .task{view-transition-name:var(--n)}
:root[data-vt="theme"] *{view-transition-name:none!important}
:root[data-vt="theme"]::view-transition-old(root){animation:none}
:root[data-vt="theme"]::view-transition-new(root){animation:reveal calc(800ms*var(--k)) var(--ease-io) both}
@keyframes reveal{from{clip-path:circle(0 at var(--rx,50%) var(--ry,50%))}to{clip-path:circle(150vmax at var(--rx,50%) var(--ry,50%))}}
:root[data-vt="style"] *{view-transition-name:none!important}
:root[data-vt="style"]::view-transition-old(root){animation:styleout calc(500ms*var(--k)) var(--ease-io) both}
:root[data-vt="style"]::view-transition-new(root){animation:stylein calc(700ms*var(--k)) var(--ease-out) both}
@keyframes styleout{to{opacity:0;filter:blur(10px);transform:scale(1.02)}}
@keyframes stylein{from{opacity:0;filter:blur(10px);transform:scale(.98)}}
/* fallback when View Transitions API is missing */
.vt-fallback{animation:in-r calc(520ms*var(--k)) var(--ease-out) both}

/* ───────── DASHBOARD ───────── */
.dash{display:grid;gap:16px}
.hero{position:relative;overflow:hidden;padding:30px 30px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.hero .eyebrow{font:600 11px/1 var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--mu);margin-bottom:12px}
.hero h2{margin:0;font:var(--h-w) clamp(34px,4.6vw,58px)/1.04 var(--fd);letter-spacing:var(--h-ls);text-wrap:balance}
.hero h2 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em}
.hero h2 .w>span{display:inline-block;animation:wordin calc(900ms*var(--k)) var(--ease-out) both;animation-delay:calc(120ms + var(--i)*70ms*var(--k))}
@keyframes wordin{from{transform:translateY(105%);opacity:0}}
:root:not([data-motion="full"]) .hero h2 .w>span{animation:none}
.hero h2 em{font-style:normal;background:var(--ac-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-look="A"] .hero h2 em{font-style:italic}
.hero p{margin:14px 0 0;color:var(--mu);max-width:58ch;font-size:15.5px}
.hero p b{color:var(--tx);font-weight:600}
.hero .cta{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:18px 18px 16px;display:grid;gap:6px;cursor:pointer;transform-style:preserve-3d;will-change:transform}
.kpi .lab{font:500 13px/1.2 var(--fb);color:var(--mu);text-transform:var(--lab-tt);letter-spacing:var(--lab-ls)}
.kpi .val{font:var(--n-w) 58px/1 var(--fn);letter-spacing:var(--n-ls);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px}
.kpi .val small{font-size:.4em;color:var(--mu);letter-spacing:0}
.kpi .sub{font-size:13px;color:var(--mu);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi .spark{position:absolute;right:14px;top:16px;width:72px;height:28px}
.kpi.alert{background:linear-gradient(150deg,color-mix(in srgb,var(--bad) 20%,transparent),var(--surf) 62%);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.grid3{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.35fr) minmax(0,1.2fr);gap:14px}
.panel{padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.ringwrap{display:grid;grid-template-columns:136px minmax(0,1fr);gap:16px;align-items:center}
.ringc{position:relative;width:136px;height:136px}
.ring{width:136px;height:136px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dasharray calc(800ms*var(--k)) var(--ease-out),stroke-dashoffset calc(800ms*var(--k)) var(--ease-out)}
.ring .track{stroke:var(--track)}
.ring .seg-a{animation:segin calc(1300ms*var(--k)) calc(200ms*var(--k)) var(--ease-out) both}
@keyframes segin{from{stroke-dasharray:0 999}}
.ringc .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringc .c b{font:var(--n-w) 34px/1 var(--fn);letter-spacing:var(--n-ls)}
.ringc .c>span{font-size:11.5px;color:var(--mu)}
.legend{display:grid;gap:10px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font:600 14px var(--fn);font-variant-numeric:tabular-nums}
.chartwrap{position:relative}
.area{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.area text{font:500 10.5px var(--fb);fill:var(--mu)}
.area .grid{stroke:var(--line)}
.area .ln{fill:none;stroke:var(--c1);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:var(--len);animation:draw calc(1500ms*var(--k)) calc(250ms*var(--k)) var(--ease-io) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
.area .fill{animation:fadein calc(900ms*var(--k)) calc(700ms*var(--k)) both}
.area .end{fill:var(--c1);stroke:var(--surf-solid);stroke-width:3}
.area .endpulse{fill:var(--c1);opacity:.35;transform-box:fill-box;transform-origin:center;animation:ping 2s var(--ease-out) infinite}
@keyframes ping{from{transform:scale(1);opacity:.45}to{transform:scale(3.2);opacity:0}}
.area .scrub{stroke:var(--line-2);stroke-dasharray:3 3;opacity:0;transition:opacity .2s}
.area .sdot{fill:var(--surf-solid);stroke:var(--c1);stroke-width:2.5;opacity:0;transition:opacity .2s}
.chartwrap.scrubbing .scrub,.chartwrap.scrubbing .sdot{opacity:1}
.tip{position:absolute;top:0;left:0;pointer-events:none;padding:8px 10px;border-radius:12px;background:var(--surf-solid);border:1px solid var(--line-2);font-size:12.5px;white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,-110%) scale(.9);transition:opacity .2s,transform calc(var(--spring-d)*var(--k)) var(--spring)}
.tip b{font:600 15px var(--fn);display:block}
.chartwrap.scrubbing .tip{opacity:1;transform:translate(-50%,-120%) scale(1)}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum b{font:var(--n-w) 30px/1 var(--fn);letter-spacing:var(--n-ls)}
.list{display:grid;gap:2px;margin:0 -6px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-radius:var(--r-sm);cursor:pointer;border:0;background:none;text-align:left;width:100%;transition:background .2s,transform calc(var(--spring-d)*var(--k)) var(--spring)}
.li:hover{background:var(--hover)}
.li:active{transform:scale(.985)}
.sev{width:3px;height:34px;border-radius:4px;background:var(--c)}
.li .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.pipe{display:grid;gap:12px}
.pipe .r{display:grid;grid-template-columns:130px minmax(0,1fr) 28px;gap:12px;align-items:center;font-size:13.5px}
.pipe .bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.pipe .bar i{display:block;height:100%;border-radius:inherit;background:var(--bar-grad);transform-origin:left;animation:grow calc(1000ms*var(--k)) var(--ease-out) both;animation-delay:calc(300ms*var(--k) + var(--i)*80ms*var(--k))}
@keyframes grow{from{transform:scaleX(0)}}
.pipe b{text-align:right;font:600 14px var(--fn);font-variant-numeric:tabular-nums}
.fload{display:grid;gap:14px}
.fload .r{display:grid;gap:8px}
.fload .top2{display:flex;justify-content:space-between;font-size:13.5px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;transform-origin:left;animation:grow calc(1000ms*var(--k)) var(--ease-out) both;animation-delay:calc(350ms*var(--k) + var(--i)*90ms*var(--k))}

/* ───────── INQUIRIES ───────── */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--hover);color:var(--mu);transition:border-color .2s,box-shadow .25s}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:500 14.5px var(--fb);outline:none}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:4px minmax(0,2.2fr) minmax(0,1.5fr) minmax(0,1.1fr) auto;gap:16px;align-items:center;padding:14px 18px 14px 14px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.row:active{transform:scale(.99)}
.row .bar4{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.row .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;margin-top:6px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--track)}
.steps i.d{background:var(--ac)}
.steps i.c{background:color-mix(in srgb,var(--ac) 45%,transparent);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.slab{font-size:12.5px;color:var(--mu)}
.slab b{color:var(--tx);font-weight:600}
.wd{display:flex;gap:3px;margin-top:6px}
.wd i{width:14px;height:6px;border-radius:3px;background:var(--track)}
.wd i.on{background:var(--c)}
.rv{text-align:right;font:var(--n-w) 20px/1 var(--fn);letter-spacing:var(--n-ls);white-space:nowrap}
.rv small{display:block;margin-top:4px;font:500 11px var(--fm);color:var(--mu);letter-spacing:.02em}
.empty{padding:48px 20px;text-align:center;color:var(--mu)}
.empty b{display:block;font:var(--h-w) 24px var(--fd);color:var(--tx);margin-bottom:6px}

/* sheet */
#scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity calc(350ms*var(--k))}
#scrim.on{opacity:1;pointer-events:auto;view-transition-name:scrim}
#sheet{position:fixed;z-index:41;top:12px;right:12px;bottom:12px;width:min(470px,calc(100% - 24px));border-radius:28px;background:color-mix(in srgb,var(--surf-solid) 88%,transparent);border:1px solid var(--line-2);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);box-shadow:0 40px 80px -30px rgba(0,0,0,.6);
  transform:translateX(calc(100% + 30px));transition:transform calc(var(--spring-soft-d)*1.2*var(--k)) var(--spring-soft),visibility 0s linear calc(var(--spring-soft-d)*1.2*var(--k));display:flex;flex-direction:column;overflow:hidden;visibility:hidden}
#sheet.open{view-transition-name:sheet;transform:translateX(var(--drag,0px));visibility:visible;transition:transform calc(var(--spring-soft-d)*1.2*var(--k)) var(--spring-soft),visibility 0s}
#sheet.dragging{transition:none}
.grab{display:none}
.sh-head{padding:22px 22px 12px;display:grid;gap:10px;cursor:grab;touch-action:none}
.sh-head .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{margin:0;font:var(--h-w) 28px/1.15 var(--fd);letter-spacing:var(--h-ls)}
.sh-body{padding:4px 22px 22px;overflow:auto;display:grid;gap:16px;align-content:start}
.sh-body>*{animation:rise calc(600ms*var(--k)) var(--ease-out) both;animation-delay:calc(140ms*var(--k) + var(--i,0)*60ms*var(--k))}
.slabox{padding:16px;display:grid;gap:12px}
.slabig{display:flex;align-items:baseline;gap:10px}
.slabig b{font:var(--n-w) 46px/1 var(--fn);letter-spacing:var(--n-ls)}
.wd5{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd5 i{height:10px;border-radius:4px;background:var(--track);position:relative;overflow:hidden}
.wd5 i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;animation:grow2 calc(400ms*var(--k)) var(--ease-out) forwards;animation-delay:calc(300ms*var(--k) + var(--i)*90ms*var(--k))}
.wd5 i.off::after{display:none}
.wd5 i.lim{outline:1px dashed var(--line-2);outline-offset:2px}
@keyframes grow2{to{transform:scaleX(1)}}
.tl{display:grid;gap:0;position:relative}
.tl .st2{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl .st2:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:2px;width:2px;background:var(--track)}
.tl .st2.d:not(:last-child)::before{background:var(--ac)}
.node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--surf-solid);position:relative;z-index:1;transition:background .3s,border-color .3s}
.st2.d .node{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.st2.d .node svg path{stroke-dasharray:24;stroke-dashoffset:0;animation:checkdraw calc(450ms*var(--k)) var(--ease-out) both}
@keyframes checkdraw{from{stroke-dashoffset:24}}
.st2.c .node{border-color:var(--ac)}
.st2.c .node::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ac);animation:ring 1.8s var(--ease-out) infinite}
@keyframes ring{from{opacity:.8;transform:scale(.7)}to{opacity:0;transform:scale(1.3)}}

/* ───────── SCROLLING ───────── */

#view,.sh-body,.cmd-list,.side{scrollbar-width:thin;scrollbar-color:transparent transparent;overscroll-behavior:contain}

/* horizontal: no scrollbar at all; soft fades show there is more */

/* springs as CSS linear() easings, simulated once */
function spring(k, c){ let x = 0, v = 0, n = 0; const dt = 1/60, pts = [0];
  for (let i = 0; i < 300; i++){ const a = -k*(x-1) - c*v; v += a*dt; x += v*dt; n++; pts.push(+x.toFixed(4)); if (Math.abs(x-1) < .002 && Math.abs(v) < .02) break; }
  pts.push(1); return { e: `linear(${pts.join(',')})`, d: Math.round(n*dt*1000) }; }
if (window.CSS && CSS.supports('transition-timing-function', 'linear(0, 1)')){
  const a = spring(240, 15), b = spring(190, 25);
  root.style.setProperty('--spring', a.e); root.style.setProperty('--spring-d', a.d + 'ms');
  root.style.setProperty('--spring-soft', b.e); root.style.setProperty('--spring-soft-d', b.d + 'ms');
}

const dstr = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
function todayStr(){ return dstr(new Date()); }
function addDays(s, n){ const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); }
function fmtDate(s, withYear){ if (!s) return ''; try { const d = new Date(String(s).slice(0,10) + 'T00:00:00'); if (isNaN(d)) return String(s);
  return d.toLocaleDateString('en-GB', withYear || d.getFullYear() !== new Date().getFullYear() ? {day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short'}); } catch(e){ return String(s); } }
function daysSince(s){ if (!s) return 9999; return Math.floor((Date.now() - new Date(String(s).slice(0,10) + 'T00:00:00').getTime()) / 86400000); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SLA_DAYS = 5, SLA_RISK_DAYS = 1, TASK_UPCOMING_DAYS = 3, PROJECT_UPCOMING_DAYS = 7;
const _isMoldTask = t => /mold\s*(inquiry|request)/i.test(t.name||'') && !/^follow/i.test(t.name||'');
const _isImlTask  = t => /\biml\b/i.test(t.name||'') && !/^follow/i.test(t.name||'');
const _isNpdTask  = t => /npd\s*input/i.test(t.name||'') && !/^follow/i.test(t.name||'');
function _isWorkDay(ds){ const d = new Date(ds + 'T00:00:00').getDay(); return d !== 0 && d !== 6; }
function addWorkDays(ds, n){ let d = ds; while (n > 0){ d = addDays(d, 1); if (_isWorkDay(d)) n--; } return d; }
function workDaysBetween(a, b){
  if (a === b) return 0;
  const sign = b > a ? 1 : -1, [lo, hi] = sign > 0 ? [a, b] : [b, a];
  let n = 0, d = lo; while (d < hi){ d = addDays(d, 1); if (_isWorkDay(d)) n++; }
  return sign * n;
}
function inquirySLA(inq){
  if (!inq || !inq.date || String(inq.status||'').toUpperCase() !== 'OPEN' || inq.outcome) return null;
  const today = todayStr(), day0 = inq.date, tasks = inq.tasks||[], pipe = inq.pipeline||{};
  const elapsed = Math.max(0, workDaysBetween(day0, today));
  const moldT = tasks.find(_isMoldTask), imlT = tasks.find(_isImlTask), npdT = tasks.find(_isNpdTask);
  const moldPipeDone = /^done$/i.test(pipe.moldInquiry?.status||'');
  const moldDone = !!(moldT && moldT.done) || moldPipeDone;
  const moldOn = (moldT && moldT.done && moldT.completedAt) || (moldPipeDone ? pipe.moldInquiry.date : '') || '';
  const costSt = pipe.costing?.status||'';
  const npdDone = !!(npdT && npdT.done) || /^(ongoing|done)$/i.test(costSt);
  const npdOn = (npdT && npdT.done && npdT.completedAt) || (/^(ongoing|done)$/i.test(costSt) ? pipe.costing.date : '') || '';
  const lastDay = addWorkDays(day0, SLA_DAYS);
  let npdDue = lastDay;
  if (moldDone && moldOn){ const d = addWorkDays(moldOn, 2); if (d < npdDue) npdDue = d; }
  const stages = [{key:'mold', label:'Send Mold Inquiry', due: addWorkDays(day0, 2), done: moldDone, doneOn: moldOn, task: moldT}];
  if (imlT) stages.push({key:'iml', label:'Send IML Inquiry', due: addWorkDays(day0, 2), done: !!imlT.done, doneOn: imlT.completedAt||'', task: imlT});
  stages.push({key:'npd', label:'NPD Input → Finance', due: npdDue, done: npdDone, doneOn: npdOn, task: npdT});
  const rank = {overdue:3, risk:2, ok:1, done:0};
  stages.forEach(st => {
    if (st.done){ st.state = 'done'; return; }
    const left = workDaysBetween(today, st.due);
    st.state = st.due < today ? 'overdue' : left <= SLA_RISK_DAYS ? 'risk' : 'ok';
  });
  const allTasksDone = tasks.length > 0 && tasks.every(t => t.done) && !(inq.nextActions||[]).some(n => !n.done);
  const res = {elapsed, stages, stalled: allTasksDone, complete: npdDone};
  if (npdDone){
    res.took = npdOn ? Math.max(0, workDaysBetween(day0, npdOn)) : null;
    res.met = res.took === null ? null : res.took <= SLA_DAYS;
    res.state = 'done';
  } else {
    res.current = stages.find(st => !st.done) || stages[stages.length - 1];
    res.state = elapsed > SLA_DAYS ? 'overdue' : stages.reduce((m, st) => rank[st.state] > rank[m] ? st.state : m, 'ok');
  }
  return res;
}

function fmtRM(n){ return 'RM ' + (n||0).toLocaleString('en-MY', {maximumFractionDigits:0}); }

/* V2 views on top of the V1 rules */
function inqState(i){
  if (isClosedInq(i)) return {k:'closed'};
  if (String(i.status||'').toUpperCase() === 'ON-HOLD') return {k:'hold'};
  const s = inquirySLA(i);
  if (!s) return {k:'open'};
  if (s.stalled && s.state !== 'done') return {k:'stalled', sla:s};
  if (s.state === 'done') return {k:'done', sla:s};
  return {k: s.state === 'overdue' ? 'over' : s.state, sla:s};
}
const INQ_RANK = {over:0, risk:1, stalled:2, ok:3, open:4, done:5, hold:6, closed:7};

const ST_PILL  = {over:'bad', risk:'warn', stalled:'info', ok:'ok', open:'', done:'done', hold:'hold', closed:''};
function inqStateLabel(i, st){
  st = st || inqState(i);
  if (st.k === 'closed') return i.outcome ? OUTCOME_LABELS[i.outcome] || 'Closed' : 'Closed';
  if (st.k === 'hold') return 'On hold';
  if (st.k === 'open') return i.outcome ? OUTCOME_LABELS[i.outcome] || 'Open' : 'Open';
  if (st.k === 'stalled') return 'Needs next step';
  if (st.k === 'done') return st.sla.met === false ? `SLA missed · ${st.sla.took} days` : st.sla.took == null ? 'SLA done' : `SLA met · ${st.sla.took} day${st.sla.took === 1 ? '' : 's'}`;
  return {over:'Overdue', risk:'At risk', ok:'On track'}[st.k] + ` · WD ${st.sla.elapsed}/${SLA_DAYS}`;
}
function projHealth(p){
  if (isClosedProj(p)) return 'done';
  const today = todayStr(), open = (p.tasks||[]).filter(t => !t.done);
  if (open.some(t => t.deadline && t.deadline < today) || (p.deliveryDate && p.deliveryDate < today)) return 'over';
  if (open.some(t => t.deadline && t.deadline <= addDays(today, 3)) || (p.deliveryDate && p.deliveryDate <= addDays(today, 14))) return 'risk';
  return 'ok';
}

/* ══════════ DATA: read, merge-safe save ══════════ */
const DB = { data: null, ts: '', by: '', source: '', ops: [], saving: false, timer: null, lastPull: 0, err: '', retry: 0 };
function normalize(d){ d = d || {}; d.inquiries = d.inquiries || []; d.projects = d.projects || []; d.mtasks = d.mtasks || []; d.bin = d.bin || []; d.schedule = d.schedule || {}; return d; }
const coll = (d, name) => (d && d[name]) || [];
const findRec = (d, name, id) => coll(d, name).find(x => x.id === id);
async function bridgeRead(){
  const r = await fetch(SHEETS_BRIDGE_URL + '?action=read&token=' + encodeURIComponent(SHEETS_BRIDGE_TOKEN) + '&_=' + Date.now(), {cache:'no-store'});
  const j = await r.json();
  if (j && j.error) throw new Error(j.error);
  if (!j || !j._data) throw new Error('empty');
  return j;
}
/* Instant first paint: V1's own local copy (same website, read-only — V2 never writes it) */
function loadV1Cache(){
  try { const raw = localStorage.getItem('npd_tracker_v3'); if (!raw) return false;
    DB.data = normalize(JSON.parse(raw)); DB.source = 'cache'; return true; } catch(e){ return false; }
}
async function pull(opts = {}){
  if (DB.saving || DB.ops.length){ return; }           // never replace data while our own edits are pending
  setSync('busy');
  try {
    const j = await bridgeRead();
    DB.lastPull = Date.now(); DB.err = '';
    const changed = j._updatedAt !== DB.ts || DB.source !== 'live';
    if (changed && !DB.ops.length && !DB.saving){
      DB.data = normalize(JSON.parse(j._data)); DB.ts = j._updatedAt || ''; DB.by = j._updatedBy || ''; DB.source = 'live';
      if (!opts.silent || opts.first) softRender(opts.first); else softRender(false);
    }
    setSync('ok');
    if (opts.manual) toast(changed ? `Loaded the latest data${DB.by ? ` · last saved by ${esc(String(DB.by))}` : ''}` : 'Already up to date', {icon:'check'});
  } catch(e){
    DB.err = String(e && e.message || e);
    setSync('err');
    if (opts.first && !DB.data) softRender(true);
    if (opts.manual) toast('Could not reach the Sheet. Showing the last copy on this device.', {icon:'x'});
  }
}
/* mutate: apply now (optimistic), queue the same patch for the merge-safe save */
function mutate(ops, opts = {}){
  if (!DB.data) return false;
  ops.forEach(op => { const r = findRec(DB.data, op.coll, op.id); if (r) op.fn(r); });
  DB.ops.push(...ops);
  clearTimeout(DB.timer); DB.timer = setTimeout(commit, SAVE_DEBOUNCE_MS);
  setSync('saving');
  if (!opts.noRender) softRender(false);
  return true;
}
async function commit(){
  DB.timer = null;
  if (!DB.ops.length) return;
  if (DB.saving){ DB.timer = setTimeout(commit, 600); return; }
  DB.saving = true; setSync('saving');
  let failed = false;
  const ops = DB.ops.splice(0);
  try {
    const j = await bridgeRead();                                   // 1. latest data from the Sheet
    const fresh = normalize(JSON.parse(j._data));
    const otherSaved = j._updatedAt && j._updatedAt !== DB.ts;
    let missing = 0;
    ops.forEach(op => { const r = findRec(fresh, op.coll, op.id); if (r) op.fn(r); else missing++; });   // 2. our patches only
    const ts = new Date().toISOString();
    const resp = await fetch(SHEETS_BRIDGE_URL, { method: 'POST', body: JSON.stringify({
      token: SHEETS_BRIDGE_TOKEN, _data: JSON.stringify(fresh), _updatedAt: ts, _updatedBy: meName() + ' (V2)' }) });
    const res = await resp.json();
    if (res && res.error){
      if (res.error === 'write_blocked'){ toast('The Sheet blocked this save as a safety check. Nothing was overwritten; reloading.', {icon:'x'}); DB.saving = false; DB.ops = []; DB.source = ''; failed = true; setTimeout(() => pull({}), 50); return; }
      throw new Error(res.error);
    }
    DB.data = fresh; DB.ts = ts; DB.by = meName() + ' (V2)'; DB.source = 'live'; DB.retry = 0;
    DB.ops.forEach(op => { const r = findRec(DB.data, op.coll, op.id); if (r) op.fn(r); });   // edits made while saving
    setSync('saved');
    if (otherSaved) toast('Merged with changes saved meanwhile in V1', {icon:'refresh'});
    if (missing) toast(`${missing} change${missing > 1 ? 's' : ''} skipped: the item was removed in V1`, {icon:'x'});
    softRender(false);
  } catch(e){
    failed = true;
    DB.ops.unshift(...ops);                                         // keep them and retry
    DB.retry = Math.min((DB.retry || 0) + 1, 6);
    setSync('err');
    toast('Not saved yet: no connection to the Sheet. Retrying…', {icon:'x'});
    clearTimeout(DB.timer); DB.timer = setTimeout(commit, 4000 * DB.retry);
  } finally {
    DB.saving = false;
    if (!failed && DB.ops.length && !DB.timer) DB.timer = setTimeout(commit, SAVE_DEBOUNCE_MS);
  }
}
addEventListener('beforeunload', e => { if (DB.ops.length || DB.saving){ e.preventDefault(); e.returnValue = ''; } });
setInterval(() => { if (AUTH.user && document.visibilityState === 'visible' && Date.now() - DB.lastPull > POLL_MS - 500) pull({silent:true}); }, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && AUTH.user && Date.now() - DB.lastPull > 8000) pull({silent:true}); });

/* sync pill */
function setSync(state){
  const s = $('#sync'), t = $('#sync-t'); if (!s) return;
  s.classList.toggle('busy', state === 'busy' || state === 'saving'); s.classList.toggle('err', state === 'err');
  const hm = d => d ? new Date(d).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : '';
  t.textContent = state === 'busy' ? 'Syncing…' : state === 'saving' ? 'Saving…' : state === 'err' ? (DB.ops.length ? 'Not saved · retrying' : 'Offline') : state === 'saved' ? `Saved ${hm(DB.ts)}` : `Synced ${hm(DB.lastPull)}`;

function setInqTaskDone(inqId, taskId, done){

/* ══════════ NOTIFICATIONS (V1 rules: missed · due soon · awaiting reply) ══════════ */
function snoozed(){ try { return JSON.parse(store.get('npd2-snooze', '{}')) || {}; } catch(e){ return {}; } }
function snooze(key, until){ const s = snoozed(); const today = todayStr(); Object.keys(s).forEach(k => { if (s[k] <= today) delete s[k]; }); if (until) s[key] = until; else delete s[key]; store.set('npd2-snooze', JSON.stringify(s)); }
function collectNotifications(scope){
  const d = DB.data; if (!d) return {missed:[], upcoming:[], awaiting:[]};
  const today = todayStr(), me = meName(), all = scope === 'all' && isLead();
  const vis = t => all || (t.pic || 'Adam') === me;
  const sn = snoozed();
  const missed = [], upcoming = [], awaiting = [];
  const push = (n, list) => { n.key = `${n.type}:${n.parentId}:${n.taskId}`; if (sn[n.key] && sn[n.key] > today) return; list.push(n); };
  d.inquiries.forEach(item => { if (isClosedInq(item)) return;
    (item.tasks||[]).filter(t => !t.done && vis(t)).forEach(t => {
      const n = {type:'inquiry', coll:'inquiries', parentId:item.id, taskId:t.id, parentCode:item.code, parentName:item.name, taskName:t.name, deadline:t.deadline, reminder:t.reminder, pic:t.pic||'Adam', fac: facOf(item)};
      if (t.status === 'awaiting-reply'){ if (!t.reminder || t.reminder <= today) push(n, awaiting); return; }
      if (!t.deadline) return;
      if (t.deadline < today) push(n, missed); else if (t.deadline <= addDays(today, TASK_UPCOMING_DAYS)) push(n, upcoming);
    });
  });
  d.projects.forEach(item => { if (isClosedProj(item)) return;
    (item.tasks||[]).filter(t => !t.done && vis(t)).forEach(t => {
      const n = {type:'project', coll:'projects', parentId:item.id, taskId:t.id, parentCode:item.code, parentName:item.name, taskName:t.name, deadline:t.deadline, reminder:t.reminder, pic:t.pic||'Adam', fac: facOf(item)};
      if (t.status === 'awaiting-reply'){ if (!t.reminder || t.reminder <= today) push(n, awaiting); return; }
      if (!t.deadline) return;
      if (t.deadline < today) push(n, missed); else if (t.deadline <= addDays(today, PROJECT_UPCOMING_DAYS)) push(n, upcoming);
    });
  });
  (d.mtasks||[]).filter(t => t.status !== 'done' && (all || (t.owner || 'Adam') === me)).forEach(t => {
    const n = {type:'mtask', coll:'mtasks', parentId:t.id, taskId:t.id, parentCode:'TASK', parentName:t.title, taskName:t.title, deadline:t.deadline, reminder:t.reminder, pic:t.owner||'Adam', fac:''};
    if (t.status === 'awaiting-reply'){ if (!t.reminder || t.reminder <= today) push(n, awaiting); return; }
    if (!t.deadline) return;
    if (t.deadline < today) push(n, missed); else if (t.deadline <= addDays(today, TASK_UPCOMING_DAYS)) push(n, upcoming);
  });
  missed.sort((a,b) => a.deadline < b.deadline ? -1 : 1);
  upcoming.sort((a,b) => a.deadline < b.deadline ? -1 : 1);
  awaiting.sort((a,b) => (a.reminder||'') < (b.reminder||'') ? -1 : 1);
  return {missed, upcoming, awaiting};
}
function canCompleteNotif(n){ return n.type === 'project' ? can('actions','complete') : n.type === 'mtask' ? can('tasks','complete') : can('inquiries','edit') || can('actions','complete'); }
function completeNotif(n, done = true){
  if (n.type === 'inquiry') return setInqTaskDone(n.parentId, n.taskId, done);
  if (n.type === 'project') return setProjTaskDone(n.parentId, n.taskId, done);
  return setMTaskDone(n.parentId, done);
}

function areaSVG(A, B, labels){

  const plen = arr => { let n = 0; for (let i = 1; i < arr.length; i++) n += Math.hypot(x(i)-x(i-1), y(arr[i])-y(arr[i-1])); return n.toFixed(0); };

  const ticks = [Math.round(mx/3), Math.round(mx*2/3), mx].filter((v,i,a) => v > 0 && a.indexOf(v) === i);

      <linearGradient id="ag2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c2);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--c2);stop-opacity:0"/></linearGradient>
      <pattern id="st1" width="6" height="5" patternUnits="userSpaceOnUse"><rect width="6" height="2" style="fill:var(--c1);fill-opacity:.16"/></pattern>
      <pattern id="st2" width="6" height="5" patternUnits="userSpaceOnUse"><rect width="6" height="2" style="fill:var(--c2);fill-opacity:.16"/></pattern></defs>
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}"/><text x="${R+8}" y="${y(v)+3.5}">${v}</text>`).join('')}
    <path class="fill" d="${line} L${ex} ${Bt} L${x(0)} ${Bt} Z" fill="url(#ag)"/><path class="stripe" d="${line} L${ex} ${Bt} L${x(0)} ${Bt} Z" fill="url(#st1)"/>
    <path class="fill" d="${line2} L${ex} ${Bt} L${x(0)} ${Bt} Z" fill="url(#ag2)"/><path class="stripe" d="${line2} L${ex} ${Bt} L${x(0)} ${Bt} Z" fill="url(#st2)"/>
    <path class="ln2" d="${line2}" style="--len:${plen(B)}"/><path class="ln" d="${line}" style="--len:${plen(A)}"/>

    <line class="scrub" id="scrub" x1="0" x2="0" y1="${T-8}" y2="${Bt}"/><circle class="sdot2" id="sdot2" r="5" cx="-20" cy="-20"/><circle class="sdot" id="sdot" r="6" cx="-20" cy="-20"/></svg>`;
}
function wireChart(){

  const sh = $('#sheet'), h = $('#shhead'); if (!h) return; const mobile = () => innerWidth <= 720; let sx = 0, sy = 0, d = 0, on = false, t0 = 0;
  h.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; on = true; sx = e.clientX; sy = e.clientY; t0 = performance.now(); sh.classList.add('dragging'); h.setPointerCapture(e.pointerId); });

/* ── notification swipe: right = done, left = snooze until tomorrow ── */
let sw = null;
document.addEventListener('pointerdown', e => {
  const fg = e.target.closest('.nfg'); if (!fg || e.target.closest('button')) return;
  sw = { row: fg.parentElement, fg, x: e.clientX, y: e.clientY, dx: 0, lock: null, id: e.pointerId };
});
document.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.lock){ if (Math.abs(dx) > 8 || Math.abs(dy) > 8){ sw.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; if (sw.lock === 'x'){ sw.row.classList.add('drag'); try { sw.fg.setPointerCapture(sw.id); } catch(_){} } } }
  if (sw.lock !== 'x') return;
  e.preventDefault();
  const w = sw.row.offsetWidth; sw.dx = Math.sign(dx) * Math.min(Math.abs(dx), w*.9);
  sw.row.dataset.dir = sw.dx > 0 ? 'r' : 'l'; sw.fg.style.setProperty('--dx', sw.dx + 'px');
  sw.row.classList.toggle('armed', Math.abs(sw.dx) > w*.35);
});
function notifByKey(k){ return NOTI.find(x => x.key === k); }
function notifDone(n, rowEl){
  if (!canCompleteNotif(n)){ toast("You don't have permission to complete this one", {icon:'x'}); return false; }
  const go2 = () => { completeNotif(n, true); toast(`“${esc(n.taskName)}” done`, {undo: () => completeNotif(n, false)}); };
  if (rowEl){ rowEl.style.height = rowEl.offsetHeight + 'px'; rowEl.classList.add('collapse'); setTimeout(go2, 380); } else go2();
  return true;
}
function notifSnooze(n, rowEl){
  snooze(n.key, addDays(todayStr(), 1));
  const after = () => { softRender(false); counts(); toast('Snoozed until tomorrow', {icon:'clock', undo: () => { snooze(n.key, ''); softRender(false); counts(); }}); };
  if (rowEl){ rowEl.style.height = rowEl.offsetHeight + 'px'; rowEl.classList.add('collapse'); setTimeout(after, 380); } else after();
}
const swipeEnd = e => {
  if (!sw || e.pointerId !== sw.id) return;
  const s = sw; sw = null; s.row.classList.remove('drag');
  if (s.lock !== 'x') return;
  const w = s.row.offsetWidth, n = notifByKey(s.row.dataset.nkey);
  if (n && Math.abs(s.dx) > w*.35){
    if (navigator.vibrate) try { navigator.vibrate(10); } catch(_){}
    if (s.dx > 0){ if (!canCompleteNotif(n)){ s.fg.style.setProperty('--dx','0px'); s.row.classList.remove('armed'); notifDone(n); return; }
      s.fg.style.setProperty('--dx', (w*1.1) + 'px'); setTimeout(() => notifDone(n, s.row), 180); }
    else { s.fg.style.setProperty('--dx', (-w*1.1) + 'px'); setTimeout(() => notifSnooze(n, s.row), 180); }
  } else { s.fg.style.setProperty('--dx', '0px'); s.row.classList.remove('armed'); }
};
document.addEventListener('pointerup', swipeEnd); document.addEventListener('pointercancel', swipeEnd);

}
function closePop(){ $('#pop').classList.remove('open'); }
function setLook(k){ if (k === S.look) return; vt(() => { S.look = k; store.set('npd2-look', k); applyPrefs(); $$('#pop .looks button').forEach(b => b.classList.toggle('on', b.dataset.look === k)); if (S.page === 'styles') render({keep:true}); }, 'style').then(() => { moveNav(false); $$('.seg').forEach(s => placeInd(s, false)); setTimeout(() => { moveNav(false); $$('.seg').forEach(s => placeInd(s, false)); }, 400); }); }
function toggleTheme(btn){
  const r = (btn || $('.theme-btn')).getBoundingClientRect(); root.style.setProperty('--rx', (r.left + r.width/2) + 'px'); root.style.setProperty('--ry', (r.top + r.height/2) + 'px');
  return vt(() => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; store.set('npd2-theme', S.theme); applyPrefs(); if (S.page === 'styles') render({keep:true}); const ts = $('#themeseg'); if (ts){ $$('button', ts).forEach(b => b.classList.toggle('on', b.dataset.v === S.theme)); placeInd(ts, false); } }, 'theme');
}

/* ══════════ SIGN IN (real Firebase account, same as V1) ══════════ */
const LG = { x: 0, max: () => $('#slide').clientWidth - 60 };
function lgSetX(v){ const sl = $('#slide'); LG.x = Math.max(0, Math.min(LG.max(), v)); sl.style.setProperty('--x', LG.x + 'px'); sl.querySelector('.slide-txt').style.opacity = String(Math.max(0, 1 - LG.x/LG.max()*1.6)); }
function lgError(msg, info){ const e = $('#lg-err'); e.textContent = msg || ''; e.classList.toggle('info', !!info); if (msg && !info){ const c = $('.lg-card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); } }
function lgReset(){ const sl = $('#slide'); sl.classList.remove('done','busy'); lgSetX(0); $('#thumb').innerHTML = ico('arrow', 22); }
function authMessage(e){
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Email or password is incorrect.';
  if (/invalid-email/.test(c)) return 'That email address looks wrong.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a minute, or reset your password.';
  if (/network/.test(c)) return 'No connection. Check your internet and try again.';
  if (/user-disabled/.test(c)) return 'This account is disabled. Ask the tracker owner.';
  return 'Could not sign in: ' + ((e && e.message) || 'unknown error');
}
async function attemptSignIn(){
  const sl = $('#slide'); if (sl.classList.contains('busy') || sl.classList.contains('done')) return;
  const email = $('#lg-email').value.trim(), pw = $('#lg-pass').value;
  if (!email || !pw){ lgError(!email ? 'Enter your email first.' : 'Enter your password first.'); lgReset(); (!email ? $('#lg-email') : $('#lg-pass')).focus(); return; }
  if (!window.firebase || !firebase.auth){ lgError('The sign-in service did not load. Check your connection and reload.'); lgReset(); return; }
  lgSetX(LG.max()); sl.classList.add('busy'); $('#thumb').innerHTML = '<i class="spin" style="border-top-color:var(--on-ac)"></i>'; lgError('');
  try {
    const keep = $('#lg-keep').checked;
    await firebase.auth().setPersistence(keep ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    LG.viaSlide = true;
    await firebase.auth().signInWithEmailAndPassword(email, pw);      // onAuthStateChanged takes it from here
  } catch(e){ LG.viaSlide = false; lgReset(); lgError(authMessage(e)); }
}
function initLogin(){
  $('#lg-hello').textContent = greet();
  const sl = $('#slide'), th = $('#thumb'); th.innerHTML = ico('arrow', 22);
  let on = false, sx = 0;
  th.addEventListener('pointerdown', e => { if (sl.classList.contains('done') || sl.classList.contains('busy')) return; on = true; sx = e.clientX - LG.x; sl.classList.add('drag'); th.setPointerCapture(e.pointerId); });
  th.addEventListener('pointermove', e => { if (on) lgSetX(e.clientX - sx); });
  const end = () => { if (!on) return; on = false; sl.classList.remove('drag'); if (LG.x > LG.max()*.85) attemptSignIn(); else lgSetX(0); };
  th.addEventListener('pointerup', end); th.addEventListener('pointercancel', end);
  th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); attemptSignIn(); } });
  $('#lgform').addEventListener('submit', e => { e.preventDefault(); attemptSignIn(); });
  $('#lg-forgot').addEventListener('click', async () => {
    const email = $('#lg-email').value.trim(); if (!email){ lgError('Type your email above, then tap “Forgot password?” again.'); $('#lg-email').focus(); return; }
    try { await firebase.auth().sendPasswordResetEmail(email); lgError('Reset email sent. Check your inbox.', true); } catch(e){ lgError(authMessage(e)); }
  });
}
function enterApp(){
  const lg = $('#login'), restored = lg.classList.contains('checking') && !LG.viaSlide;
  const show = () => { lg.classList.add('out'); $('#app').classList.remove('pre'); S.page = S.page || 'dashboard'; render(); setTimeout(() => { $('#app').style.transform = 'none'; $('#app').style.filter = 'none'; }, 1200); };
  if (restored){ show(); return; }
  const sl = $('#slide'), th = $('#thumb'); sl.classList.remove('busy'); sl.classList.add('done'); lgSetX(LG.max()); th.innerHTML = ico('check', 22);
  if (navigator.vibrate) try { navigator.vibrate(12); } catch(_){}
  const r = th.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 22, 120);
  setTimeout(show, S.motion === 'off' ? 0 : 380);
}
function showLogin(){
  const lg = $('#login'); lg.classList.remove('checking','out'); LG.viaSlide = false; lgReset(); lgError('');
  $('#app').style.transform = ''; $('#app').style.filter = ''; $('#app').classList.add('pre');
  const card = $('.lg-card'); card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  setTimeout(() => (($('#lg-email').value ? $('#lg-pass') : $('#lg-email'))).focus({preventScroll:true}), 400);
}
async function onSignedIn(user){
  AUTH.user = user;
  let profile = null;
  try {
    const doc = await Promise.race([AUTH.db.collection('users').doc(user.uid).get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
    if (doc.exists) profile = doc.data();
  } catch(e){ console.warn('profile', e); }
  const isMaster = user.email === MASTER_EMAIL;
  AUTH.profile = profile || { uid: user.uid, email: user.email, name: isMaster ? 'Adam' : (user.displayName || String(user.email).split('@')[0]), role: isMaster ? 'master' : 'member' };
  if (isMaster) AUTH.profile.role = 'master';
  setMe();
  if (!DB.data) loadV1Cache();
  enterApp();
  pull({first:true});
}
function onSignedOut(){
  AUTH.user = null; AUTH.profile = null; DB.data = null; DB.ts = ''; DB.source = ''; closeSheet(); closePop();
  showLogin();
}
function signOut(){
  if (DB.ops.length || DB.saving){ toast('Saving your last change first…', {icon:'clock'}); return; }
  toast('Sign out of NPD Tracker on this device? This also signs you out of V1 here.', {label:'Sign out', icon:'logout', ms:7000, undo: () => firebase.auth().signOut()});
}

/* ══════════ EVENTS ══════════ */
document.addEventListener('click', e => {
  const t = e.target;
  const g = t.closest('[data-go]'); if (g && !t.closest('#pop')){ go(g.dataset.go); return; }
  const o = t.closest('[data-open]'); if (o){ openSheet(o.dataset.open); return; }
  const pj = t.closest('[data-proj]'); if (pj){ go('project', {proj: pj.dataset.proj, src: pj.matches('.pcard,.bcard,.li') ? pj : null}); return; }
  const ap = t.closest('[data-apply]'); if (ap){ const k = ap.dataset.apply; setLook(k);
    if (k === 'I' && S.theme === 'dark') setTimeout(() => toast('Studio is designed light-first', {icon:'sun', label:'Switch to light', undo: () => toggleTheme()}), 500);
    if (k === 'J' && S.theme === 'light') setTimeout(() => toast('Graphite is designed dark-first', {icon:'moon', label:'Switch to dark', undo: () => toggleTheme()}), 500);
    return; }
  const f = t.closest('[data-fac]'); if (f){ S.fac = f.dataset.fac; vt(() => render({keep:true}), 'list'); return; }
  const lk = t.closest('#pop [data-look]'); if (lk){ setLook(lk.dataset.look); return; }
  const it = t.closest('[data-itask]'); if (it){ toggleInqTask(it.dataset.itask, it.dataset.done === '1', it); return; }
  const ptk = t.closest('[data-ptask]'); if (ptk){ toggleProjTask(ptk.dataset.ptask, ptk.dataset.done === '1', ptk); return; }
  const nd = t.closest('[data-ndone]'); if (nd){ const n = notifByKey(nd.dataset.ndone); if (n) notifDone(n, nd.closest('.nrow')); return; }
  const no = t.closest('[data-nopen]'); if (no){ const n = notifByKey(no.dataset.nopen); if (!n) return; if (n.type === 'inquiry') openSheet(n.parentId); else if (n.type === 'project') go('project', {proj:n.parentId}); return; }
  const sb = t.closest('.seg button'); if (sb){ const seg = sb.parentElement, v = sb.dataset.v; if (sb.classList.contains('on')) return;
    const prevIdx = $$('button', seg).findIndex(b => b.classList.contains('on'));
    $$('button', seg).forEach(b => { b.classList.toggle('on', b === sb); b.setAttribute('aria-selected', b === sb); }); placeInd(seg);
    const newIdx = $$('button', seg).indexOf(sb);
    if (seg.id === 'rseg'){ S.range = v; const vw = $('#view'); vw.innerHTML = pageDashboard(); hydrateIcons(vw); requestAnimationFrame(() => { countUp(vw); wireChart(); }); }
    else if (seg.id === 'pseg'){ S.pview = v; vt(() => { $('#pbody').innerHTML = projBody(false); $('#pseg').nextElementSibling.textContent = v === 'board' ? 'One row per status: not started, in progress, completed.' : 'Grouped by what needs you first.'; }, 'list'); }
    else if (seg.id === 'fseg'){ S.filter = v; vt(() => { $('#rows').innerHTML = inqRows(); }, 'list'); }
    else if (seg.id === 'tseg'){ S.tab = v; const p = findRec(DB.data, 'projects', S.proj), tb = $('#tabbody'); if (p){ tb.innerHTML = tabBody(p); tb.className = 'tabbody'; void tb.offsetWidth; tb.classList.add(newIdx > prevIdx ? 'swap-r' : 'swap-l'); } }
    else if (seg.id === 'pbseg'){ const p = findRec(DB.data, 'projects', S.proj); if (!p) return; const prev = p.ballWith || ''; setBall('projects', p.id, v); toast(`Ball passed to ${esc(BALL_LABELS[v])}`, {icon:'arrow', undo: () => setBall('projects', p.id, prev)}); }
    else if (seg.id === 'ibseg'){ const i = findRec(DB.data, 'inquiries', sheetId); if (!i) return; const prev = i.ballWith || ''; setBall('inquiries', i.id, v); toast(v ? `Ball passed to ${esc(BALL_LABELS[v])}` : 'Ball in court cleared', {icon:'arrow', undo: () => setBall('inquiries', i.id, prev)}); }
    else if (seg.id === 'ioseg'){ const i = findRec(DB.data, 'inquiries', sheetId); if (!i) return; const prev = i.outcome || ''; setOutcome(i.id, v); if (v === 'won'){ const r = sb.getBoundingClientRect(); burst(r.left + r.width/2, r.top, 40, 180); } toast(v ? `Marked as ${OUTCOME_LABELS[v].toLowerCase()}` : 'Outcome reset to open', {icon: v === 'won' ? 'trophy' : 'check', undo: () => setOutcome(i.id, prev)}); }
    else if (seg.id === 'nseg'){ S.nscope = v; vt(() => render({keep:true}), 'list'); }
    else if (seg.id === 'themeseg'){ if (v !== S.theme) toggleTheme(sb); }
    else if (seg.id === 'motionseg'){ S.motion = v; store.set('npd2-motion', v); applyPrefs(); toast(`Motion: ${sb.textContent}`, {icon:'spark'}); }
    return; }
  const a = t.closest('[data-act]'); if (a){ const act = a.dataset.act;
    if (act === 'cmdk') openCmd(); else if (act === 'theme') toggleTheme(a); else if (act === 'sync') pull({manual:true}); else if (act === 'signout') signOut();
    else if (act === 'settings'){ $('#pop').classList.contains('open') ? closePop() : openPop(a); } else if (act === 'closesheet') closeSheet();
    else if (act === 'styles'){ closePop(); go('styles'); }
    else if (act === 'toggledone'){ S.showDone = !S.showDone; vt(() => { $('#pbody').innerHTML = projBody(false); }, 'list'); }
    else if (act === 'pin-inq'){ const i = findRec(DB.data, 'inquiries', sheetId); if (i){ const on = !i.pinned; setPin('inquiries', i.id, on); toast(on ? 'Pinned to the sidebar' : 'Unpinned', {icon:'pin', undo: () => setPin('inquiries', i.id, !on)}); } }
    else if (act === 'pin-proj'){ const p = findRec(DB.data, 'projects', S.proj); if (p){ const on = !p.pinned; setPin('projects', p.id, on); toast(on ? 'Pinned to the sidebar' : 'Unpinned', {icon:'pin', undo: () => setPin('projects', p.id, !on)}); } }
    return; }
  if (!t.closest('#pop')) closePop();
});
document.addEventListener('keydown', e => {
  if (!AUTH.user) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#cmdk').classList.contains('open') ? closeCmd() : openCmd(); }
  if (e.key === 'Escape'){ closeCmd(); closeSheet(); closePop(); }
  if (e.key === 'Enter' && e.target.matches('.kpi')) e.target.click();
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('input', e => { if (e.target.id === 'q'){ S.q = e.target.value; clearTimeout(S._qt); S._qt = setTimeout(() => vt(() => { $('#rows').innerHTML = inqRows(); }, 'list'), 160); } });
addEventListener('resize', () => { moveNav(false); $$('.seg').forEach(s => placeInd(s, false)); wireScroll(); });
$('#totop').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`;
$('#totop').addEventListener('click', () => $('#view').scrollTo({top: 0, behavior: S.motion === 'off' ? 'auto' : 'smooth'}));
setInterval(() => { if (AUTH.user && !DB.saving && !DB.ops.length && !DB.err) setSync('ok'); }, 30000);

/* ══════════ BOOT ══════════ */
hydrateIcons(); initLogin(); moveNav(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (!window.firebase || !firebase.initializeApp){
  showLogin(); lgError('The sign-in service did not load. Check your connection and reload the page.');
} else {
  try { if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); AUTH.db = firebase.firestore(); } catch(e){ console.error(e); }
  firebase.auth().onAuthStateChanged(u => { if (u) onSignedIn(u); else onSignedOut(); });
}
window.__npd2 = { S, DB, AUTH, go, openSheet, pull, commit, mutate, render };
})();

</script>
